<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width,initial-scale=1.0" name="viewport"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
    }
  </style>
</head>
<body>
<!-- STITCH_THREEJS_START:ANIMATION_30 class="fixed inset-0 w-full h-full bg-transparent" -->
<div class="fixed inset-0 w-full h-full bg-transparent" style="display:block;">
<script src="https://ajax.googleapis.com/ajax/libs/threejs/r125/three.min.js"></script>
<div id="threejs-container-ANIMATION_30" style="width:100%;height:100%"></div>
<script>
(function() {
  const container = document.getElementById('threejs-container-ANIMATION_30');
  const devicePixelRatio = window.devicePixelRatio || 1;
  // SAMVAYA Intelligence Assistant — 3D Atmospheric Earth & Conversational Spatial Context Engine
// Features: Interactive 3D Earth globe with real-time conversational triggers,
// dynamic camera transitions based on assistant queries (e.g. Mysuru focal point, Bengaluru comparative vector,
// spatial risk plume, and model trust overlay), warm atmospheric lighting, and clean public API hooks.

const container = document.getElementById('threejs-container-ANIMATION_ASSISTANT') || document.querySelector('threejs-scene') || document.body;
const width = container.clientWidth || window.innerWidth;
const height = container.clientHeight || window.innerHeight;

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(40, width / height, 0.1, 1000);
camera.position.set(-1.4, 0.9, 11.4); // Angled to sit beautifully as a side/background spatial anchor

const renderer = new THREE.WebGLRenderer({ alpha: true, antialias: true, powerPreference: "high-performance" });
renderer.setSize(width, height);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
container.appendChild(renderer.domElement);

// Warm atmospheric scientific illumination
const ambientLight = new THREE.AmbientLight(0xfff7ee, 1.6);
scene.add(ambientLight);

const sunLight = new THREE.DirectionalLight(0xffeedd, 2.7);
sunLight.position.set(16, 14, 14);
scene.add(sunLight);

const warmFill = new THREE.DirectionalLight(0xdf7a28, 1.0);
warmFill.position.set(-14, -6, -8);
scene.add(warmFill);

// Main Planetary Group
const earthGroup = new THREE.Group();
earthGroup.position.set(-1.0, -0.15, 0); // Positioned toward left/center to leave ample stage for assistant dialogues
scene.add(earthGroup);

// Canvas procedural texture for Earth & Atmospheric Layers
const canvas = document.createElement('canvas');
canvas.width = 2048;
canvas.height = 1024;
const ctx = canvas.getContext('2d');

function toCanvasX(lon) { return ((lon + 180) / 360) * 2048; }
function toCanvasY(lat) { return ((90 - lat) / 180) * 1024; }

let currentActiveMode = 'normal'; // 'normal', 'rain_risk', 'disagreement', 'verification', 'compare'

function drawAssistantEarth(mode) {
  // Deep oceanic slate/blue
  ctx.fillStyle = '#0f1722';
  ctx.fillRect(0, 0, 2048, 1024);

  const oceanGrad = ctx.createLinearGradient(0, 0, 0, 1024);
  oceanGrad.addColorStop(0, '#0a1018');
  oceanGrad.addColorStop(0.5, '#162232');
  oceanGrad.addColorStop(1, '#0a1018');
  ctx.fillStyle = oceanGrad;
  ctx.fillRect(0, 0, 2048, 1024);

  // Continental landmasses
  ctx.fillStyle = '#392c20';

  // Indian Subcontinent & South Asia
  ctx.beginPath();
  ctx.moveTo(toCanvasX(68), toCanvasY(24));
  ctx.lineTo(toCanvasX(73), toCanvasY(35));
  ctx.lineTo(toCanvasX(80), toCanvasY(33));
  ctx.lineTo(toCanvasX(92), toCanvasY(27));
  ctx.lineTo(toCanvasX(91), toCanvasY(20));
  ctx.lineTo(toCanvasX(82), toCanvasY(13));
  ctx.lineTo(toCanvasX(77.5), toCanvasY(8));
  ctx.lineTo(toCanvasX(72.5), toCanvasY(16));
  ctx.lineTo(toCanvasX(68), toCanvasY(24));
  ctx.closePath();
  ctx.fill();

  // Highlight India
  ctx.fillStyle = '#7a3e1d';
  ctx.beginPath();
  ctx.moveTo(toCanvasX(70), toCanvasY(23));
  ctx.lineTo(toCanvasX(74), toCanvasY(32));
  ctx.lineTo(toCanvasX(86), toCanvasY(27));
  ctx.lineTo(toCanvasX(80), toCanvasY(14));
  ctx.lineTo(toCanvasX(77.5), toCanvasY(9));
  ctx.lineTo(toCanvasX(74), toCanvasY(17));
  ctx.closePath();
  ctx.fill();

  // Sri Lanka
  ctx.beginPath();
  ctx.arc(toCanvasX(80.5), toCanvasY(7.5), 10, 0, Math.PI * 2);
  ctx.fill();

  // Arabian Peninsula
  ctx.fillStyle = '#4c3725';
  ctx.beginPath();
  ctx.moveTo(toCanvasX(35), toCanvasY(32));
  ctx.lineTo(toCanvasX(55), toCanvasY(31));
  ctx.lineTo(toCanvasX(60), toCanvasY(24));
  ctx.lineTo(toCanvasX(54), toCanvasY(15));
  ctx.lineTo(toCanvasX(44), toCanvasY(12));
  ctx.lineTo(toCanvasX(42), toCanvasY(25));
  ctx.closePath();
  ctx.fill();

  // Africa
  ctx.beginPath();
  ctx.moveTo(toCanvasX(12), toCanvasY(36));
  ctx.lineTo(toCanvasX(32), toCanvasY(32));
  ctx.lineTo(toCanvasX(51), toCanvasY(12));
  ctx.lineTo(toCanvasX(42), toCanvasY(-10));
  ctx.lineTo(toCanvasX(30), toCanvasY(-34));
  ctx.lineTo(toCanvasX(17), toCanvasY(-34));
  ctx.lineTo(toCanvasX(8), toCanvasY(4));
  ctx.lineTo(toCanvasX(-16), toCanvasY(12));
  ctx.lineTo(toCanvasX(0), toCanvasY(35));
  ctx.closePath();
  ctx.fill();

  // Eurasia
  ctx.beginPath();
  ctx.moveTo(toCanvasX(60), toCanvasY(35));
  ctx.lineTo(toCanvasX(125), toCanvasY(42));
  ctx.lineTo(toCanvasX(145), toCanvasY(65));
  ctx.lineTo(toCanvasX(55), toCanvasY(68));
  ctx.closePath();
  ctx.fill();

  // Southeast Asia & Australia
  ctx.beginPath();
  ctx.moveTo(toCanvasX(96), toCanvasY(20));
  ctx.lineTo(toCanvasX(108), toCanvasY(11));
  ctx.lineTo(toCanvasX(102), toCanvasY(1));
  ctx.lineTo(toCanvasX(98), toCanvasY(10));
  ctx.closePath();
  ctx.fill();

  ctx.beginPath();
  ctx.ellipse(toCanvasX(134), toCanvasY(-25), 110, 76, 0, 0, Math.PI * 2);
  ctx.fill();

  // Contextual Dynamic Atmospheric Layers based on Assistant Conversation Mode
  const fX = toCanvasX(76.6394);
  const fY = toCanvasY(12.2958);

  if (mode === 'rain_risk') {
    // Heavy rain convective footprint
    const rainGrad = ctx.createRadialGradient(fX, fY, 15, fX, fY, 240);
    rainGrad.addColorStop(0, 'rgba(217, 119, 6, 0.85)');
    rainGrad.addColorStop(0.4, 'rgba(14, 165, 233, 0.55)');
    rainGrad.addColorStop(1, 'rgba(14, 165, 233, 0)');
    ctx.fillStyle = rainGrad;
    ctx.beginPath();
    ctx.arc(fX, fY, 240, 0, Math.PI * 2);
    ctx.fill();
  } else if (mode === 'disagreement') {
    // Model divergence spread field
    const disGrad = ctx.createRadialGradient(fX, fY, 20, fX, fY, 260);
    disGrad.addColorStop(0, 'rgba(234, 179, 8, 0.65)');
    disGrad.addColorStop(0.5, 'rgba(239, 68, 68, 0.4)');
    disGrad.addColorStop(1, 'rgba(234, 179, 8, 0)');
    ctx.fillStyle = disGrad;
    ctx.beginPath();
    ctx.arc(fX, fY, 260, 0, Math.PI * 2);
    ctx.fill();
  } else if (mode === 'verification') {
    // Verified ground convergence
    const verGrad = ctx.createRadialGradient(fX, fY, 15, fX, fY, 200);
    verGrad.addColorStop(0, 'rgba(34, 197, 94, 0.7)');
    verGrad.addColorStop(0.6, 'rgba(101, 163, 13, 0.3)');
    verGrad.addColorStop(1, 'rgba(34, 197, 94, 0)');
    ctx.fillStyle = verGrad;
    ctx.beginPath();
    ctx.arc(fX, fY, 200, 0, Math.PI * 2);
    ctx.fill();
  } else if (mode === 'compare') {
    // Dual regional connection line between Mysuru & Bengaluru
    const bX = toCanvasX(77.5946);
    const bY = toCanvasY(12.9716);
    ctx.strokeStyle = 'rgba(217, 119, 6, 0.8)';
    ctx.lineWidth = 4;
    ctx.setLineDash([8, 6]);
    ctx.beginPath();
    ctx.moveTo(fX, fY);
    ctx.lineTo(bX, bY);
    ctx.stroke();
    ctx.setLineDash([]);
  } else {
    // Baseline thermal atmosphere
    const tGrad = ctx.createRadialGradient(fX, fY, 10, fX, fY, 180);
    tGrad.addColorStop(0, 'rgba(245, 158, 11, 0.5)');
    tGrad.addColorStop(0.6, 'rgba(217, 119, 6, 0.2)');
    tGrad.addColorStop(1, 'rgba(245, 158, 11, 0)');
    ctx.fillStyle = tGrad;
    ctx.beginPath();
    ctx.arc(fX, fY, 180, 0, Math.PI * 2);
    ctx.fill();
  }

  // Scientific latitude & longitude coordinate grid lines
  ctx.strokeStyle = 'rgba(255, 255, 255, 0.07)';
  ctx.lineWidth = 1.2;
  for (let lat = -80; lat <= 80; lat += 20) {
    ctx.beginPath();
    ctx.moveTo(0, toCanvasY(lat));
    ctx.lineTo(2048, toCanvasY(lat));
    ctx.stroke();
  }
  for (let lon = -180; lon <= 180; lon += 30) {
    ctx.beginPath();
    ctx.moveTo(toCanvasX(lon), 0);
    ctx.lineTo(toCanvasX(lon), 1024);
    ctx.stroke();
  }
}

drawAssistantEarth(currentActiveMode);
const earthTexture = new THREE.CanvasTexture(canvas);
earthTexture.wrapS = THREE.RepeatWrapping;

// Globe Sphere Mesh
const globeRadius = 4.65;
const globeGeometry = new THREE.SphereGeometry(globeRadius, 64, 64);
const globeMaterial = new THREE.MeshPhongMaterial({
  map: earthTexture,
  bumpScale: 0.06,
  specular: new THREE.Color(0x384556),
  shininess: 16,
  emissive: new THREE.Color(0x161009),
  emissiveIntensity: 0.18
});
const globeMesh = new THREE.Mesh(globeGeometry, globeMaterial);
earthGroup.add(globeMesh);

// Cloud Layer
const cloudCanvas = document.createElement('canvas');
cloudCanvas.width = 1024;
cloudCanvas.height = 512;
const cCtx = cloudCanvas.getContext('2d');
cCtx.fillStyle = 'rgba(0,0,0,0)';
cCtx.fillRect(0, 0, 1024, 512);
cCtx.fillStyle = 'rgba(255, 250, 242, 0.44)';
for (let i = 0; i < 38; i++) {
  const cx = Math.random() * 1024;
  const cy = 80 + Math.random() * 340;
  const rx = 35 + Math.random() * 100;
  const ry = 8 + Math.random() * 24;
  cCtx.beginPath();
  cCtx.ellipse(cx, cy, rx, ry, (Math.random() - 0.5) * 0.4, 0, Math.PI * 2);
  cCtx.fill();
}
const cloudTexture = new THREE.CanvasTexture(cloudCanvas);
const cloudGeo = new THREE.SphereGeometry(globeRadius + 0.08, 64, 64);
const cloudMat = new THREE.MeshLambertMaterial({
  map: cloudTexture,
  transparent: true,
  opacity: 0.50,
  blending: THREE.NormalBlending
});
const cloudMesh = new THREE.Mesh(cloudGeo, cloudMat);
earthGroup.add(cloudMesh);

// Atmospheric Halo
const haloGeo = new THREE.SphereGeometry(globeRadius + 0.44, 48, 48);
const haloMat = new THREE.ShaderMaterial({
  vertexShader: `
    varying vec3 vNormal;
    void main() {
      vNormal = normalize(normalMatrix * normal);
      gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
    }
  `,
  fragmentShader: `
    varying vec3 vNormal;
    void main() {
      float intensity = pow(0.66 - dot(vNormal, vec3(0, 0, 1.0)), 2.6);
      vec3 atmosphericColor = mix(vec3(0.88, 0.48, 0.16), vec3(0.98, 0.89, 0.78), intensity * 0.65);
      gl_FragColor = vec4(atmosphericColor, intensity * 0.76);
    }
  `,
  blending: THREE.AdditiveBlending,
  side: THREE.BackSide,
  transparent: true
});
const haloMesh = new THREE.Mesh(haloGeo, haloMat);
earthGroup.add(haloMesh);

// Location Markers: Mysuru & Bengaluru
function calculatePinPos(lat, lon, rOffset = 0.12) {
  const phi = (90 - lat) * (Math.PI / 180);
  const theta = (lon + 180) * (Math.PI / 180);
  const pinR = globeRadius + rOffset;
  return new THREE.Vector3(
    -pinR * Math.sin(phi) * Math.cos(theta),
    pinR * Math.cos(phi),
    pinR * Math.sin(phi) * Math.sin(theta)
  );
}

const pinsGroup = new THREE.Group();
earthGroup.add(pinsGroup);

const ASSISTANT_PINS = [
  { id: 'mysuru', name: 'Mysuru', lat: 12.2958, lon: 76.6394, color: 0xc25e1a },
  { id: 'bengaluru', name: 'Bengaluru', lat: 12.9716, lon: 77.5946, color: 0xd97706 }
];

const pinMeshes = {};
ASSISTANT_PINS.forEach(p => {
  const grp = new THREE.Group();
  const pos = calculatePinPos(p.lat, p.lon);
  grp.position.copy(pos);

  const cGeo = new THREE.SphereGeometry(0.12, 16, 16);
  const cMat = new THREE.MeshBasicMaterial({ color: p.color });
  const cMesh = new THREE.Mesh(cGeo, cMat);
  grp.add(cMesh);

  const rGeo = new THREE.RingGeometry(0.18, 0.32, 32);
  const rMat = new THREE.MeshBasicMaterial({ color: p.color, side: THREE.DoubleSide, transparent: true, opacity: 0.85 });
  const rMesh = new THREE.Mesh(rGeo, rMat);
  rMesh.lookAt(pos.clone().normalize());
  grp.add(rMesh);

  pinsGroup.add(grp);
  pinMeshes[p.id] = { group: grp, ring: rMesh };
});

// Initial Camera Orientation centered over South India
earthGroup.rotation.y = -1.80;
earthGroup.rotation.x = 0.20;

// Interactive Drag Rotation
let isDragging = false;
let prevMouse = { x: 0, y: 0 };
let targetRotY = earthGroup.rotation.y;
let targetRotX = earthGroup.rotation.x;

function onPointerDown(e) {
  isDragging = true;
  prevMouse = { x: e.clientX || (e.touches && e.touches[0].clientX), y: e.clientY || (e.touches && e.touches[0].clientY) };
}

function onPointerMove(e) {
  if (!isDragging) return;
  const x = e.clientX || (e.touches && e.touches[0].clientX);
  const y = e.clientY || (e.touches && e.touches[0].clientY);
  const dx = x - prevMouse.x;
  const dy = y - prevMouse.y;
  targetRotY += dx * 0.005;
  targetRotX += dy * 0.005;
  targetRotX = Math.max(-0.85, Math.min(0.85, targetRotX));
  prevMouse = { x, y };
}

function onPointerUp() { isDragging = false; }

window.addEventListener('mousedown', onPointerDown);
window.addEventListener('mousemove', onPointerMove);
window.addEventListener('mouseup', onPointerUp);
window.addEventListener('touchstart', onPointerDown, { passive: true });
window.addEventListener('touchmove', onPointerMove, { passive: true });
window.addEventListener('touchend', onPointerUp);

// Public API hooks for Assistant DOM communication
window.samvayaAssistantSetMode = function(modeName) {
  currentActiveMode = modeName;
  drawAssistantEarth(currentActiveMode);
  earthTexture.needsUpdate = true;
};

window.samvayaAssistantFlyTo = function(lat, lon) {
  const tLon = (lon + 180) * (Math.PI / 180);
  targetRotY = -tLon + Math.PI / 2;
  targetRotX = lat * (Math.PI / 180);
};

window.samvayaAssistantZoom = function(delta) {
  camera.position.z = Math.max(7.2, Math.min(16, camera.position.z + delta));
};

function handleResize() {
  const w = container.clientWidth || window.innerWidth;
  const h = container.clientHeight || window.innerHeight;
  camera.aspect = w / h;
  camera.updateProjectionMatrix();
  renderer.setSize(w, h);
}
window.addEventListener('resize', handleResize);

let clock = new THREE.Clock();
function animate() {
  requestAnimationFrame(animate);
  const t = clock.getElapsedTime();

  earthGroup.rotation.y += (targetRotY - earthGroup.rotation.y) * 0.08;
  earthGroup.rotation.x += (targetRotX - earthGroup.rotation.x) * 0.08;

  cloudMesh.rotation.y += 0.0008;

  // Pulse beacons
  Object.keys(pinMeshes).forEach(k => {
    const item = pinMeshes[k];
    const s = 1.0 + Math.sin(t * 3.2) * 0.28;
    item.ring.scale.set(s, s, s);
    item.ring.material.opacity = 0.85 - (s - 0.7) * 0.5;
  });

  renderer.render(scene, camera);
}
animate();

})();
</script>
</div>
<!-- STITCH_THREEJS_END:ANIMATION_30 -->
</body>
</html>
