<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width,initial-scale=1.0" name="viewport"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
    }
  </style>
</head>
<body>
<!-- STITCH_THREEJS_START:ANIMATION_18 class="fixed inset-0 w-full h-full bg-transparent" -->
<div class="fixed inset-0 w-full h-full bg-transparent" style="display:block;">
<script src="https://ajax.googleapis.com/ajax/libs/threejs/r125/three.min.js"></script>
<div id="threejs-container-ANIMATION_18" style="width:100%;height:100%"></div>
<script>
(function() {
  const container = document.getElementById('threejs-container-ANIMATION_18');
  const devicePixelRatio = window.devicePixelRatio || 1;
  // SAMVAYA Forecast Verification Lab — 3D Earth Spatial Verification & Error Field Simulation
// Features: Interactive Earth globe, localized verification domain (Mysuru: 12.2958° N, 76.6394° E),
// Spatial Error Field layer visualization (Observed vs Forecast vs Error Heatfield),
// Lead horizon transitions, and real-time verification state simulation.

const container = document.getElementById('threejs-container-ANIMATION_VERIFICATION') || document.querySelector('threejs-scene') || document.body;
const width = container.clientWidth || window.innerWidth;
const height = container.clientHeight || window.innerHeight;

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(40, width / height, 0.1, 1000);
camera.position.set(-1.1, 1.1, 10.9); // Complementing the left/center layout for verification controls

const renderer = new THREE.WebGLRenderer({ alpha: true, antialias: true, powerPreference: "high-performance" });
renderer.setSize(width, height);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
container.appendChild(renderer.domElement);

// Lighting: Warm scientific illumination
const ambientLight = new THREE.AmbientLight(0xfff7ee, 1.6);
scene.add(ambientLight);

const sunLight = new THREE.DirectionalLight(0xffeedd, 2.7);
sunLight.position.set(16, 14, 14);
scene.add(sunLight);

const warmFill = new THREE.DirectionalLight(0xdf7a28, 1.0);
warmFill.position.set(-14, -6, -8);
scene.add(warmFill);

// Main Planetary Group
const earthGroup = new THREE.Group();
earthGroup.position.set(-0.75, -0.15, 0);
scene.add(earthGroup);

// Canvas procedural texture for Earth & Verification Error Gradients
const canvas = document.createElement('canvas');
canvas.width = 2048;
canvas.height = 1024;
const ctx = canvas.getContext('2d');

function toCanvasX(lon) { return ((lon + 180) / 360) * 2048; }
function toCanvasY(lat) { return ((90 - lat) / 180) * 1024; }

let currentVerificationLayer = 'error'; // 'observed', 'forecast', 'error'
let currentVariable = 'temperature';    // 'temperature', 'precipitation', 'wind', 'pressure'
let currentHorizon = 24;                 // 6h, 12h, 24h, 48h
let currentSimState = 'state1';          // 'state1' (high agreement), 'state2' (divergence), 'state3' (transition), 'state4' (extreme)

function drawVerificationEarth(layer, variable, horizon, state) {
  // Deep oceanic slate/blue
  ctx.fillStyle = '#0f1722';
  ctx.fillRect(0, 0, 2048, 1024);

  const oceanGrad = ctx.createLinearGradient(0, 0, 0, 1024);
  oceanGrad.addColorStop(0, '#0a1018');
  oceanGrad.addColorStop(0.5, '#162232');
  oceanGrad.addColorStop(1, '#0a1018');
  ctx.fillStyle = oceanGrad;
  ctx.fillRect(0, 0, 2048, 1024);

  // Continental landmasses
  ctx.fillStyle = '#392c20';

  // Indian Subcontinent & South Asia
  ctx.beginPath();
  ctx.moveTo(toCanvasX(68), toCanvasY(24));
  ctx.lineTo(toCanvasX(73), toCanvasY(35));
  ctx.lineTo(toCanvasX(80), toCanvasY(33));
  ctx.lineTo(toCanvasX(92), toCanvasY(27));
  ctx.lineTo(toCanvasX(91), toCanvasY(20));
  ctx.lineTo(toCanvasX(82), toCanvasY(13));
  ctx.lineTo(toCanvasX(77.5), toCanvasY(8));
  ctx.lineTo(toCanvasX(72.5), toCanvasY(16));
  ctx.lineTo(toCanvasX(68), toCanvasY(24));
  ctx.closePath();
  ctx.fill();

  // Highlight India
  ctx.fillStyle = '#7a3e1d';
  ctx.beginPath();
  ctx.moveTo(toCanvasX(70), toCanvasY(23));
  ctx.lineTo(toCanvasX(74), toCanvasY(32));
  ctx.lineTo(toCanvasX(86), toCanvasY(27));
  ctx.lineTo(toCanvasX(80), toCanvasY(14));
  ctx.lineTo(toCanvasX(77.5), toCanvasY(9));
  ctx.lineTo(toCanvasX(74), toCanvasY(17));
  ctx.closePath();
  ctx.fill();

  // Sri Lanka
  ctx.beginPath();
  ctx.arc(toCanvasX(80.5), toCanvasY(7.5), 10, 0, Math.PI * 2);
  ctx.fill();

  // Arabian Peninsula
  ctx.fillStyle = '#4c3725';
  ctx.beginPath();
  ctx.moveTo(toCanvasX(35), toCanvasY(32));
  ctx.lineTo(toCanvasX(55), toCanvasY(31));
  ctx.lineTo(toCanvasX(60), toCanvasY(24));
  ctx.lineTo(toCanvasX(54), toCanvasY(15));
  ctx.lineTo(toCanvasX(44), toCanvasY(12));
  ctx.lineTo(toCanvasX(42), toCanvasY(25));
  ctx.closePath();
  ctx.fill();

  // Africa
  ctx.beginPath();
  ctx.moveTo(toCanvasX(12), toCanvasY(36));
  ctx.lineTo(toCanvasX(32), toCanvasY(32));
  ctx.lineTo(toCanvasX(51), toCanvasY(12));
  ctx.lineTo(toCanvasX(42), toCanvasY(-10));
  ctx.lineTo(toCanvasX(30), toCanvasY(-34));
  ctx.lineTo(toCanvasX(17), toCanvasY(-34));
  ctx.lineTo(toCanvasX(8), toCanvasY(4));
  ctx.lineTo(toCanvasX(-16), toCanvasY(12));
  ctx.lineTo(toCanvasX(0), toCanvasY(35));
  ctx.closePath();
  ctx.fill();

  // Eurasia
  ctx.beginPath();
  ctx.moveTo(toCanvasX(60), toCanvasY(35));
  ctx.lineTo(toCanvasX(125), toCanvasY(42));
  ctx.lineTo(toCanvasX(145), toCanvasY(65));
  ctx.lineTo(toCanvasX(55), toCanvasY(68));
  ctx.closePath();
  ctx.fill();

  // Southeast Asia & Australia
  ctx.beginPath();
  ctx.moveTo(toCanvasX(96), toCanvasY(20));
  ctx.lineTo(toCanvasX(108), toCanvasY(11));
  ctx.lineTo(toCanvasX(102), toCanvasY(1));
  ctx.lineTo(toCanvasX(98), toCanvasY(10));
  ctx.closePath();
  ctx.fill();

  ctx.beginPath();
  ctx.ellipse(toCanvasX(134), toCanvasY(-25), 110, 76, 0, 0, Math.PI * 2);
  ctx.fill();

  // Verification Visual Layer Rendering
  const centerX = toCanvasX(76.6394);
  const centerY = toCanvasY(12.2958);

  if (layer === 'error') {
    // Spatial Error Field (Delta between Forecast vs Ground Reference)
    // Subdued scientific gradient: Neutral/Low Error (soft olive/cream) to Moderate/High Error (terracotta/amber)
    let spreadRadius = horizon === 6 ? 160 : horizon === 12 ? 200 : horizon === 24 ? 260 : 340;
    
    const errGrad = ctx.createRadialGradient(centerX, centerY, 15, centerX, centerY, spreadRadius);
    if (state === 'state1') {
      // Low Error state (+0.3°C - +0.6°C error)
      errGrad.addColorStop(0, 'rgba(101, 163, 13, 0.65)'); // Very low bias
      errGrad.addColorStop(0.5, 'rgba(234, 179, 8, 0.35)');
      errGrad.addColorStop(1, 'rgba(101, 163, 13, 0)');
    } else if (state === 'state2') {
      // Divergence (+1.5°C to +2.4°C model spread)
      errGrad.addColorStop(0, 'rgba(245, 158, 11, 0.7)');
      errGrad.addColorStop(0.6, 'rgba(239, 68, 68, 0.45)');
      errGrad.addColorStop(1, 'rgba(245, 158, 11, 0)');
    } else if (state === 'state4') {
      // Extreme Convective precipitation verification anomaly
      errGrad.addColorStop(0, 'rgba(225, 29, 72, 0.75)'); // High localized error
      errGrad.addColorStop(0.4, 'rgba(14, 165, 233, 0.45)');
      errGrad.addColorStop(1, 'rgba(225, 29, 72, 0)');
    } else {
      // State 3: Weather Regime Transition (+0.9°C verified error)
      errGrad.addColorStop(0, 'rgba(217, 119, 6, 0.6)');
      errGrad.addColorStop(0.45, 'rgba(132, 204, 22, 0.35)');
      errGrad.addColorStop(1, 'rgba(217, 119, 6, 0)');
    }
    ctx.fillStyle = errGrad;
    ctx.beginPath();
    ctx.arc(centerX, centerY, spreadRadius, 0, Math.PI * 2);
    ctx.fill();

    // Concentric spatial verification rings around Mysuru
    ctx.strokeStyle = 'rgba(255, 248, 238, 0.22)';
    ctx.lineWidth = 1.8;
    ctx.setLineDash([6, 6]);
    ctx.beginPath();
    ctx.arc(centerX, centerY, 80, 0, Math.PI * 2);
    ctx.arc(centerX, centerY, 160, 0, Math.PI * 2);
    ctx.arc(centerX, centerY, 240, 0, Math.PI * 2);
    ctx.stroke();
    ctx.setLineDash([]);
  } else if (layer === 'observed') {
    // Ground Verified Truth (AWS + Doppler Radar ground consensus)
    const obsGrad = ctx.createRadialGradient(centerX, centerY, 10, centerX, centerY, 220);
    obsGrad.addColorStop(0, 'rgba(34, 197, 94, 0.75)'); // Ground truth lock
    obsGrad.addColorStop(0.5, 'rgba(16, 185, 129, 0.4)');
    obsGrad.addColorStop(1, 'rgba(34, 197, 94, 0)');
    ctx.fillStyle = obsGrad;
    ctx.beginPath();
    ctx.arc(centerX, centerY, 220, 0, Math.PI * 2);
    ctx.fill();
  } else {
    // Forecast Field (Pre-verification prediction matrix)
    const fcstGrad = ctx.createRadialGradient(centerX, centerY, 10, centerX, centerY, 240);
    fcstGrad.addColorStop(0, 'rgba(245, 158, 11, 0.7)');
    fcstGrad.addColorStop(0.5, 'rgba(234, 88, 12, 0.35)');
    fcstGrad.addColorStop(1, 'rgba(245, 158, 11, 0)');
    ctx.fillStyle = fcstGrad;
    ctx.beginPath();
    ctx.arc(centerX, centerY, 240, 0, Math.PI * 2);
    ctx.fill();
  }

  // Lat / Lon scientific grid lines
  ctx.strokeStyle = 'rgba(255, 255, 255, 0.08)';
  ctx.lineWidth = 1.2;
  for (let lat = -80; lat <= 80; lat += 20) {
    ctx.beginPath();
    ctx.moveTo(0, toCanvasY(lat));
    ctx.lineTo(2048, toCanvasY(lat));
    ctx.stroke();
  }
  for (let lon = -180; lon <= 180; lon += 30) {
    ctx.beginPath();
    ctx.moveTo(toCanvasX(lon), 0);
    ctx.lineTo(toCanvasX(lon), 1024);
    ctx.stroke();
  }
}

drawVerificationEarth(currentVerificationLayer, currentVariable, currentHorizon, currentSimState);
const earthTexture = new THREE.CanvasTexture(canvas);
earthTexture.wrapS = THREE.RepeatWrapping;

// Globe Sphere
const globeRadius = 4.65;
const globeGeometry = new THREE.SphereGeometry(globeRadius, 64, 64);
const globeMaterial = new THREE.MeshPhongMaterial({
  map: earthTexture,
  bumpScale: 0.06,
  specular: new THREE.Color(0x384556),
  shininess: 16,
  emissive: new THREE.Color(0x161009),
  emissiveIntensity: 0.18
});
const globeMesh = new THREE.Mesh(globeGeometry, globeMaterial);
earthGroup.add(globeMesh);

// Cloud Layer
const cloudCanvas = document.createElement('canvas');
cloudCanvas.width = 1024;
cloudCanvas.height = 512;
const cCtx = cloudCanvas.getContext('2d');
cCtx.fillStyle = 'rgba(0,0,0,0)';
cCtx.fillRect(0, 0, 1024, 512);
cCtx.fillStyle = 'rgba(255, 250, 242, 0.44)';
for (let i = 0; i < 38; i++) {
  const cx = Math.random() * 1024;
  const cy = 80 + Math.random() * 340;
  const rx = 35 + Math.random() * 100;
  const ry = 8 + Math.random() * 24;
  cCtx.beginPath();
  cCtx.ellipse(cx, cy, rx, ry, (Math.random() - 0.5) * 0.4, 0, Math.PI * 2);
  cCtx.fill();
}
const cloudTexture = new THREE.CanvasTexture(cloudCanvas);
const cloudGeo = new THREE.SphereGeometry(globeRadius + 0.08, 64, 64);
const cloudMat = new THREE.MeshLambertMaterial({
  map: cloudTexture,
  transparent: true,
  opacity: 0.50,
  blending: THREE.NormalBlending
});
const cloudMesh = new THREE.Mesh(cloudGeo, cloudMat);
earthGroup.add(cloudMesh);

// Atmospheric Halo
const haloGeo = new THREE.SphereGeometry(globeRadius + 0.44, 48, 48);
const haloMat = new THREE.ShaderMaterial({
  vertexShader: `
    varying vec3 vNormal;
    void main() {
      vNormal = normalize(normalMatrix * normal);
      gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
    }
  `,
  fragmentShader: `
    varying vec3 vNormal;
    void main() {
      float intensity = pow(0.66 - dot(vNormal, vec3(0, 0, 1.0)), 2.6);
      vec3 atmosphericColor = mix(vec3(0.88, 0.48, 0.16), vec3(0.98, 0.89, 0.78), intensity * 0.65);
      gl_FragColor = vec4(atmosphericColor, intensity * 0.76);
    }
  `,
  blending: THREE.AdditiveBlending,
  side: THREE.BackSide,
  transparent: true
});
const haloMesh = new THREE.Mesh(haloGeo, haloMat);
earthGroup.add(haloMesh);

// Ground Truth Telemetry Pin & Verification Ring (Mysuru: 12.2958° N, 76.6394° E)
let currentLat = 12.2958;
let currentLon = 76.6394;

function calculatePinPos(lat, lon) {
  const phi = (90 - lat) * (Math.PI / 180);
  const theta = (lon + 180) * (Math.PI / 180);
  const pinR = globeRadius + 0.12;
  return new THREE.Vector3(
    -pinR * Math.sin(phi) * Math.cos(theta),
    pinR * Math.cos(phi),
    pinR * Math.sin(phi) * Math.sin(theta)
  );
}

const pinGroup = new THREE.Group();

// Central Ground Truth Marker
const coreGeo = new THREE.SphereGeometry(0.12, 16, 16);
const coreMat = new THREE.MeshBasicMaterial({ color: 0x16a34a }); // Green ground verified beacon
const coreMesh = new THREE.Mesh(coreGeo, coreMat);
pinGroup.add(coreMesh);

// Forecast Vector Ring (Amber)
const ringGeo = new THREE.RingGeometry(0.18, 0.3, 32);
const ringMat = new THREE.MeshBasicMaterial({ color: 0xf59e0b, side: THREE.DoubleSide, transparent: true, opacity: 0.85 });
const ringMesh = new THREE.Mesh(ringGeo, ringMat);
pinGroup.add(ringMesh);

// Verification Domain Halo (Terracotta / Earth)
const domainGeo = new THREE.RingGeometry(0.55, 0.75, 48);
const domainMat = new THREE.MeshBasicMaterial({ color: 0xc25e1a, side: THREE.DoubleSide, transparent: true, opacity: 0.55 });
const domainMesh = new THREE.Mesh(domainGeo, domainMat);
pinGroup.add(domainMesh);

const initialPos = calculatePinPos(currentLat, currentLon);
pinGroup.position.copy(initialPos);
ringMesh.lookAt(initialPos.clone().normalize());
domainMesh.lookAt(initialPos.clone().normalize());
earthGroup.add(pinGroup);

// Initial Camera Orientation centered over South India / Karnataka
earthGroup.rotation.y = -1.80;
earthGroup.rotation.x = 0.20;

// Interactive Drag Rotation
let isDragging = false;
let prevMouse = { x: 0, y: 0 };
let targetRotY = earthGroup.rotation.y;
let targetRotX = earthGroup.rotation.x;

function onPointerDown(e) {
  isDragging = true;
  prevMouse = { x: e.clientX || (e.touches && e.touches[0].clientX), y: e.clientY || (e.touches && e.touches[0].clientY) };
}

function onPointerMove(e) {
  if (!isDragging) return;
  const x = e.clientX || (e.touches && e.touches[0].clientX);
  const y = e.clientY || (e.touches && e.touches[0].clientY);
  const dx = x - prevMouse.x;
  const dy = y - prevMouse.y;
  targetRotY += dx * 0.005;
  targetRotX += dy * 0.005;
  targetRotX = Math.max(-0.85, Math.min(0.85, targetRotX));
  prevMouse = { x, y };
}

function onPointerUp() { isDragging = false; }

window.addEventListener('mousedown', onPointerDown);
window.addEventListener('mousemove', onPointerMove);
window.addEventListener('mouseup', onPointerUp);
window.addEventListener('touchstart', onPointerDown, { passive: true });
window.addEventListener('touchmove', onPointerMove, { passive: true });
window.addEventListener('touchend', onPointerUp);

// Public API hooks for DOM communication
window.samvayaVerificationUpdate = function(layer, variable, horizon, state) {
  if (layer !== undefined) currentVerificationLayer = layer;
  if (variable !== undefined) currentVariable = variable;
  if (horizon !== undefined) currentHorizon = horizon;
  if (state !== undefined) currentSimState = state;
  drawVerificationEarth(currentVerificationLayer, currentVariable, currentHorizon, currentSimState);
  earthTexture.needsUpdate = true;
};

window.samvayaVerificationFlyTo = function(lat, lon) {
  currentLat = lat;
  currentLon = lon;
  const newPos = calculatePinPos(lat, lon);
  pinGroup.position.copy(newPos);
  ringMesh.lookAt(newPos.clone().normalize());
  domainMesh.lookAt(newPos.clone().normalize());

  const tLon = (lon + 180) * (Math.PI / 180);
  targetRotY = -tLon + Math.PI / 2;
  targetRotX = lat * (Math.PI / 180);
};

window.samvayaVerificationZoom = function(delta) {
  camera.position.z = Math.max(7.2, Math.min(16, camera.position.z + delta));
};

function handleResize() {
  const w = container.clientWidth || window.innerWidth;
  const h = container.clientHeight || window.innerHeight;
  camera.aspect = w / h;
  camera.updateProjectionMatrix();
  renderer.setSize(w, h);
}
window.addEventListener('resize', handleResize);

let clock = new THREE.Clock();
function animate() {
  requestAnimationFrame(animate);
  const t = clock.getElapsedTime();

  earthGroup.rotation.y += (targetRotY - earthGroup.rotation.y) * 0.08;
  earthGroup.rotation.x += (targetRotX - earthGroup.rotation.x) * 0.08;

  cloudMesh.rotation.y += 0.0008;

  // Pulse telemetry & verification ring
  const s = 1.0 + Math.sin(t * 3.2) * 0.28;
  ringMesh.scale.set(s, s, s);
  ringMesh.material.opacity = 0.85 - (s - 0.7) * 0.5;

  const dS = 1.0 + Math.sin(t * 1.8) * 0.12;
  domainMesh.scale.set(dS, dS, dS);

  renderer.render(scene, camera);
}
animate();

})();
</script>
</div>
<!-- STITCH_THREEJS_END:ANIMATION_18 -->
</body>
</html>
