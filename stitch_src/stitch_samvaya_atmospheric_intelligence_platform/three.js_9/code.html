<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width,initial-scale=1.0" name="viewport"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
    }
  </style>
</head>
<body>
<!-- STITCH_THREEJS_START:ANIMATION_27 class="fixed inset-0 w-full h-full bg-transparent" -->
<div class="fixed inset-0 w-full h-full bg-transparent" style="display:block;">
<script src="https://ajax.googleapis.com/ajax/libs/threejs/r125/three.min.js"></script>
<div id="threejs-container-ANIMATION_27" style="width:100%;height:100%"></div>
<script>
(function() {
  const container = document.getElementById('threejs-container-ANIMATION_27');
  const devicePixelRatio = window.devicePixelRatio || 1;
  // SAMVAYA Atmospheric Command Center — Master 3D Earth Operational Engine
// Features: High-fidelity Cesium-style planetary Earth, dynamic weather layers (Temperature, Precip, Wind, Pressure, Clouds, Extreme Risk, Confidence),
// Mysuru telemetry focal target & multi-city pins, smooth flyTo camera interpolation, interactive drag rotation & zoom, and live state switching.

const container = document.getElementById('threejs-container-ANIMATION_COMMAND') || document.querySelector('threejs-scene') || document.body;
const width = container.clientWidth || window.innerWidth;
const height = container.clientHeight || window.innerHeight;

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(38, width / height, 0.1, 1000);
camera.position.set(-0.85, 0.95, 11.2); // Positioned slightly offset to give generous space to left and right intelligence consoles

const renderer = new THREE.WebGLRenderer({ alpha: true, antialias: true, powerPreference: "high-performance" });
renderer.setSize(width, height);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
container.appendChild(renderer.domElement);

// Warm atmospheric scientific illumination
const ambientLight = new THREE.AmbientLight(0xfff8f0, 1.65);
scene.add(ambientLight);

const sunLight = new THREE.DirectionalLight(0xffeedb, 2.8);
sunLight.position.set(16, 14, 15);
scene.add(sunLight);

const warmFill = new THREE.DirectionalLight(0xdf7a28, 1.1);
warmFill.position.set(-14, -6, -8);
scene.add(warmFill);

// Main Planetary Group
const earthGroup = new THREE.Group();
earthGroup.position.set(-0.55, -0.1, 0); // Positioned for balanced command center framing
scene.add(earthGroup);

// Canvas procedural texture for Earth & Atmospheric Layers
const canvas = document.createElement('canvas');
canvas.width = 2048;
canvas.height = 1024;
const ctx = canvas.getContext('2d');

function toCanvasX(lon) { return ((lon + 180) / 360) * 2048; }
function toCanvasY(lat) { return ((90 - lat) / 180) * 1024; }

let currentActiveLayer = 'temperature'; // 'temperature', 'precipitation', 'wind', 'pressure', 'clouds', 'extreme_risk', 'confidence'
let currentCommandState = 'state1';     // 'state1' (calm), 'state2' (rain), 'state3' (heat), 'state4' (uncertainty)

function drawCommandEarth(layer, state) {
  // Deep oceanic slate/blue with subtle bathymetry
  ctx.fillStyle = '#0f1722';
  ctx.fillRect(0, 0, 2048, 1024);

  const oceanGrad = ctx.createLinearGradient(0, 0, 0, 1024);
  oceanGrad.addColorStop(0, '#0a1018');
  oceanGrad.addColorStop(0.5, '#162232');
  oceanGrad.addColorStop(1, '#0a1018');
  ctx.fillStyle = oceanGrad;
  ctx.fillRect(0, 0, 2048, 1024);

  // Continental landmasses (Warm earthy brown / umber)
  ctx.fillStyle = '#392c20';

  // Indian Subcontinent & South Asia
  ctx.beginPath();
  ctx.moveTo(toCanvasX(68), toCanvasY(24));
  ctx.lineTo(toCanvasX(73), toCanvasY(35));
  ctx.lineTo(toCanvasX(80), toCanvasY(33));
  ctx.lineTo(toCanvasX(92), toCanvasY(27));
  ctx.lineTo(toCanvasX(91), toCanvasY(20));
  ctx.lineTo(toCanvasX(82), toCanvasY(13));
  ctx.lineTo(toCanvasX(77.5), toCanvasY(8));
  ctx.lineTo(toCanvasX(72.5), toCanvasY(16));
  ctx.lineTo(toCanvasX(68), toCanvasY(24));
  ctx.closePath();
  ctx.fill();

  // Highlight India (Terracotta tone)
  ctx.fillStyle = '#7a3e1d';
  ctx.beginPath();
  ctx.moveTo(toCanvasX(70), toCanvasY(23));
  ctx.lineTo(toCanvasX(74), toCanvasY(32));
  ctx.lineTo(toCanvasX(86), toCanvasY(27));
  ctx.lineTo(toCanvasX(80), toCanvasY(14));
  ctx.lineTo(toCanvasX(77.5), toCanvasY(9));
  ctx.lineTo(toCanvasX(74), toCanvasY(17));
  ctx.closePath();
  ctx.fill();

  // Sri Lanka
  ctx.beginPath();
  ctx.arc(toCanvasX(80.5), toCanvasY(7.5), 10, 0, Math.PI * 2);
  ctx.fill();

  // Arabian Peninsula
  ctx.fillStyle = '#4c3725';
  ctx.beginPath();
  ctx.moveTo(toCanvasX(35), toCanvasY(32));
  ctx.lineTo(toCanvasX(55), toCanvasY(31));
  ctx.lineTo(toCanvasX(60), toCanvasY(24));
  ctx.lineTo(toCanvasX(54), toCanvasY(15));
  ctx.lineTo(toCanvasX(44), toCanvasY(12));
  ctx.lineTo(toCanvasX(42), toCanvasY(25));
  ctx.closePath();
  ctx.fill();

  // Africa
  ctx.beginPath();
  ctx.moveTo(toCanvasX(12), toCanvasY(36));
  ctx.lineTo(toCanvasX(32), toCanvasY(32));
  ctx.lineTo(toCanvasX(51), toCanvasY(12));
  ctx.lineTo(toCanvasX(42), toCanvasY(-10));
  ctx.lineTo(toCanvasX(30), toCanvasY(-34));
  ctx.lineTo(toCanvasX(17), toCanvasY(-34));
  ctx.lineTo(toCanvasX(8), toCanvasY(4));
  ctx.lineTo(toCanvasX(-16), toCanvasY(12));
  ctx.lineTo(toCanvasX(0), toCanvasY(35));
  ctx.closePath();
  ctx.fill();

  // Eurasia
  ctx.beginPath();
  ctx.moveTo(toCanvasX(60), toCanvasY(35));
  ctx.lineTo(toCanvasX(125), toCanvasY(42));
  ctx.lineTo(toCanvasX(145), toCanvasY(65));
  ctx.lineTo(toCanvasX(55), toCanvasY(68));
  ctx.closePath();
  ctx.fill();

  // East Asia & Japan
  ctx.beginPath();
  ctx.moveTo(toCanvasX(115), toCanvasY(40));
  ctx.lineTo(toCanvasX(124), toCanvasY(38));
  ctx.lineTo(toCanvasX(120), toCanvasY(30));
  ctx.lineTo(toCanvasX(110), toCanvasY(24));
  ctx.closePath();
  ctx.fill();

  ctx.beginPath();
  ctx.ellipse(toCanvasX(138), toCanvasY(36), 34, 14, 0.4, 0, Math.PI * 2);
  ctx.fill();

  // Southeast Asia & Australia
  ctx.beginPath();
  ctx.moveTo(toCanvasX(96), toCanvasY(20));
  ctx.lineTo(toCanvasX(108), toCanvasY(11));
  ctx.lineTo(toCanvasX(102), toCanvasY(1));
  ctx.lineTo(toCanvasX(98), toCanvasY(10));
  ctx.closePath();
  ctx.fill();

  ctx.beginPath();
  ctx.ellipse(toCanvasX(134), toCanvasY(-25), 110, 76, 0, 0, Math.PI * 2);
  ctx.fill();

  // Dynamic Atmospheric Layer Overlays
  const fX = toCanvasX(76.6394);
  const fY = toCanvasY(12.2958);

  if (layer === 'temperature' || state === 'state3') {
    // Thermal Infrared Gradient with localized Deccan heating
    const tGrad = ctx.createLinearGradient(0, toCanvasY(55), 0, toCanvasY(-25));
    tGrad.addColorStop(0, 'rgba(56, 189, 248, 0.22)');
    tGrad.addColorStop(0.35, 'rgba(234, 179, 8, 0.32)');
    tGrad.addColorStop(0.55, 'rgba(239, 68, 68, 0.42)');
    tGrad.addColorStop(0.75, 'rgba(217, 119, 6, 0.32)');
    tGrad.addColorStop(1, 'rgba(147, 51, 234, 0.18)');
    ctx.fillStyle = tGrad;
    ctx.fillRect(0, 0, 2048, 1024);

    // Warm thermal bubble near Mysuru/Karnataka
    const warmCore = ctx.createRadialGradient(fX, fY, 10, fX, fY, state === 'state3' ? 220 : 150);
    warmCore.addColorStop(0, state === 'state3' ? 'rgba(225, 29, 72, 0.75)' : 'rgba(239, 68, 68, 0.58)');
    warmCore.addColorStop(0.5, 'rgba(245, 158, 11, 0.32)');
    warmCore.addColorStop(1, 'rgba(245, 158, 11, 0)');
    ctx.fillStyle = warmCore;
    ctx.beginPath();
    ctx.arc(fX, fY, state === 'state3' ? 220 : 150, 0, Math.PI * 2);
    ctx.fill();
  } else if (layer === 'precipitation' || state === 'state2') {
    // Monsoonal convective moisture plume
    const rainGrad = ctx.createRadialGradient(fX, fY, 15, fX, fY, 240);
    rainGrad.addColorStop(0, 'rgba(14, 165, 233, 0.75)');
    rainGrad.addColorStop(0.4, 'rgba(56, 189, 248, 0.45)');
    rainGrad.addColorStop(1, 'rgba(14, 165, 233, 0)');
    ctx.fillStyle = rainGrad;
    ctx.beginPath();
    ctx.arc(fX, fY, 240, 0, Math.PI * 2);
    ctx.fill();
  } else if (layer === 'wind') {
    ctx.strokeStyle = 'rgba(245, 158, 11, 0.65)';
    ctx.lineWidth = 12;
    for (let r = 0; r < 5; r++) {
      ctx.beginPath();
      ctx.arc(toCanvasX(72 + r * 5), toCanvasY(8 + r * 3), 90 + r * 28, 0.3, 1.8);
      ctx.stroke();
    }
  } else if (layer === 'extreme_risk') {
    const riskGrad = ctx.createRadialGradient(fX, fY, 15, fX, fY, 210);
    riskGrad.addColorStop(0, 'rgba(217, 119, 6, 0.85)');
    riskGrad.addColorStop(0.5, 'rgba(239, 68, 68, 0.45)');
    riskGrad.addColorStop(1, 'rgba(217, 119, 6, 0)');
    ctx.fillStyle = riskGrad;
    ctx.beginPath();
    ctx.arc(fX, fY, 210, 0, Math.PI * 2);
    ctx.fill();
  } else if (layer === 'confidence') {
    const confGrad = ctx.createRadialGradient(fX, fY, 20, fX, fY, 260);
    confGrad.addColorStop(0, 'rgba(34, 197, 94, 0.65)');
    confGrad.addColorStop(0.6, 'rgba(132, 204, 22, 0.35)');
    confGrad.addColorStop(1, 'rgba(234, 179, 8, 0.05)');
    ctx.fillStyle = confGrad;
    ctx.beginPath();
    ctx.arc(fX, fY, 260, 0, Math.PI * 2);
    ctx.fill();
  } else {
    // Isobar lines
    ctx.strokeStyle = 'rgba(255, 255, 255, 0.28)';
    ctx.lineWidth = 3.2;
    for (let p = 0; p < 4; p++) {
      ctx.beginPath();
      ctx.ellipse(toCanvasX(76), toCanvasY(14), 130 + p * 45, 80 + p * 30, 0.25, 0, Math.PI * 2);
      ctx.stroke();
    }
  }

  // Scientific latitude & longitude coordinate grid lines
  ctx.strokeStyle = 'rgba(255, 255, 255, 0.07)';
  ctx.lineWidth = 1.2;
  for (let lat = -80; lat <= 80; lat += 20) {
    ctx.beginPath();
    ctx.moveTo(0, toCanvasY(lat));
    ctx.lineTo(2048, toCanvasY(lat));
    ctx.stroke();
  }
  for (let lon = -180; lon <= 180; lon += 30) {
    ctx.beginPath();
    ctx.moveTo(toCanvasX(lon), 0);
    ctx.lineTo(toCanvasX(lon), 1024);
    ctx.stroke();
  }
}

drawCommandEarth(currentActiveLayer, currentCommandState);
const earthTexture = new THREE.CanvasTexture(canvas);
earthTexture.wrapS = THREE.RepeatWrapping;

// Globe Sphere Mesh
const globeRadius = 4.65;
const globeGeometry = new THREE.SphereGeometry(globeRadius, 64, 64);
const globeMaterial = new THREE.MeshPhongMaterial({
  map: earthTexture,
  bumpScale: 0.06,
  specular: new THREE.Color(0x384556),
  shininess: 16,
  emissive: new THREE.Color(0x161009),
  emissiveIntensity: 0.18
});
const globeMesh = new THREE.Mesh(globeGeometry, globeMaterial);
earthGroup.add(globeMesh);

// Cloud Layer
const cloudCanvas = document.createElement('canvas');
cloudCanvas.width = 1024;
cloudCanvas.height = 512;
const cCtx = cloudCanvas.getContext('2d');
cCtx.fillStyle = 'rgba(0,0,0,0)';
cCtx.fillRect(0, 0, 1024, 512);
cCtx.fillStyle = 'rgba(255, 250, 242, 0.44)';
for (let i = 0; i < 38; i++) {
  const cx = Math.random() * 1024;
  const cy = 80 + Math.random() * 340;
  const rx = 35 + Math.random() * 100;
  const ry = 8 + Math.random() * 24;
  cCtx.beginPath();
  cCtx.ellipse(cx, cy, rx, ry, (Math.random() - 0.5) * 0.4, 0, Math.PI * 2);
  cCtx.fill();
}
const cloudTexture = new THREE.CanvasTexture(cloudCanvas);
const cloudGeo = new THREE.SphereGeometry(globeRadius + 0.08, 64, 64);
const cloudMat = new THREE.MeshLambertMaterial({
  map: cloudTexture,
  transparent: true,
  opacity: 0.52,
  blending: THREE.NormalBlending
});
const cloudMesh = new THREE.Mesh(cloudGeo, cloudMat);
earthGroup.add(cloudMesh);

// Atmospheric Halo (Rayleigh scattering)
const haloGeo = new THREE.SphereGeometry(globeRadius + 0.44, 48, 48);
const haloMat = new THREE.ShaderMaterial({
  vertexShader: `
    varying vec3 vNormal;
    void main() {
      vNormal = normalize(normalMatrix * normal);
      gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
    }
  `,
  fragmentShader: `
    varying vec3 vNormal;
    void main() {
      float intensity = pow(0.66 - dot(vNormal, vec3(0, 0, 1.0)), 2.6);
      vec3 atmosphericColor = mix(vec3(0.88, 0.48, 0.16), vec3(0.98, 0.89, 0.78), intensity * 0.65);
      gl_FragColor = vec4(atmosphericColor, intensity * 0.76);
    }
  `,
  blending: THREE.AdditiveBlending,
  side: THREE.BackSide,
  transparent: true
});
const haloMesh = new THREE.Mesh(haloGeo, haloMat);
earthGroup.add(haloMesh);

// Multi-Location Pins & Raycasting
function calculatePinPos(lat, lon, rOffset = 0.12) {
  const phi = (90 - lat) * (Math.PI / 180);
  const theta = (lon + 180) * (Math.PI / 180);
  const pinR = globeRadius + rOffset;
  return new THREE.Vector3(
    -pinR * Math.sin(phi) * Math.cos(theta),
    pinR * Math.cos(phi),
    pinR * Math.sin(phi) * Math.sin(theta)
  );
}

const pinsGroup = new THREE.Group();
earthGroup.add(pinsGroup);

const COMMAND_LOCATIONS = [
  { id: 'mysuru', name: 'Mysuru', lat: 12.2958, lon: 76.6394, color: 0xc25e1a, active: true },
  { id: 'bengaluru', name: 'Bengaluru', lat: 12.9716, lon: 77.5946, color: 0xd97706, active: false },
  { id: 'delhi', name: 'Delhi', lat: 28.7041, lon: 77.1025, color: 0xe11d48, active: false },
  { id: 'mumbai', name: 'Mumbai', lat: 19.0760, lon: 72.8777, color: 0x0284c7, active: false }
];

const pinObjects = {};

COMMAND_LOCATIONS.forEach(loc => {
  const pGroup = new THREE.Group();
  const pos = calculatePinPos(loc.lat, loc.lon);
  pGroup.position.copy(pos);

  // Core Beacon
  const cGeo = new THREE.SphereGeometry(loc.id === 'mysuru' ? 0.13 : 0.09, 16, 16);
  const cMat = new THREE.MeshBasicMaterial({ color: loc.color });
  const cMesh = new THREE.Mesh(cGeo, cMat);
  pGroup.add(cMesh);

  // Outer Pulse Ring
  const rGeo = new THREE.RingGeometry(0.18, 0.32, 32);
  const rMat = new THREE.MeshBasicMaterial({ color: loc.color, side: THREE.DoubleSide, transparent: true, opacity: loc.id === 'mysuru' ? 0.85 : 0.4 });
  const rMesh = new THREE.Mesh(rGeo, rMat);
  rMesh.lookAt(pos.clone().normalize());
  pGroup.add(rMesh);

  // Atmosphere Domain Halo for active focal target
  const dGeo = new THREE.RingGeometry(0.55, 0.78, 48);
  const dMat = new THREE.MeshBasicMaterial({ color: loc.color, side: THREE.DoubleSide, transparent: true, opacity: loc.id === 'mysuru' ? 0.52 : 0 });
  const dMesh = new THREE.Mesh(dGeo, dMat);
  dMesh.lookAt(pos.clone().normalize());
  pGroup.add(dMesh);

  pinsGroup.add(pGroup);
  pinObjects[loc.id] = { group: pGroup, ring: rMesh, domain: dMesh, data: loc };
});

// Initial Camera Orientation centered over South India
earthGroup.rotation.y = -1.80;
earthGroup.rotation.x = 0.20;

// Interactive Drag Rotation
let isDragging = false;
let prevMouse = { x: 0, y: 0 };
let targetRotY = earthGroup.rotation.y;
let targetRotX = earthGroup.rotation.x;

function onPointerDown(e) {
  isDragging = true;
  prevMouse = { x: e.clientX || (e.touches && e.touches[0].clientX), y: e.clientY || (e.touches && e.touches[0].clientY) };
}

function onPointerMove(e) {
  if (!isDragging) return;
  const x = e.clientX || (e.touches && e.touches[0].clientX);
  const y = e.clientY || (e.touches && e.touches[0].clientY);
  const dx = x - prevMouse.x;
  const dy = y - prevMouse.y;
  targetRotY += dx * 0.005;
  targetRotX += dy * 0.005;
  targetRotX = Math.max(-0.85, Math.min(0.85, targetRotX));
  prevMouse = { x, y };
}

function onPointerUp() { isDragging = false; }

window.addEventListener('mousedown', onPointerDown);
window.addEventListener('mousemove', onPointerMove);
window.addEventListener('mouseup', onPointerUp);
window.addEventListener('touchstart', onPointerDown, { passive: true });
window.addEventListener('touchmove', onPointerMove, { passive: true });
window.addEventListener('touchend', onPointerUp);

// Public API hooks for Command Center DOM communication
window.samvayaCommandFlyTo = function(lat, lon, id) {
  const tLon = (lon + 180) * (Math.PI / 180);
  targetRotY = -tLon + Math.PI / 2;
  targetRotX = lat * (Math.PI / 180);

  // Update pin active states
  Object.keys(pinObjects).forEach(k => {
    const item = pinObjects[k];
    const isTarget = (k === id);
    item.ring.material.opacity = isTarget ? 0.85 : 0.45;
    item.domain.material.opacity = isTarget ? 0.52 : 0;
  });
};

window.samvayaCommandSetLayer = function(layerName) {
  currentActiveLayer = layerName;
  drawCommandEarth(currentActiveLayer, currentCommandState);
  earthTexture.needsUpdate = true;
};

window.samvayaCommandSetState = function(stateName) {
  currentCommandState = stateName;
  drawCommandEarth(currentActiveLayer, currentCommandState);
  earthTexture.needsUpdate = true;
};

window.samvayaCommandZoom = function(delta) {
  camera.position.z = Math.max(7.2, Math.min(16, camera.position.z + delta));
};

function handleResize() {
  const w = container.clientWidth || window.innerWidth;
  const h = container.clientHeight || window.innerHeight;
  camera.aspect = w / h;
  camera.updateProjectionMatrix();
  renderer.setSize(w, h);
}
window.addEventListener('resize', handleResize);

let clock = new THREE.Clock();
function animate() {
  requestAnimationFrame(animate);
  const t = clock.getElapsedTime();

  earthGroup.rotation.y += (targetRotY - earthGroup.rotation.y) * 0.08;
  earthGroup.rotation.x += (targetRotX - earthGroup.rotation.x) * 0.08;

  cloudMesh.rotation.y += 0.0008;

  // Pulse active beacon
  Object.keys(pinObjects).forEach(k => {
    const item = pinObjects[k];
    if (item.domain.material.opacity > 0) {
      const s = 1.0 + Math.sin(t * 3.2) * 0.28;
      item.ring.scale.set(s, s, s);
      const dS = 1.0 + Math.sin(t * 1.8) * 0.12;
      item.domain.scale.set(dS, dS, dS);
    }
  });

  renderer.render(scene, camera);
}
animate();

})();
</script>
</div>
<!-- STITCH_THREEJS_END:ANIMATION_27 -->
</body>
</html>
