<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width,initial-scale=1.0" name="viewport"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
    }
  </style>
</head>
<body>
<!-- STITCH_THREEJS_START:ANIMATION_93 class="fixed inset-0 w-full h-full bg-transparent" -->
<div class="fixed inset-0 w-full h-full bg-transparent" style="display:block;">
<script src="https://ajax.googleapis.com/ajax/libs/threejs/r125/three.min.js"></script>
<div id="threejs-container-ANIMATION_93" style="width:100%;height:100%"></div>
<script>
(function() {
  const container = document.getElementById('threejs-container-ANIMATION_93');
  const devicePixelRatio = window.devicePixelRatio || 1;
  // SAMVAYA — Atmospheric Command Center: Centerpiece 3D Earth Operational Synoptic Cockpit
// An interactive, living 3D planetary Earth with real-time multi-model convergence layers,
// dynamic atmospheric weather-state illumination, radar isohyets, wind streams, and interactive HUD hooks.

const container = document.getElementById('threejs-container-ANIMATION_COMMAND_CENTER') || document.querySelector('threejs-scene') || document.body;
const width = container.clientWidth || window.innerWidth;
const height = container.clientHeight || window.innerHeight;

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(34, width / height, 0.1, 1000);
camera.position.set(-0.28, 0.42, 10.8);

const renderer = new THREE.WebGLRenderer({ alpha: true, antialias: true, powerPreference: "high-performance" });
renderer.setSize(width, height);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
container.appendChild(renderer.domElement);

// Lighting setup matching SAMVAYA warm scientific palette
const ambientLight = new THREE.AmbientLight(0xfff8f2, 1.85);
scene.add(ambientLight);

const sunLight = new THREE.DirectionalLight(0xffeedb, 3.2);
sunLight.position.set(16, 12, 15);
scene.add(sunLight);

const warmFill = new THREE.DirectionalLight(0xdf7a28, 1.15);
warmFill.position.set(-15, -6, -8);
scene.add(warmFill);

// Main Planetary Earth Group
const earthGroup = new THREE.Group();
earthGroup.position.set(-0.06, -0.05, 0);
scene.add(earthGroup);

// Canvas procedural texture for Earth & Multi-Layer Atmospheric Overlay
const canvas = document.createElement('canvas');
canvas.width = 2048;
canvas.height = 1024;
const ctx = canvas.getContext('2d');

function toCanvasX(lon) { return ((lon + 180) / 360) * 2048; }
function toCanvasY(lat) { return ((90 - lat) / 180) * 1024; }

let currentActiveLayer = 'Precipitation'; // 'Temperature', 'Precipitation', 'Wind', 'Clouds', 'Agreement', 'Confidence', 'Extreme Risk'
let currentWeatherState = 'Rain Developing'; // 'Calm', 'Rain Developing', 'Extreme Heat', 'High Uncertainty', 'Degraded Data'
let currentHorizonStep = 'NOW'; // '-6H', 'NOW', '+3H', '+6H', '+12H', '+24H', '+48H'
let currentViewMode = 'LOCAL'; // 'LOCAL' or 'GLOBAL'

function drawCommandCenterEarth(layer, weatherState, horizon, mode) {
  // Deep oceanic slate/navy base with warm ambient tint
  const oceanGrad = ctx.createLinearGradient(0, 0, 0, 1024);
  oceanGrad.addColorStop(0, '#090f17');
  oceanGrad.addColorStop(0.5, '#121d2a');
  oceanGrad.addColorStop(1, '#090f17');
  ctx.fillStyle = oceanGrad;
  ctx.fillRect(0, 0, 2048, 1024);

  // Continental landmasses (Warm earthy bedrock)
  ctx.fillStyle = '#3a2d21';

  // Indian Subcontinent & South Asia
  ctx.beginPath();
  ctx.moveTo(toCanvasX(68), toCanvasY(24));
  ctx.lineTo(toCanvasX(73), toCanvasY(35));
  ctx.lineTo(toCanvasX(80), toCanvasY(33));
  ctx.lineTo(toCanvasX(92), toCanvasY(27));
  ctx.lineTo(toCanvasX(91), toCanvasY(20));
  ctx.lineTo(toCanvasX(82), toCanvasY(13));
  ctx.lineTo(toCanvasX(77.5), toCanvasY(8));
  ctx.lineTo(toCanvasX(72.5), toCanvasY(16));
  ctx.lineTo(toCanvasX(68), toCanvasY(24));
  ctx.closePath();
  ctx.fill();

  // Highlight India (Terracotta tone)
  ctx.fillStyle = '#783c1c';
  ctx.beginPath();
  ctx.moveTo(toCanvasX(70), toCanvasY(23));
  ctx.lineTo(toCanvasX(74), toCanvasY(32));
  ctx.lineTo(toCanvasX(86), toCanvasY(27));
  ctx.lineTo(toCanvasX(80), toCanvasY(14));
  ctx.lineTo(toCanvasX(77.5), toCanvasY(9));
  ctx.lineTo(toCanvasX(74), toCanvasY(17));
  ctx.closePath();
  ctx.fill();

  // Sri Lanka
  ctx.beginPath();
  ctx.arc(toCanvasX(80.5), toCanvasY(7.5), 10, 0, Math.PI * 2);
  ctx.fill();

  // Arabian Peninsula
  ctx.fillStyle = '#4c3725';
  ctx.beginPath();
  ctx.moveTo(toCanvasX(35), toCanvasY(32));
  ctx.lineTo(toCanvasX(55), toCanvasY(31));
  ctx.lineTo(toCanvasX(60), toCanvasY(24));
  ctx.lineTo(toCanvasX(54), toCanvasY(15));
  ctx.lineTo(toCanvasX(44), toCanvasY(12));
  ctx.lineTo(toCanvasX(42), toCanvasY(25));
  ctx.closePath();
  ctx.fill();

  // Africa
  ctx.beginPath();
  ctx.moveTo(toCanvasX(12), toCanvasY(36));
  ctx.lineTo(toCanvasX(32), toCanvasY(32));
  ctx.lineTo(toCanvasX(51), toCanvasY(12));
  ctx.lineTo(toCanvasX(42), toCanvasY(-10));
  ctx.lineTo(toCanvasX(30), toCanvasY(-34));
  ctx.lineTo(toCanvasX(17), toCanvasY(-34));
  ctx.lineTo(toCanvasX(8), toCanvasY(4));
  ctx.lineTo(toCanvasX(-16), toCanvasY(12));
  ctx.lineTo(toCanvasX(0), toCanvasY(35));
  ctx.closePath();
  ctx.fill();

  // Eurasia
  ctx.beginPath();
  ctx.moveTo(toCanvasX(60), toCanvasY(35));
  ctx.lineTo(toCanvasX(125), toCanvasY(42));
  ctx.lineTo(toCanvasX(145), toCanvasY(65));
  ctx.lineTo(toCanvasX(55), toCanvasY(68));
  ctx.lineTo(toCanvasX(-8), toCanvasY(58));
  ctx.lineTo(toCanvasX(12), toCanvasY(45));
  ctx.closePath();
  ctx.fill();

  // Southeast Asia & Australia
  ctx.beginPath();
  ctx.moveTo(toCanvasX(96), toCanvasY(20));
  ctx.lineTo(toCanvasX(108), toCanvasY(11));
  ctx.lineTo(toCanvasX(102), toCanvasY(1));
  ctx.lineTo(toCanvasX(98), toCanvasY(10));
  ctx.closePath();
  ctx.fill();

  ctx.beginPath();
  ctx.ellipse(toCanvasX(134), toCanvasY(-25), 115, 78, 0, 0, Math.PI * 2);
  ctx.fill();

  const mX = toCanvasX(76.6394); // Mysuru Lon
  const mY = toCanvasY(12.2958); // Mysuru Lat

  // Multi-layer dynamic rendering
  if (layer === 'Precipitation' || weatherState === 'Rain Developing') {
    const pGrad = ctx.createRadialGradient(mX, mY, 15, mX, mY, 260);
    pGrad.addColorStop(0, 'rgba(194, 94, 26, 0.85)');
    pGrad.addColorStop(0.45, 'rgba(217, 119, 6, 0.48)');
    pGrad.addColorStop(0.8, 'rgba(90, 98, 64, 0.22)');
    pGrad.addColorStop(1, 'rgba(0, 0, 0, 0)');
    ctx.fillStyle = pGrad;
    ctx.beginPath();
    ctx.arc(mX, mY, 260, 0, Math.PI * 2);
    ctx.fill();

    // Radar isohyet rings
    ctx.strokeStyle = 'rgba(255, 237, 213, 0.60)';
    ctx.lineWidth = 1.5;
    ctx.setLineDash([4, 6]);
    ctx.beginPath();
    ctx.arc(mX, mY, 75, 0, Math.PI * 2);
    ctx.stroke();
    ctx.beginPath();
    ctx.arc(mX, mY, 150, 0, Math.PI * 2);
    ctx.stroke();
    ctx.setLineDash([]);
  } else if (layer === 'Temperature' || weatherState === 'Extreme Heat') {
    const tGrad = ctx.createRadialGradient(mX, mY, 20, mX, mY, 280);
    tGrad.addColorStop(0, 'rgba(234, 88, 12, 0.82)');
    tGrad.addColorStop(0.5, 'rgba(217, 119, 6, 0.40)');
    tGrad.addColorStop(1, 'rgba(0, 0, 0, 0)');
    ctx.fillStyle = tGrad;
    ctx.beginPath();
    ctx.arc(mX, mY, 280, 0, Math.PI * 2);
    ctx.fill();
  } else if (layer === 'Wind') {
    ctx.strokeStyle = 'rgba(217, 119, 6, 0.75)';
    ctx.lineWidth = 1.8;
    for (let i = -120; i <= 120; i += 30) {
      ctx.beginPath();
      ctx.moveTo(mX - 160, mY + i + 40);
      ctx.bezierCurveTo(mX - 40, mY + i + 10, mX + 40, mY + i - 15, mX + 160, mY + i - 40);
      ctx.stroke();
    }
  } else if (layer === 'Clouds') {
    const clGrad = ctx.createRadialGradient(mX, mY, 10, mX, mY, 250);
    clGrad.addColorStop(0, 'rgba(245, 240, 232, 0.75)');
    clGrad.addColorStop(0.5, 'rgba(215, 208, 198, 0.38)');
    clGrad.addColorStop(1, 'rgba(0, 0, 0, 0)');
    ctx.fillStyle = clGrad;
    ctx.beginPath();
    ctx.arc(mX, mY, 250, 0, Math.PI * 2);
    ctx.fill();
  } else if (layer === 'Agreement') {
    const aGrad = ctx.createRadialGradient(mX, mY, 20, mX, mY, 230);
    aGrad.addColorStop(0, 'rgba(90, 98, 64, 0.85)');
    aGrad.addColorStop(0.5, 'rgba(217, 119, 6, 0.40)');
    aGrad.addColorStop(1, 'rgba(0, 0, 0, 0)');
    ctx.fillStyle = aGrad;
    ctx.beginPath();
    ctx.arc(mX, mY, 230, 0, Math.PI * 2);
    ctx.fill();
  } else if (layer === 'Confidence') {
    const cGrad = ctx.createRadialGradient(mX, mY, 20, mX, mY, 220);
    cGrad.addColorStop(0, 'rgba(180, 83, 9, 0.80)');
    cGrad.addColorStop(0.6, 'rgba(217, 119, 6, 0.35)');
    cGrad.addColorStop(1, 'rgba(0, 0, 0, 0)');
    ctx.fillStyle = cGrad;
    ctx.beginPath();
    ctx.arc(mX, mY, 220, 0, Math.PI * 2);
    ctx.fill();
  } else if (layer === 'Extreme Risk') {
    const rGrad = ctx.createRadialGradient(mX, mY, 10, mX, mY, 220);
    rGrad.addColorStop(0, 'rgba(186, 26, 26, 0.80)');
    rGrad.addColorStop(0.5, 'rgba(194, 94, 26, 0.40)');
    rGrad.addColorStop(1, 'rgba(0, 0, 0, 0)');
    ctx.fillStyle = rGrad;
    ctx.beginPath();
    ctx.arc(mX, mY, 220, 0, Math.PI * 2);
    ctx.fill();
  }

  // Coordinate grid lines (delicate white)
  ctx.strokeStyle = 'rgba(255, 255, 255, 0.08)';
  ctx.lineWidth = 1.0;
  for (let lat = -80; lat <= 80; lat += 20) {
    ctx.beginPath();
    ctx.moveTo(0, toCanvasY(lat));
    ctx.lineTo(2048, toCanvasY(lat));
    ctx.stroke();
  }
  for (let lon = -180; lon <= 180; lon += 30) {
    ctx.beginPath();
    ctx.moveTo(toCanvasX(lon), 0);
    ctx.lineTo(toCanvasX(lon), 1024);
    ctx.stroke();
  }
}

drawCommandCenterEarth(currentActiveLayer, currentWeatherState, currentHorizonStep, currentViewMode);
const earthTexture = new THREE.CanvasTexture(canvas);
earthTexture.wrapS = THREE.RepeatWrapping;

// Globe Sphere Mesh
const globeRadius = 4.65;
const globeGeometry = new THREE.SphereGeometry(globeRadius, 64, 64);
const globeMaterial = new THREE.MeshPhongMaterial({
  map: earthTexture,
  bumpScale: 0.06,
  specular: new THREE.Color(0x384556),
  shininess: 18,
  emissive: new THREE.Color(0x161009),
  emissiveIntensity: 0.18
});
const globeMesh = new THREE.Mesh(globeGeometry, globeMaterial);
earthGroup.add(globeMesh);

// Dynamic Atmospheric Cloud Stratification Layer
const cloudCanvas = document.createElement('canvas');
cloudCanvas.width = 1024;
cloudCanvas.height = 512;
const cCtx = cloudCanvas.getContext('2d');
cCtx.fillStyle = 'rgba(0,0,0,0)';
cCtx.fillRect(0, 0, 1024, 512);
cCtx.fillStyle = 'rgba(255, 250, 242, 0.42)';
for (let i = 0; i < 40; i++) {
  const cx = Math.random() * 1024;
  const cy = 60 + Math.random() * 380;
  const rx = 35 + Math.random() * 110;
  const ry = 8 + Math.random() * 26;
  cCtx.beginPath();
  cCtx.ellipse(cx, cy, rx, ry, (Math.random() - 0.5) * 0.35, 0, Math.PI * 2);
  cCtx.fill();
}
const cloudTexture = new THREE.CanvasTexture(cloudCanvas);
const cloudGeo = new THREE.SphereGeometry(globeRadius + 0.08, 64, 64);
const cloudMat = new THREE.MeshLambertMaterial({
  map: cloudTexture,
  transparent: true,
  opacity: 0.54,
  blending: THREE.NormalBlending
});
const cloudMesh = new THREE.Mesh(cloudGeo, cloudMat);
earthGroup.add(cloudMesh);

// Rayleigh Atmospheric Halo
const haloGeo = new THREE.SphereGeometry(globeRadius + 0.44, 48, 48);
const haloMat = new THREE.ShaderMaterial({
  vertexShader: `
    varying vec3 vNormal;
    void main() {
      vNormal = normalize(normalMatrix * normal);
      gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
    }
  `,
  fragmentShader: `
    varying vec3 vNormal;
    void main() {
      float intensity = pow(0.66 - dot(vNormal, vec3(0, 0, 1.0)), 2.6);
      vec3 atmosphericColor = mix(vec3(0.88, 0.48, 0.16), vec3(0.98, 0.89, 0.78), intensity * 0.65);
      gl_FragColor = vec4(atmosphericColor, intensity * 0.76);
    }
  `,
  blending: THREE.AdditiveBlending,
  side: THREE.BackSide,
  transparent: true
});
const haloMesh = new THREE.Mesh(haloGeo, haloMat);
earthGroup.add(haloMesh);

// Lat/Lon to 3D Cartesian Coordinate
function calculatePinPos(lat, lon, rOffset = 0.12) {
  const phi = (90 - lat) * (Math.PI / 180);
  const theta = (lon + 180) * (Math.PI / 180);
  const pinR = globeRadius + rOffset;
  return new THREE.Vector3(
    -pinR * Math.sin(phi) * Math.cos(theta),
    pinR * Math.cos(phi),
    pinR * Math.sin(phi) * Math.sin(theta)
  );
}

// Synoptic Anchor: Mysuru (Primary Focal Point)
const posMysuru = calculatePinPos(12.2958, 76.6394);
const anchorGroup = new THREE.Group();
anchorGroup.position.copy(posMysuru);

// Core center pin
const cGeo = new THREE.SphereGeometry(0.13, 16, 16);
const cMat = new THREE.MeshBasicMaterial({ color: 0xc25e1a });
const cMesh = new THREE.Mesh(cGeo, cMat);
anchorGroup.add(cMesh);

// Inner pulsing consensus beacon ring (Amber)
const fRingGeo = new THREE.RingGeometry(0.18, 0.32, 32);
const fRingMat = new THREE.MeshBasicMaterial({ color: 0xd97706, side: THREE.DoubleSide, transparent: true, opacity: 0.85 });
const fRingMesh = new THREE.Mesh(fRingGeo, fRingMat);
fRingMesh.lookAt(posMysuru.clone().normalize());
anchorGroup.add(fRingMesh);

// Outer spatial uncertainty boundary ring (Warm Ivory)
const oRingGeo = new THREE.RingGeometry(0.48, 0.70, 48);
const oRingMat = new THREE.MeshBasicMaterial({ color: 0xfff8f5, side: THREE.DoubleSide, transparent: true, opacity: 0.50 });
const oRingMesh = new THREE.Mesh(oRingGeo, oRingMat);
oRingMesh.lookAt(posMysuru.clone().normalize());
anchorGroup.add(oRingMesh);

earthGroup.add(anchorGroup);

// Initial Camera Orientation centered over Karnataka & South Asia
earthGroup.rotation.y = -1.80;
earthGroup.rotation.x = 0.20;

// Interactive Drag Rotation
let isDragging = false;
let prevMouse = { x: 0, y: 0 };
let targetRotY = earthGroup.rotation.y;
let targetRotX = earthGroup.rotation.x;

function onPointerDown(e) {
  isDragging = true;
  prevMouse = { x: e.clientX || (e.touches && e.touches[0].clientX), y: e.clientY || (e.touches && e.touches[0].clientY) };
}

function onPointerMove(e) {
  if (!isDragging) return;
  const x = e.clientX || (e.touches && e.touches[0].clientX);
  const y = e.clientY || (e.touches && e.touches[0].clientY);
  const dx = x - prevMouse.x;
  const dy = y - prevMouse.y;
  targetRotY += dx * 0.005;
  targetRotX += dy * 0.005;
  targetRotX = Math.max(-0.85, Math.min(0.85, targetRotX));
  prevMouse = { x, y };
}

function onPointerUp() { isDragging = false; }

window.addEventListener('mousedown', onPointerDown);
window.addEventListener('mousemove', onPointerMove);
window.addEventListener('mouseup', onPointerUp);
window.addEventListener('touchstart', onPointerDown, { passive: true });
window.addEventListener('touchmove', onPointerMove, { passive: true });
window.addEventListener('touchend', onPointerUp);

// Public API hooks for Command Center DOM communication
window.samvayaCommandSetLayer = function(layerName) {
  currentActiveLayer = layerName;
  drawCommandCenterEarth(currentActiveLayer, currentWeatherState, currentHorizonStep, currentViewMode);
  earthTexture.needsUpdate = true;
};

window.samvayaCommandSetWeatherState = function(stateName) {
  currentWeatherState = stateName;
  drawCommandCenterEarth(currentActiveLayer, currentWeatherState, currentHorizonStep, currentViewMode);
  earthTexture.needsUpdate = true;
};

window.samvayaCommandSetHorizon = function(horizon) {
  currentHorizonStep = horizon;
  drawCommandCenterEarth(currentActiveLayer, currentWeatherState, currentHorizonStep, currentViewMode);
  earthTexture.needsUpdate = true;
};

window.samvayaCommandSetViewMode = function(mode) {
  currentViewMode = mode;
  if (mode === 'GLOBAL') {
    camera.position.z = 13.5;
    targetRotY = 0.0;
    targetRotX = 0.1;
  } else {
    camera.position.z = 10.8;
    targetRotY = -1.80;
    targetRotX = 0.20;
  }
  drawCommandCenterEarth(currentActiveLayer, currentWeatherState, currentHorizonStep, currentViewMode);
  earthTexture.needsUpdate = true;
};

window.samvayaCommandZoom = function(delta) {
  camera.position.z = Math.max(7.2, Math.min(16, camera.position.z + delta));
};

window.samvayaCommandReset = function() {
  targetRotY = -1.80;
  targetRotX = 0.20;
  camera.position.set(-0.28, 0.42, 10.8);
};

function handleResize() {
  const w = container.clientWidth || window.innerWidth;
  const h = container.clientHeight || window.innerHeight;
  camera.aspect = w / h;
  camera.updateProjectionMatrix();
  renderer.setSize(w, h);
}
window.addEventListener('resize', handleResize);

let clock = new THREE.Clock();
function animate() {
  requestAnimationFrame(animate);
  const t = clock.getElapsedTime();

  earthGroup.rotation.y += (targetRotY - earthGroup.rotation.y) * 0.08;
  earthGroup.rotation.x += (targetRotX - earthGroup.rotation.x) * 0.08;

  cloudMesh.rotation.y += 0.00065;

  // Pulse beacon rings
  const s = 1.0 + Math.sin(t * 2.8) * 0.20;
  fRingMesh.scale.set(s, s, s);
  const dS = 1.0 + Math.sin(t * 1.5) * 0.10;
  oRingMesh.scale.set(dS, dS, dS);

  renderer.render(scene, camera);
}
animate();

})();
</script>
</div>
<!-- STITCH_THREEJS_END:ANIMATION_93 -->
</body>
</html>
