<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width,initial-scale=1.0" name="viewport"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
    }
  </style>
</head>
<body>
<!-- STITCH_THREEJS_START:ANIMATION_54 class="fixed inset-0 w-full h-full bg-transparent" -->
<div class="fixed inset-0 w-full h-full bg-transparent" style="display:block;">
<script src="https://ajax.googleapis.com/ajax/libs/threejs/r125/three.min.js"></script>
<div id="threejs-container-ANIMATION_54" style="width:100%;height:100%"></div>
<script>
(function() {
  const container = document.getElementById('threejs-container-ANIMATION_54');
  const devicePixelRatio = window.devicePixelRatio || 1;
  // SAMVAYA Atmospheric Comparison — 3D Earth Multi-Location Synoptic Comparative Globe
// Features: Interactive Three.js 3D Earth with spatial comparative beacons for 4 locations:
// Mysuru (12.2958° N, 76.6394° E), Bengaluru (12.9716° N, 77.5946° E), Mumbai (18.9220° N, 72.8346° E), Delhi (28.6139° N, 77.2090° E).
// Supports dynamic focus smoothly gliding between locations, comparative halos, variable layers
// (Temperature, Precipitation, Wind, Pressure, Model Confidence, Extreme Risk), and timeline scrubbing.

const container = document.getElementById('threejs-container-ANIMATION_COMPARISON') || document.querySelector('threejs-scene') || document.body;
const width = container.clientWidth || window.innerWidth;
const height = container.clientHeight || window.innerHeight;

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(36, width / height, 0.1, 1000);
camera.position.set(-0.35, 0.65, 11.2);

const renderer = new THREE.WebGLRenderer({ alpha: true, antialias: true, powerPreference: "high-performance" });
renderer.setSize(width, height);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
container.appendChild(renderer.domElement);

// Warm atmospheric scientific illumination matching SAMVAYA palette
const ambientLight = new THREE.AmbientLight(0xfff8f2, 1.6);
scene.add(ambientLight);

const sunLight = new THREE.DirectionalLight(0xffeedb, 2.85);
sunLight.position.set(16, 12, 15);
scene.add(sunLight);

const warmFill = new THREE.DirectionalLight(0xdf7a28, 1.15);
warmFill.position.set(-15, -6, -8);
scene.add(warmFill);

// Main Planetary Earth Group
const earthGroup = new THREE.Group();
earthGroup.position.set(-0.1, -0.05, 0);
scene.add(earthGroup);

// Canvas procedural texture for Earth & Comparative Synoptic Footprints
const canvas = document.createElement('canvas');
canvas.width = 2048;
canvas.height = 1024;
const ctx = canvas.getContext('2d');

function toCanvasX(lon) { return ((lon + 180) / 360) * 2048; }
function toCanvasY(lat) { return ((90 - lat) / 180) * 1024; }

let currentCompareVariable = 'temperature'; // 'temperature', 'precipitation', 'wind', 'pressure', 'confidence', 'extreme_risk'
let activeLocationFocus = 'mysuru'; // 'all', 'mysuru', 'bengaluru', 'mumbai', 'delhi'
let activeTimelineHour = 'NOW'; // 'NOW', '+6h', '+12h', '+24h', '+48h', '+72h'

const LOCATIONS_CONFIG = {
  mysuru: { name: 'Mysuru', lat: 12.2958, lon: 76.6394, temp: '28°C', rain: '64%', color: '#c25e1a', state: 'Partly Cloudy' },
  bengaluru: { name: 'Bengaluru', lat: 12.9716, lon: 77.5946, temp: '25°C', rain: '52%', color: '#d97706', state: 'Cloudy' },
  mumbai: { name: 'Mumbai', lat: 18.9220, lon: 72.8346, temp: '30°C', rain: '78%', color: '#0284c7', state: 'Humid / Rain' },
  delhi: { name: 'Delhi', lat: 28.6139, lon: 77.2090, temp: '32°C', rain: '21%', color: '#df7a28', state: 'Clear / Heat' }
};

function drawComparisonEarth(variable, focusLoc) {
  // Deep oceanic slate/navy
  const oceanGrad = ctx.createLinearGradient(0, 0, 0, 1024);
  oceanGrad.addColorStop(0, '#0a1018');
  oceanGrad.addColorStop(0.5, '#131e2b');
  oceanGrad.addColorStop(1, '#0a1018');
  ctx.fillStyle = oceanGrad;
  ctx.fillRect(0, 0, 2048, 1024);

  // Continental landmasses (Warm earthy brown / umber bedrock)
  ctx.fillStyle = '#3a2d21';

  // Indian Subcontinent & South Asia
  ctx.beginPath();
  ctx.moveTo(toCanvasX(68), toCanvasY(24));
  ctx.lineTo(toCanvasX(73), toCanvasY(35));
  ctx.lineTo(toCanvasX(80), toCanvasY(33));
  ctx.lineTo(toCanvasX(92), toCanvasY(27));
  ctx.lineTo(toCanvasX(91), toCanvasY(20));
  ctx.lineTo(toCanvasX(82), toCanvasY(13));
  ctx.lineTo(toCanvasX(77.5), toCanvasY(8));
  ctx.lineTo(toCanvasX(72.5), toCanvasY(16));
  ctx.lineTo(toCanvasX(68), toCanvasY(24));
  ctx.closePath();
  ctx.fill();

  // Highlight India (Terracotta tone)
  ctx.fillStyle = '#783c1c';
  ctx.beginPath();
  ctx.moveTo(toCanvasX(70), toCanvasY(23));
  ctx.lineTo(toCanvasX(74), toCanvasY(32));
  ctx.lineTo(toCanvasX(86), toCanvasY(27));
  ctx.lineTo(toCanvasX(80), toCanvasY(14));
  ctx.lineTo(toCanvasX(77.5), toCanvasY(9));
  ctx.lineTo(toCanvasX(74), toCanvasY(17));
  ctx.closePath();
  ctx.fill();

  // Sri Lanka
  ctx.beginPath();
  ctx.arc(toCanvasX(80.5), toCanvasY(7.5), 10, 0, Math.PI * 2);
  ctx.fill();

  // Arabian Peninsula
  ctx.fillStyle = '#4c3725';
  ctx.beginPath();
  ctx.moveTo(toCanvasX(35), toCanvasY(32));
  ctx.lineTo(toCanvasX(55), toCanvasY(31));
  ctx.lineTo(toCanvasX(60), toCanvasY(24));
  ctx.lineTo(toCanvasX(54), toCanvasY(15));
  ctx.lineTo(toCanvasX(44), toCanvasY(12));
  ctx.lineTo(toCanvasX(42), toCanvasY(25));
  ctx.closePath();
  ctx.fill();

  // Africa
  ctx.beginPath();
  ctx.moveTo(toCanvasX(12), toCanvasY(36));
  ctx.lineTo(toCanvasX(32), toCanvasY(32));
  ctx.lineTo(toCanvasX(51), toCanvasY(12));
  ctx.lineTo(toCanvasX(42), toCanvasY(-10));
  ctx.lineTo(toCanvasX(30), toCanvasY(-34));
  ctx.lineTo(toCanvasX(17), toCanvasY(-34));
  ctx.lineTo(toCanvasX(8), toCanvasY(4));
  ctx.lineTo(toCanvasX(-16), toCanvasY(12));
  ctx.lineTo(toCanvasX(0), toCanvasY(35));
  ctx.closePath();
  ctx.fill();

  // Eurasia
  ctx.beginPath();
  ctx.moveTo(toCanvasX(60), toCanvasY(35));
  ctx.lineTo(toCanvasX(125), toCanvasY(42));
  ctx.lineTo(toCanvasX(145), toCanvasY(65));
  ctx.lineTo(toCanvasX(55), toCanvasY(68));
  ctx.lineTo(toCanvasX(-8), toCanvasY(58));
  ctx.lineTo(toCanvasX(12), toCanvasY(45));
  ctx.closePath();
  ctx.fill();

  // Southeast Asia & Australia
  ctx.beginPath();
  ctx.moveTo(toCanvasX(96), toCanvasY(20));
  ctx.lineTo(toCanvasX(108), toCanvasY(11));
  ctx.lineTo(toCanvasX(102), toCanvasY(1));
  ctx.lineTo(toCanvasX(98), toCanvasY(10));
  ctx.closePath();
  ctx.fill();

  ctx.beginPath();
  ctx.ellipse(toCanvasX(134), toCanvasY(-25), 115, 78, 0, 0, Math.PI * 2);
  ctx.fill();

  // Draw Comparative Atmospheric Footprints for each of the 4 nodes
  Object.keys(LOCATIONS_CONFIG).forEach(key => {
    const loc = LOCATIONS_CONFIG[key];
    const lx = toCanvasX(loc.lon);
    const ly = toCanvasY(loc.lat);
    const isFocused = (focusLoc === 'all' || focusLoc === key);
    const rad = isFocused ? 140 : 80;

    if (variable === 'temperature') {
      // Temperature gradients: Delhi (hot terracotta), Mysuru/BLR (warm amber), Mumbai (coastal warm)
      const tGrad = ctx.createRadialGradient(lx, ly, 10, lx, ly, rad);
      if (key === 'delhi') {
        tGrad.addColorStop(0, 'rgba(239, 68, 68, 0.70)'); // High heat 32°C
        tGrad.addColorStop(0.6, 'rgba(217, 119, 6, 0.35)');
      } else if (key === 'mumbai') {
        tGrad.addColorStop(0, 'rgba(249, 115, 22, 0.65)'); // 30°C coastal heat
        tGrad.addColorStop(0.6, 'rgba(217, 119, 6, 0.25)');
      } else if (key === 'bengaluru') {
        tGrad.addColorStop(0, 'rgba(217, 119, 6, 0.50)'); // Mild 25°C
        tGrad.addColorStop(0.6, 'rgba(245, 158, 11, 0.20)');
      } else {
        tGrad.addColorStop(0, 'rgba(194, 94, 26, 0.65)'); // Mysuru 28°C
        tGrad.addColorStop(0.6, 'rgba(217, 119, 6, 0.28)');
      }
      tGrad.addColorStop(1, 'rgba(0, 0, 0, 0)');
      ctx.fillStyle = tGrad;
      ctx.beginPath();
      ctx.arc(lx, ly, rad, 0, Math.PI * 2);
      ctx.fill();
    } else if (variable === 'precipitation') {
      // Precipitation plumes: Mumbai (high 78%), Mysuru (64%), BLR (52%), Delhi (21%)
      const pGrad = ctx.createRadialGradient(lx, ly, 10, lx, ly, rad);
      if (key === 'mumbai') {
        pGrad.addColorStop(0, 'rgba(14, 165, 233, 0.85)'); // Heavy rain plume
        pGrad.addColorStop(0.5, 'rgba(2, 132, 199, 0.45)');
      } else if (key === 'mysuru') {
        pGrad.addColorStop(0, 'rgba(14, 165, 233, 0.70)');
        pGrad.addColorStop(0.5, 'rgba(217, 119, 6, 0.30)');
      } else if (key === 'bengaluru') {
        pGrad.addColorStop(0, 'rgba(56, 189, 248, 0.60)');
        pGrad.addColorStop(0.5, 'rgba(14, 165, 233, 0.25)');
      } else {
        pGrad.addColorStop(0, 'rgba(245, 158, 11, 0.35)'); // Dry line over Delhi
        pGrad.addColorStop(0.5, 'rgba(14, 165, 233, 0.10)');
      }
      pGrad.addColorStop(1, 'rgba(0, 0, 0, 0)');
      ctx.fillStyle = pGrad;
      ctx.beginPath();
      ctx.arc(lx, ly, rad, 0, Math.PI * 2);
      ctx.fill();
    } else {
      // Confidence / Consensus spread
      const cGrad = ctx.createRadialGradient(lx, ly, 10, lx, ly, rad);
      cGrad.addColorStop(0, key === 'delhi' ? 'rgba(234, 179, 8, 0.65)' : 'rgba(34, 197, 94, 0.65)');
      cGrad.addColorStop(0.5, 'rgba(217, 119, 6, 0.25)');
      cGrad.addColorStop(1, 'rgba(0, 0, 0, 0)');
      ctx.fillStyle = cGrad;
      ctx.beginPath();
      ctx.arc(lx, ly, rad, 0, Math.PI * 2);
      ctx.fill();
    }

    // Inter-station connecting geodesic splines between nodes
    ctx.strokeStyle = 'rgba(217, 119, 6, 0.25)';
    ctx.lineWidth = 1.2;
    ctx.setLineDash([4, 4]);
    const myX = toCanvasX(LOCATIONS_CONFIG.mysuru.lon);
    const myY = toCanvasY(LOCATIONS_CONFIG.mysuru.lat);
    ctx.beginPath();
    ctx.moveTo(myX, myY);
    ctx.lineTo(lx, ly);
    ctx.stroke();
    ctx.setLineDash([]);
  });

  // Coordinate grid lines
  ctx.strokeStyle = 'rgba(255, 255, 255, 0.08)';
  ctx.lineWidth = 1.1;
  for (let lat = -80; lat <= 80; lat += 20) {
    ctx.beginPath();
    ctx.moveTo(0, toCanvasY(lat));
    ctx.lineTo(2048, toCanvasY(lat));
    ctx.stroke();
  }
  for (let lon = -180; lon <= 180; lon += 30) {
    ctx.beginPath();
    ctx.moveTo(toCanvasX(lon), 0);
    ctx.lineTo(toCanvasX(lon), 1024);
    ctx.stroke();
  }
}

drawComparisonEarth(currentCompareVariable, activeLocationFocus);
const earthTexture = new THREE.CanvasTexture(canvas);
earthTexture.wrapS = THREE.RepeatWrapping;

// Globe Sphere Mesh
const globeRadius = 4.65;
const globeGeometry = new THREE.SphereGeometry(globeRadius, 64, 64);
const globeMaterial = new THREE.MeshPhongMaterial({
  map: earthTexture,
  bumpScale: 0.06,
  specular: new THREE.Color(0x384556),
  shininess: 16,
  emissive: new THREE.Color(0x161009),
  emissiveIntensity: 0.18
});
const globeMesh = new THREE.Mesh(globeGeometry, globeMaterial);
earthGroup.add(globeMesh);

// Dynamic Atmospheric Cloud Stratification Layer
const cloudCanvas = document.createElement('canvas');
cloudCanvas.width = 1024;
cloudCanvas.height = 512;
const cCtx = cloudCanvas.getContext('2d');
cCtx.fillStyle = 'rgba(0,0,0,0)';
cCtx.fillRect(0, 0, 1024, 512);
cCtx.fillStyle = 'rgba(255, 250, 242, 0.44)';
for (let i = 0; i < 40; i++) {
  const cx = Math.random() * 1024;
  const cy = 70 + Math.random() * 360;
  const rx = 35 + Math.random() * 100;
  const ry = 8 + Math.random() * 24;
  cCtx.beginPath();
  cCtx.ellipse(cx, cy, rx, ry, (Math.random() - 0.5) * 0.4, 0, Math.PI * 2);
  cCtx.fill();
}
const cloudTexture = new THREE.CanvasTexture(cloudCanvas);
const cloudGeo = new THREE.SphereGeometry(globeRadius + 0.08, 64, 64);
const cloudMat = new THREE.MeshLambertMaterial({
  map: cloudTexture,
  transparent: true,
  opacity: 0.52,
  blending: THREE.NormalBlending
});
const cloudMesh = new THREE.Mesh(cloudGeo, cloudMat);
earthGroup.add(cloudMesh);

// Rayleigh Atmospheric Halo
const haloGeo = new THREE.SphereGeometry(globeRadius + 0.44, 48, 48);
const haloMat = new THREE.ShaderMaterial({
  vertexShader: `
    varying vec3 vNormal;
    void main() {
      vNormal = normalize(normalMatrix * normal);
      gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
    }
  `,
  fragmentShader: `
    varying vec3 vNormal;
    void main() {
      float intensity = pow(0.66 - dot(vNormal, vec3(0, 0, 1.0)), 2.6);
      vec3 atmosphericColor = mix(vec3(0.88, 0.48, 0.16), vec3(0.98, 0.89, 0.78), intensity * 0.65);
      gl_FragColor = vec4(atmosphericColor, intensity * 0.76);
    }
  `,
  blending: THREE.AdditiveBlending,
  side: THREE.BackSide,
  transparent: true
});
const haloMesh = new THREE.Mesh(haloGeo, haloMat);
earthGroup.add(haloMesh);

// Location Pin Calculator
function calculatePinPos(lat, lon, rOffset = 0.12) {
  const phi = (90 - lat) * (Math.PI / 180);
  const theta = (lon + 180) * (Math.PI / 180);
  const pinR = globeRadius + rOffset;
  return new THREE.Vector3(
    -pinR * Math.sin(phi) * Math.cos(theta),
    pinR * Math.cos(phi),
    pinR * Math.sin(phi) * Math.sin(theta)
  );
}

const pinsGroup = new THREE.Group();
earthGroup.add(pinsGroup);

const pinMeshes = {};

Object.keys(LOCATIONS_CONFIG).forEach(k => {
  const loc = LOCATIONS_CONFIG[k];
  const pGroup = new THREE.Group();
  const pos = calculatePinPos(loc.lat, loc.lon);
  pGroup.position.copy(pos);

  const cGeo = new THREE.SphereGeometry(0.12, 16, 16);
  const cMat = new THREE.MeshBasicMaterial({ color: loc.color });
  const cMesh = new THREE.Mesh(cGeo, cMat);
  pGroup.add(cMesh);

  const rGeo = new THREE.RingGeometry(0.18, 0.32, 32);
  const rMat = new THREE.MeshBasicMaterial({ color: loc.color, side: THREE.DoubleSide, transparent: true, opacity: 0.85 });
  const rMesh = new THREE.Mesh(rGeo, rMat);
  rMesh.lookAt(pos.clone().normalize());
  pGroup.add(rMesh);

  const dGeo = new THREE.RingGeometry(0.48, 0.72, 48);
  const dMat = new THREE.MeshBasicMaterial({ color: loc.color, side: THREE.DoubleSide, transparent: true, opacity: 0.45 });
  const dMesh = new THREE.Mesh(dGeo, dMat);
  dMesh.lookAt(pos.clone().normalize());
  pGroup.add(dMesh);

  pinsGroup.add(pGroup);
  pinMeshes[k] = { group: pGroup, ring: rMesh, outerRing: dMesh, pos: pos };
});

// Initial Camera Orientation centered over India
earthGroup.rotation.y = -1.80;
earthGroup.rotation.x = 0.20;

// Interactive Drag Rotation
let isDragging = false;
let prevMouse = { x: 0, y: 0 };
let targetRotY = earthGroup.rotation.y;
let targetRotX = earthGroup.rotation.x;

function onPointerDown(e) {
  isDragging = true;
  prevMouse = { x: e.clientX || (e.touches && e.touches[0].clientX), y: e.clientY || (e.touches && e.touches[0].clientY) };
}

function onPointerMove(e) {
  if (!isDragging) return;
  const x = e.clientX || (e.touches && e.touches[0].clientX);
  const y = e.clientY || (e.touches && e.touches[0].clientY);
  const dx = x - prevMouse.x;
  const dy = y - prevMouse.y;
  targetRotY += dx * 0.005;
  targetRotX += dy * 0.005;
  targetRotX = Math.max(-0.85, Math.min(0.85, targetRotX));
  prevMouse = { x, y };
}

function onPointerUp() { isDragging = false; }

window.addEventListener('mousedown', onPointerDown);
window.addEventListener('mousemove', onPointerMove);
window.addEventListener('mouseup', onPointerUp);
window.addEventListener('touchstart', onPointerDown, { passive: true });
window.addEventListener('touchmove', onPointerMove, { passive: true });
window.addEventListener('touchend', onPointerUp);

// Public API hooks for Atmospheric Comparison DOM communication
window.samvayaCompareSetVariable = function(varName) {
  currentCompareVariable = varName;
  drawComparisonEarth(currentCompareVariable, activeLocationFocus);
  earthTexture.needsUpdate = true;
};

window.samvayaCompareFocusLocation = function(locId) {
  activeLocationFocus = locId;
  if (locId === 'all') {
    targetRotY = -1.80;
    targetRotX = 0.20;
  } else if (locId === 'delhi') {
    targetRotY = -1.82;
    targetRotX = 0.42;
  } else if (locId === 'mumbai') {
    targetRotY = -1.72;
    targetRotX = 0.26;
  } else if (locId === 'bengaluru') {
    targetRotY = -1.84;
    targetRotX = 0.18;
  } else if (locId === 'mysuru') {
    targetRotY = -1.80;
    targetRotX = 0.17;
  }
  drawComparisonEarth(currentCompareVariable, activeLocationFocus);
  earthTexture.needsUpdate = true;
};

window.samvayaCompareSetTimeline = function(timeStep) {
  activeTimelineHour = timeStep;
  drawComparisonEarth(currentCompareVariable, activeLocationFocus);
  earthTexture.needsUpdate = true;
};

function handleResize() {
  const w = container.clientWidth || window.innerWidth;
  const h = container.clientHeight || window.innerHeight;
  camera.aspect = w / h;
  camera.updateProjectionMatrix();
  renderer.setSize(w, h);
}
window.addEventListener('resize', handleResize);

let clock = new THREE.Clock();
function animate() {
  requestAnimationFrame(animate);
  const t = clock.getElapsedTime();

  earthGroup.rotation.y += (targetRotY - earthGroup.rotation.y) * 0.08;
  earthGroup.rotation.x += (targetRotX - earthGroup.rotation.x) * 0.08;

  cloudMesh.rotation.y += 0.0007;

  // Pulse rings for active location
  Object.keys(pinMeshes).forEach(k => {
    const item = pinMeshes[k];
    const isFocused = (activeLocationFocus === 'all' || activeLocationFocus === k);
    const speed = isFocused ? 3.4 : 1.8;
    const s = 1.0 + Math.sin(t * speed) * (isFocused ? 0.32 : 0.12);
    item.ring.scale.set(s, s, s);
    const oS = 1.0 + Math.sin(t * (speed * 0.6)) * (isFocused ? 0.22 : 0.08);
    item.outerRing.scale.set(oS, oS, oS);
  });

  renderer.render(scene, camera);
}
animate();

})();
</script>
</div>
<!-- STITCH_THREEJS_END:ANIMATION_54 -->
</body>
</html>
