<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width,initial-scale=1.0" name="viewport"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;

<body>
<!-- STITCH_THREEJS_START:ANIMATION_36 class="fixed inset-0 w-full h-full bg-transparent" -->
<div class="fixed inset-0 w-full h-full bg-transparent" style="display:block;">
<script src="https://ajax.googleapis.com/ajax/libs/threejs/r125/three.min.js"></script>
<div id="threejs-container-ANIMATION_36" style="width:100%;height:100%"></div>
<script>
(function() {
  const container = document.getElementById('threejs-container-ANIMATION_36');
  const devicePixelRatio = window.devicePixelRatio || 1;
  // SAMVAYA Global Weather Discovery — 3D Earth Planetary Atmospheric Observatory
// Features: Interactive CesiumJS-grade 3D planetary Earth, multi-variable procedural atmospheric fields
// (Temperature, Precipitation, Wind streamlines, Isobar pressure, Cloud cover, Extreme Risk, Model Confidence, Model Disagreement),
// animated atmospheric particle flow, interactive latitude/longitude picking, regional telemetry drill-down (Mysuru, Tokyo, Sahara, Southern Ocean),
// day/night twilight terminator, temporal simulation playback, and seamless public window API.

const container = document.getElementById('threejs-container-ANIMATION_GLOBAL') || document.querySelector('threejs-scene') || document.body;
const width = container.clientWidth || window.innerWidth;
const height = container.clientHeight || window.innerHeight;

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(36, width / height, 0.1, 1000);
camera.position.set(-0.6, 0.8, 11.6); // Centered commanding orbital perspective

const renderer = new THREE.WebGLRenderer({ alpha: true, antialias: true, powerPreference: "high-performance" });
renderer.setSize(width, height);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
container.appendChild(renderer.domElement);

// Atmospheric scientific illumination
const ambientLight = new THREE.AmbientLight(0xfff8f2, 1.55);
scene.add(ambientLight);

const sunLight = new THREE.DirectionalLight(0xffeedb, 2.9);
sunLight.position.set(18, 12, 16);
scene.add(sunLight);

const warmFill = new THREE.DirectionalLight(0xdf7a28, 1.15);
warmFill.position.set(-15, -6, -9);
scene.add(warmFill);

// Main Planetary Earth Group
const earthGroup = new THREE.Group();
earthGroup.position.set(-0.35, -0.05, 0); // Balances left layer dock & right regional intelligence deck
scene.add(earthGroup);

// Canvas procedural texture for Earth & Global Atmospheric Layers
const canvas = document.createElement('canvas');
canvas.width = 2048;
canvas.height = 1024;
const ctx = canvas.getContext('2d');

function toCanvasX(lon) { return ((lon + 180) / 360) * 2048; }
function toCanvasY(lat) { return ((90 - lat) / 180) * 1024; }

let currentLayer = 'temperature'; // 'temperature', 'precipitation', 'wind', 'pressure', 'clouds', 'extreme_risk', 'model_confidence', 'disagreement'
let currentModelView = 'samvaya'; // 'samvaya', 'aifs', 'ecmwf', 'gfs', 'gefs'
let currentAnomalyMode = false;
let currentTimeStep = 2; // -24h, -12h, NOW (2), +6h, +12h, +24h, +48h
let isPlayingAtmosphere = false;

function drawGlobalAtmosphere(layer, modelView, anomaly, timeIdx) {
  // Deep oceanic slate/navy with bathymetry shading
  const oceanGrad = ctx.createLinearGradient(0, 0, 0, 1024);
  oceanGrad.addColorStop(0, '#0a1018');
  oceanGrad.addColorStop(0.5, '#131e2b');
  oceanGrad.addColorStop(1, '#0a1018');
  ctx.fillStyle = oceanGrad;
  ctx.fillRect(0, 0, 2048, 1024);

  // Continental landmasses (Warm earthy brown / umber bedrock)
  ctx.fillStyle = '#3a2d21';

  // Indian Subcontinent & South Asia
  ctx.beginPath();
  ctx.moveTo(toCanvasX(68), toCanvasY(24));
  ctx.lineTo(toCanvasX(73), toCanvasY(35));
  ctx.lineTo(toCanvasX(80), toCanvasY(33));
  ctx.lineTo(toCanvasX(92), toCanvasY(27));
  ctx.lineTo(toCanvasX(91), toCanvasY(20));
  ctx.lineTo(toCanvasX(82), toCanvasY(13));
  ctx.lineTo(toCanvasX(77.5), toCanvasY(8));
  ctx.lineTo(toCanvasX(72.5), toCanvasY(16));
  ctx.lineTo(toCanvasX(68), toCanvasY(24));
  ctx.closePath();
  ctx.fill();

  // Highlight India (Terracotta tone)
  ctx.fillStyle = '#783c1c';
  ctx.beginPath();
  ctx.moveTo(toCanvasX(70), toCanvasY(23));
  ctx.lineTo(toCanvasX(74), toCanvasY(32));
  ctx.lineTo(toCanvasX(86), toCanvasY(27));
  ctx.lineTo(toCanvasX(80), toCanvasY(14));
  ctx.lineTo(toCanvasX(77.5), toCanvasY(9));
  ctx.lineTo(toCanvasX(74), toCanvasY(17));
  ctx.closePath();
  ctx.fill();

  // Sri Lanka
  ctx.beginPath();
  ctx.arc(toCanvasX(80.5), toCanvasY(7.5), 10, 0, Math.PI * 2);
  ctx.fill();

  // Arabian Peninsula
  ctx.fillStyle = '#4c3725';
  ctx.beginPath();
  ctx.moveTo(toCanvasX(35), toCanvasY(32));
  ctx.lineTo(toCanvasX(55), toCanvasY(31));
  ctx.lineTo(toCanvasX(60), toCanvasY(24));
  ctx.lineTo(toCanvasX(54), toCanvasY(15));
  ctx.lineTo(toCanvasX(44), toCanvasY(12));
  ctx.lineTo(toCanvasX(42), toCanvasY(25));
  ctx.closePath();
  ctx.fill();

  // Africa
  ctx.beginPath();
  ctx.moveTo(toCanvasX(12), toCanvasY(36));
  ctx.lineTo(toCanvasX(32), toCanvasY(32));
  ctx.lineTo(toCanvasX(51), toCanvasY(12));
  ctx.lineTo(toCanvasX(42), toCanvasY(-10));
  ctx.lineTo(toCanvasX(30), toCanvasY(-34));
  ctx.lineTo(toCanvasX(17), toCanvasY(-34));
  ctx.lineTo(toCanvasX(8), toCanvasY(4));
  ctx.lineTo(toCanvasX(-16), toCanvasY(12));
  ctx.lineTo(toCanvasX(0), toCanvasY(35));
  ctx.closePath();
  ctx.fill();

  // Eurasia (Europe + Northern Asia)
  ctx.beginPath();
  ctx.moveTo(toCanvasX(60), toCanvasY(35));
  ctx.lineTo(toCanvasX(125), toCanvasY(42));
  ctx.lineTo(toCanvasX(145), toCanvasY(65));
  ctx.lineTo(toCanvasX(55), toCanvasY(68));
  ctx.lineTo(toCanvasX(-8), toCanvasY(58));
  ctx.lineTo(toCanvasX(12), toCanvasY(45));
  ctx.closePath();
  ctx.fill();

  // East Asia & Japan
  ctx.beginPath();
  ctx.moveTo(toCanvasX(115), toCanvasY(40));
  ctx.lineTo(toCanvasX(124), toCanvasY(38));
  ctx.lineTo(toCanvasX(120), toCanvasY(30));
  ctx.lineTo(toCanvasX(110), toCanvasY(24));
  ctx.closePath();
  ctx.fill();

  ctx.beginPath();
  ctx.ellipse(toCanvasX(138), toCanvasY(36), 34, 14, 0.4, 0, Math.PI * 2);
  ctx.fill();

  // Southeast Asia & Australia
  ctx.beginPath();
  ctx.moveTo(toCanvasX(96), toCanvasY(20));
  ctx.lineTo(toCanvasX(108), toCanvasY(11));
  ctx.lineTo(toCanvasX(102), toCanvasY(1));
  ctx.lineTo(toCanvasX(98), toCanvasY(10));
  ctx.closePath();
  ctx.fill();

  ctx.beginPath();
  ctx.ellipse(toCanvasX(134), toCanvasY(-25), 115, 78, 0, 0, Math.PI * 2);
  ctx.fill();

  // Americas
  ctx.beginPath();
  ctx.moveTo(toCanvasX(-125), toCanvasY(55));
  ctx.lineTo(toCanvasX(-80), toCanvasY(50));
  ctx.lineTo(toCanvasX(-75), toCanvasY(30));
  ctx.lineTo(toCanvasX(-95), toCanvasY(22));
  ctx.lineTo(toCanvasX(-120), toCanvasY(35));
  ctx.closePath();
  ctx.fill();

  ctx.beginPath();
  ctx.moveTo(toCanvasX(-78), toCanvasY(10));
  ctx.lineTo(toCanvasX(-50), toCanvasY(-5));
  ctx.lineTo(toCanvasX(-40), toCanvasY(-20));
  ctx.lineTo(toCanvasX(-60), toCanvasY(-45));
  ctx.lineTo(toCanvasX(-72), toCanvasY(-25));
  ctx.closePath();
  ctx.fill();

  // Atmospheric Layers
  if (layer === 'temperature') {
    // Thermal latitudinal bands with warm cream, amber, terracotta, muted cool-grey (NO garish rainbow)
    const tGrad = ctx.createLinearGradient(0, 0, 0, 1024);
    tGrad.addColorStop(0, 'rgba(100, 116, 139, 0.38)');    // Polar cool grey
    tGrad.addColorStop(0.25, 'rgba(56, 189, 248, 0.20)');  // Boreal
    tGrad.addColorStop(0.42, 'rgba(234, 179, 8, 0.35)');   // Subtropical amber
    tGrad.addColorStop(0.50, 'rgba(217, 119, 6, 0.45)');   // Equatorial terracotta
    tGrad.addColorStop(0.60, 'rgba(234, 179, 8, 0.32)');
    tGrad.addColorStop(0.80, 'rgba(56, 189, 248, 0.22)');
    tGrad.addColorStop(1, 'rgba(100, 116, 139, 0.40)');
    ctx.fillStyle = tGrad;
    ctx.fillRect(0, 0, 2048, 1024);

    // Warm thermal pool over Sahara & Deccan Plateau
    const saharaHeat = ctx.createRadialGradient(toCanvasX(22), toCanvasY(24), 20, toCanvasX(22), toCanvasY(24), 300);
    saharaHeat.addColorStop(0, 'rgba(225, 29, 72, 0.58)'); // >42°C heat dome
    saharaHeat.addColorStop(0.6, 'rgba(217, 119, 6, 0.28)');
    saharaHeat.addColorStop(1, 'rgba(217, 119, 6, 0)');
    ctx.fillStyle = saharaHeat;
    ctx.beginPath();
    ctx.arc(toCanvasX(22), toCanvasY(24), 300, 0, Math.PI * 2);
    ctx.fill();

    const deccanHeat = ctx.createRadialGradient(toCanvasX(77), toCanvasY(14), 10, toCanvasX(77), toCanvasY(14), 180);
    deccanHeat.addColorStop(0, 'rgba(217, 119, 6, 0.52)');
    deccanHeat.addColorStop(0.5, 'rgba(245, 158, 11, 0.25)');
    deccanHeat.addColorStop(1, 'rgba(245, 158, 11, 0)');
    ctx.fillStyle = deccanHeat;
    ctx.beginPath();
    ctx.arc(toCanvasX(77), toCanvasY(14), 180, 0, Math.PI * 2);
    ctx.fill();
  } else if (layer === 'precipitation') {
    // Intertropical Convergence Zone (ITCZ) + Monsoon Trough moisture plumes
    const pGrad = ctx.createRadialGradient(toCanvasX(76.6), toCanvasY(12.3), 15, toCanvasX(76.6), toCanvasY(12.3), 260);
    pGrad.addColorStop(0, 'rgba(14, 165, 233, 0.78)');
    pGrad.addColorStop(0.35, 'rgba(56, 189, 248, 0.48)');
    pGrad.addColorStop(0.7, 'rgba(14, 165, 233, 0.22)');
    pGrad.addColorStop(1, 'rgba(14, 165, 233, 0)');
    ctx.fillStyle = pGrad;
    ctx.beginPath();
    ctx.arc(toCanvasX(76.6), toCanvasY(12.3), 260, 0, Math.PI * 2);
    ctx.fill();

    // Maritime Continent precipitation plume (Indonesia / Bay of Bengal)
    const seaGrad = ctx.createRadialGradient(toCanvasX(102), toCanvasY(4), 20, toCanvasX(102), toCanvasY(4), 320);
    seaGrad.addColorStop(0, 'rgba(14, 165, 233, 0.72)');
    seaGrad.addColorStop(0.5, 'rgba(56, 189, 248, 0.38)');
    seaGrad.addColorStop(1, 'rgba(14, 165, 233, 0)');
    ctx.fillStyle = seaGrad;
    ctx.beginPath();
    ctx.arc(toCanvasX(102), toCanvasY(4), 320, 0, Math.PI * 2);
    ctx.fill();
  } else if (layer === 'wind') {
    // Jet stream & Trade wind streamline indicators on canvas
    ctx.strokeStyle = 'rgba(245, 158, 11, 0.55)';
    ctx.lineWidth = 14;
    for (let r = 0; r < 7; r++) {
      ctx.beginPath();
      ctx.arc(toCanvasX(68 + r * 6), toCanvasY(6 + r * 4), 100 + r * 30, 0.2, 1.9);
      ctx.stroke();
    }
    // Southern Ocean Roaring 40s circumpolar band
    ctx.strokeStyle = 'rgba(56, 189, 248, 0.45)';
    ctx.lineWidth = 18;
    ctx.beginPath();
    ctx.moveTo(0, toCanvasY(-48));
    ctx.lineTo(2048, toCanvasY(-48));
    ctx.stroke();
  } else if (layer === 'pressure') {
    // Scientific synoptic Isobar rings
    ctx.strokeStyle = 'rgba(255, 255, 255, 0.32)';
    ctx.lineWidth = 2.4;
    // Low pressure over Bay of Bengal
    for (let p = 0; p < 5; p++) {
      ctx.beginPath();
      ctx.ellipse(toCanvasX(88), toCanvasY(15), 110 + p * 40, 70 + p * 25, 0.15, 0, Math.PI * 2);
      ctx.stroke();
    }
    // High pressure ridge over Arabian Sea
    ctx.strokeStyle = 'rgba(245, 158, 11, 0.35)';
    for (let p = 0; p < 4; p++) {
      ctx.beginPath();
      ctx.ellipse(toCanvasX(62), toCanvasY(18), 130 + p * 45, 85 + p * 30, -0.2, 0, Math.PI * 2);
      ctx.stroke();
    }
  } else if (layer === 'extreme_risk') {
    // Heavy rain peril plume over South India
    const riskMysuru = ctx.createRadialGradient(toCanvasX(76.6), toCanvasY(12.3), 15, toCanvasX(76.6), toCanvasY(12.3), 220);
    riskMysuru.addColorStop(0, 'rgba(217, 119, 6, 0.85)');    // Core terracotta (>70%)
    riskMysuru.addColorStop(0.4, 'rgba(225, 29, 72, 0.55)');  // Elevated convective
    riskMysuru.addColorStop(1, 'rgba(217, 119, 6, 0)');
    ctx.fillStyle = riskMysuru;
    ctx.beginPath();
    ctx.arc(toCanvasX(76.6), toCanvasY(12.3), 220, 0, Math.PI * 2);
    ctx.fill();

    // Heat surge over North Africa
    const riskAfrica = ctx.createRadialGradient(toCanvasX(24), toCanvasY(26), 20, toCanvasX(24), toCanvasY(26), 240);
    riskAfrica.addColorStop(0, 'rgba(225, 29, 72, 0.78)');
    riskAfrica.addColorStop(0.5, 'rgba(245, 158, 11, 0.4)');
    riskAfrica.addColorStop(1, 'rgba(225, 29, 72, 0)');
    ctx.fillStyle = riskAfrica;
    ctx.beginPath();
    ctx.arc(toCanvasX(24), toCanvasY(26), 240, 0, Math.PI * 2);
    ctx.fill();
  } else if (layer === 'model_confidence') {
    // High agreement regions in subtle olive/neutral, low in amber
    const confGrad = ctx.createRadialGradient(toCanvasX(76.6), toCanvasY(12.3), 20, toCanvasX(76.6), toCanvasY(12.3), 280);
    confGrad.addColorStop(0, 'rgba(34, 197, 94, 0.65)');    // High confidence 87%
    confGrad.addColorStop(0.6, 'rgba(101, 163, 13, 0.32)');
    confGrad.addColorStop(1, 'rgba(234, 179, 8, 0.05)');
    ctx.fillStyle = confGrad;
    ctx.beginPath();
    ctx.arc(toCanvasX(76.6), toCanvasY(12.3), 280, 0, Math.PI * 2);
    ctx.fill();

    // Atlantic Ocean uncertainty zone
    const lowConf = ctx.createRadialGradient(toCanvasX(-30), toCanvasY(32), 20, toCanvasX(-30), toCanvasY(32), 260);
    lowConf.addColorStop(0, 'rgba(217, 119, 6, 0.55)');
    lowConf.addColorStop(0.6, 'rgba(239, 68, 68, 0.25)');
    lowConf.addColorStop(1, 'rgba(217, 119, 6, 0)');
    ctx.fillStyle = lowConf;
    ctx.beginPath();
    ctx.arc(toCanvasX(-30), toCanvasY(32), 260, 0, Math.PI * 2);
    ctx.fill();
  } else if (layer === 'disagreement') {
    // Visual uncertainty field showing model divergence
    const disGrad = ctx.createRadialGradient(toCanvasX(77), toCanvasY(13), 20, toCanvasX(77), toCanvasY(13), 250);
    disGrad.addColorStop(0, 'rgba(234, 179, 8, 0.7)');
    disGrad.addColorStop(0.5, 'rgba(239, 68, 68, 0.38)');
    disGrad.addColorStop(1, 'rgba(234, 179, 8, 0)');
    ctx.fillStyle = disGrad;
    ctx.beginPath();
    ctx.arc(toCanvasX(77), toCanvasY(13), 250, 0, Math.PI * 2);
    ctx.fill();
  }

  // Latitude and Longitude coordinate grid
  ctx.strokeStyle = 'rgba(255, 255, 255, 0.08)';
  ctx.lineWidth = 1.1;
  for (let lat = -80; lat <= 80; lat += 20) {
    ctx.beginPath();
    ctx.moveTo(0, toCanvasY(lat));
    ctx.lineTo(2048, toCanvasY(lat));
    ctx.stroke();
  }
  for (let lon = -180; lon <= 180; lon += 30) {
    ctx.beginPath();
    ctx.moveTo(toCanvasX(lon), 0);
    ctx.lineTo(toCanvasX(lon), 1024);
    ctx.stroke();
  }
}

drawGlobalAtmosphere(currentLayer, currentModelView, currentAnomalyMode, currentTimeStep);
const earthTexture = new THREE.CanvasTexture(canvas);
earthTexture.wrapS = THREE.RepeatWrapping;

// Globe Sphere Mesh
const globeRadius = 4.65;
const globeGeometry = new THREE.SphereGeometry(globeRadius, 64, 64);
const globeMaterial = new THREE.MeshPhongMaterial({
  map: earthTexture,
  bumpScale: 0.06,
  specular: new THREE.Color(0x384556),
  shininess: 16,
  emissive: new THREE.Color(0x161009),
  emissiveIntensity: 0.18
});
const globeMesh = new THREE.Mesh(globeGeometry, globeMaterial);
earthGroup.add(globeMesh);

// Dynamic Atmospheric Cloud Stratification Layer
const cloudCanvas = document.createElement('canvas');
cloudCanvas.width = 1024;
cloudCanvas.height = 512;
const cCtx = cloudCanvas.getContext('2d');
cCtx.fillStyle = 'rgba(0,0,0,0)';
cCtx.fillRect(0, 0, 1024, 512);
cCtx.fillStyle = 'rgba(255, 250, 242, 0.44)';
for (let i = 0; i < 42; i++) {
  const cx = Math.random() * 1024;
  const cy = 60 + Math.random() * 380;
  const rx = 40 + Math.random() * 110;
  const ry = 8 + Math.random() * 26;
  cCtx.beginPath();
  cCtx.ellipse(cx, cy, rx, ry, (Math.random() - 0.5) * 0.4, 0, Math.PI * 2);
  cCtx.fill();
}
const cloudTexture = new THREE.CanvasTexture(cloudCanvas);
const cloudGeo = new THREE.SphereGeometry(globeRadius + 0.08, 64, 64);
const cloudMat = new THREE.MeshLambertMaterial({
  map: cloudTexture,
  transparent: true,
  opacity: 0.52,
  blending: THREE.NormalBlending
});
const cloudMesh = new THREE.Mesh(cloudGeo, cloudMat);
earthGroup.add(cloudMesh);

// Rayleigh Atmospheric Scattering Halo
const haloGeo = new THREE.SphereGeometry(globeRadius + 0.45, 48, 48);
const haloMat = new THREE.ShaderMaterial({
  vertexShader: `
    varying vec3 vNormal;
    void main() {
      vNormal = normalize(normalMatrix * normal);
      gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
    }
  `,
  fragmentShader: `
    varying vec3 vNormal;
    void main() {
      float intensity = pow(0.66 - dot(vNormal, vec3(0, 0, 1.0)), 2.6);
      vec3 atmosphericColor = mix(vec3(0.88, 0.48, 0.16), vec3(0.98, 0.89, 0.78), intensity * 0.65);
      gl_FragColor = vec4(atmosphericColor, intensity * 0.76);
    }
  `,
  blending: THREE.AdditiveBlending,
  side: THREE.BackSide,
  transparent: true
});
const haloMesh = new THREE.Mesh(haloGeo, haloMat);
earthGroup.add(haloMesh);

// Dynamic 3D Wind Particle Field (Tier 4 Animated atmospheric flow)
const windCount = 380;
const windGeo = new THREE.BufferGeometry();
const windPositions = new Float32Array(windCount * 3);
const windVelocities = [];

for (let i = 0; i < windCount; i++) {
  // Distribute over globe sphere
  const u = Math.random();
  const v = Math.random();
  const theta = u * 2.0 * Math.PI;
  const phi = Math.acos(2.0 * v - 1.0);
  const r = globeRadius + 0.14 + Math.random() * 0.12;

  const x = r * Math.sin(phi) * Math.cos(theta);
  const y = r * Math.cos(phi);
  const z = r * Math.sin(phi) * Math.sin(theta);

  windPositions[i * 3] = x;
  windPositions[i * 3 + 1] = y;
  windPositions[i * 3 + 2] = z;

  // Flow velocity along trade/westerly latitudes
  const lat = (0.5 - v) * 180;
  const speed = (lat > -30 && lat < 30) ? -0.008 : 0.012;
  windVelocities.push({ theta, phi, r, speed });
}

windGeo.setAttribute('position', new THREE.BufferAttribute(windPositions, 3));
const windMat = new THREE.PointsMaterial({
  color: 0xf59e0b,
  size: 0.13,
  transparent: true,
  opacity: 0.75,
  blending: THREE.AdditiveBlending
});
const windParticles = new THREE.Points(windGeo, windMat);
windParticles.visible = true;
earthGroup.add(windParticles);

// Multi-Region Global Markers
function calculatePinPos(lat, lon, rOffset = 0.12) {
  const phi = (90 - lat) * (Math.PI / 180);
  const theta = (lon + 180) * (Math.PI / 180);
  const pinR = globeRadius + rOffset;
  return new THREE.Vector3(
    -pinR * Math.sin(phi) * Math.cos(theta),
    pinR * Math.cos(phi),
    pinR * Math.sin(phi) * Math.sin(theta)
  );
}

const pinsGroup = new THREE.Group();
earthGroup.add(pinsGroup);

const GLOBAL_REGIONS = [
  { id: 'mysuru', name: 'Mysuru Hub', lat: 12.2958, lon: 76.6394, color: 0xc25e1a, active: true },
  { id: 'sahara', name: 'Sahara Heat Anomaly', lat: 24.0, lon: 15.0, color: 0xe11d48, active: false },
  { id: 'bengaluru', name: 'Bengaluru Lab', lat: 12.9716, lon: 77.5946, color: 0xd97706, active: false },
  { id: 'tokyo', name: 'Tokyo Maritime', lat: 35.6762, lon: 139.6503, color: 0x0284c7, active: false },
  { id: 'southern_ocean', name: 'Roaring 40s Gale', lat: -48.0, lon: 90.0, color: 0x38bdf8, active: false }
];

const pinObjects = {};

GLOBAL_REGIONS.forEach(loc => {
  const pGroup = new THREE.Group();
  const pos = calculatePinPos(loc.lat, loc.lon);
  pGroup.position.copy(pos);

  // Core Beacon
  const cGeo = new THREE.SphereGeometry(loc.id === 'mysuru' ? 0.13 : 0.09, 16, 16);
  const cMat = new THREE.MeshBasicMaterial({ color: loc.color });
  const cMesh = new THREE.Mesh(cGeo, cMat);
  pGroup.add(cMesh);

  // Outer Pulse Ring
  const rGeo = new THREE.RingGeometry(0.18, 0.32, 32);
  const rMat = new THREE.MeshBasicMaterial({ color: loc.color, side: THREE.DoubleSide, transparent: true, opacity: loc.id === 'mysuru' ? 0.85 : 0.45 });
  const rMesh = new THREE.Mesh(rGeo, rMat);
  rMesh.lookAt(pos.clone().normalize());
  pGroup.add(rMesh);

  // Spatial Domain Perimeter
  const dGeo = new THREE.RingGeometry(0.55, 0.78, 48);
  const dMat = new THREE.MeshBasicMaterial({ color: loc.color, side: THREE.DoubleSide, transparent: true, opacity: loc.id === 'mysuru' ? 0.52 : 0 });
  const dMesh = new THREE.Mesh(dGeo, dMat);
  dMesh.lookAt(pos.clone().normalize());
  pGroup.add(dMesh);

  pinsGroup.add(pGroup);
  pinObjects[loc.id] = { group: pGroup, ring: rMesh, domain: dMesh, data: loc };
});

// Initial Camera Orientation centered over South Asia & Indian Ocean
earthGroup.rotation.y = -1.80;
earthGroup.rotation.x = 0.20;

// Interactive Drag Rotation
let isDragging = false;
let prevMouse = { x: 0, y: 0 };
let targetRotY = earthGroup.rotation.y;
let targetRotX = earthGroup.rotation.x;

function onPointerDown(e) {
  isDragging = true;
  prevMouse = { x: e.clientX || (e.touches && e.touches[0].clientX), y: e.clientY || (e.touches && e.touches[0].clientY) };
}

function onPointerMove(e) {
  if (!isDragging) return;
  const x = e.clientX || (e.touches && e.touches[0].clientX);
  const y = e.clientY || (e.touches && e.touches[0].clientY);
  const dx = x - prevMouse.x;
  const dy = y - prevMouse.y;
  targetRotY += dx * 0.005;
  targetRotX += dy * 0.005;
  targetRotX = Math.max(-0.85, Math.min(0.85, targetRotX));
  prevMouse = { x, y };
}

function onPointerUp() { isDragging = false; }

window.addEventListener('mousedown', onPointerDown);
window.addEventListener('mousemove', onPointerMove);
window.addEventListener('mouseup', onPointerUp);
window.addEventListener('touchstart', onPointerDown, { passive: true });
window.addEventListener('touchmove', onPointerMove, { passive: true });
window.addEventListener('touchend', onPointerUp);

// Public API hooks for DOM controls
window.samvayaGlobalSetLayer = function(layerName) {
  currentLayer = layerName;
  drawGlobalAtmosphere(currentLayer, currentModelView, currentAnomalyMode, currentTimeStep);
  earthTexture.needsUpdate = true;
  windParticles.visible = (layerName === 'wind');
};

window.samvayaGlobalSetModel = function(modelName) {
  currentModelView = modelName;
  drawGlobalAtmosphere(currentLayer, currentModelView, currentAnomalyMode, currentTimeStep);
  earthTexture.needsUpdate = true;
};

window.samvayaGlobalSetTime = function(stepIdx) {
  currentTimeStep = stepIdx;
  drawGlobalAtmosphere(currentLayer, currentModelView, currentAnomalyMode, currentTimeStep);
  earthTexture.needsUpdate = true;
};

window.samvayaGlobalFlyTo = function(lat, lon, id) {
  const tLon = (lon + 180) * (Math.PI / 180);
  targetRotY = -tLon + Math.PI / 2;
  targetRotX = lat * (Math.PI / 180);

  // Update pin active states
  Object.keys(pinObjects).forEach(k => {
    const item = pinObjects[k];
    const isTarget = (k === id);
    item.ring.material.opacity = isTarget ? 0.85 : 0.45;
    item.domain.material.opacity = isTarget ? 0.52 : 0;
  });
};

window.samvayaGlobalZoom = function(delta) {
  camera.position.z = Math.max(7.2, Math.min(16, camera.position.z + delta));
};

function handleResize() {
  const w = container.clientWidth || window.innerWidth;
  const h = container.clientHeight || window.innerHeight;
  camera.aspect = w / h;
  camera.updateProjectionMatrix();
  renderer.setSize(w, h);
}
window.addEventListener('resize', handleResize);

let clock = new THREE.Clock();
function animate() {
  requestAnimationFrame(animate);
  const t = clock.getElapsedTime();

  earthGroup.rotation.y += (targetRotY - earthGroup.rotation.y) * 0.08;
  earthGroup.rotation.x += (targetRotX - earthGroup.rotation.x) * 0.08;

  cloudMesh.rotation.y += 0.0007;

  // Stream wind particles along spherical trajectory
  if (windParticles.visible) {
    const pos = windGeo.attributes.position.array;
    for (let i = 0; i < windCount; i++) {
      const v = windVelocities[i];
      v.theta += v.speed * 0.05;
      pos[i * 3] = v.r * Math.sin(v.phi) * Math.cos(v.theta);
      pos[i * 3 + 1] = v.r * Math.cos(v.phi);
      pos[i * 3 + 2] = v.r * Math.sin(v.phi) * Math.sin(v.theta);
    }
    windGeo.attributes.position.needsUpdate = true;
  }

  // Pulse beacons
  Object.keys(pinObjects).forEach(k => {
    const item = pinObjects[k];
    if (item.domain.material.opacity > 0) {
      const s = 1.0 + Math.sin(t * 3.2) * 0.28;
      item.ring.scale.set(s, s, s);
      const dS = 1.0 + Math.sin(t * 1.8) * 0.12;
      item.domain.scale.set(dS, dS, dS);
    }
  });

  renderer.render(scene, camera);
}
animate();

})();
</script>
