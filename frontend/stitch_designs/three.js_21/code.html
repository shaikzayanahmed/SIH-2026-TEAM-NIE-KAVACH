<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width,initial-scale=1.0" name="viewport"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
    }
  </style>
</head>
<body>
<!-- STITCH_THREEJS_START:ANIMATION_66 class="fixed inset-0 w-full h-full bg-transparent" -->
<div class="fixed inset-0 w-full h-full bg-transparent" style="display:block;">
<script src="https://ajax.googleapis.com/ajax/libs/threejs/r125/three.min.js"></script>
<div id="threejs-container-ANIMATION_66" style="width:100%;height:100%"></div>
<script>
(function() {
  const container = document.getElementById('threejs-container-ANIMATION_66');
  const devicePixelRatio = window.devicePixelRatio || 1;
  // SAMVAYA — Cloudy / Overcast Atmospheric State: 3D Earth Stratification Globe
// Features: Interactive Three.js 3D Earth with dynamic multi-strata cloud layers, diffuse ambient insolation,
// variable cloud cover progression (Light 32% -> Moderate 67% -> Overcast 95%), Rayleigh atmospheric haze,
// and synoptic anchor pin at Mysuru (12.2958° N, 76.6394° E).
// Exposes public window API for seamless cloud density modulation & transition testing.

const container = document.getElementById('threejs-container-ANIMATION_CLOUDY') || document.querySelector('threejs-scene') || document.body;
const width = container.clientWidth || window.innerWidth;
const height = container.clientHeight || window.innerHeight;

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(36, width / height, 0.1, 1000);
camera.position.set(-0.35, 0.65, 11.2);

const renderer = new THREE.WebGLRenderer({ alpha: true, antialias: true, powerPreference: "high-performance" });
renderer.setSize(width, height);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
container.appendChild(renderer.domElement);

// Diffuse, soft ambient illumination (characteristic of cloud scatter)
const ambientLight = new THREE.AmbientLight(0xf4efe6, 2.3);
scene.add(ambientLight);

// Softened, non-harsh sun light diffused through stratus / stratocumulus
const sunLight = new THREE.DirectionalLight(0xfff1dc, 2.1);
sunLight.position.set(16, 12, 14);
scene.add(sunLight);

// Subtle warm earth back-fill
const warmFill = new THREE.DirectionalLight(0xc97a38, 0.85);
warmFill.position.set(-15, -6, -8);
scene.add(warmFill);

// Main Planetary Earth Group
const earthGroup = new THREE.Group();
earthGroup.position.set(-0.1, -0.05, 0);
scene.add(earthGroup);

// Canvas procedural texture for Earth under Diffuse Cloudy Inflow
const canvas = document.createElement('canvas');
canvas.width = 2048;
canvas.height = 1024;
const ctx = canvas.getContext('2d');

function toCanvasX(lon) { return ((lon + 180) / 360) * 2048; }
function toCanvasY(lat) { return ((90 - lat) / 180) * 1024; }

let currentCloudRegime = 'overcast'; // 'light', 'moderate', 'overcast', 'rain_transition'
let currentCoverPercent = 78;

function drawCloudyEarth(regime) {
  // Diffuse oceanic base with muted slate-cream undertone
  const oceanGrad = ctx.createLinearGradient(0, 0, 0, 1024);
  oceanGrad.addColorStop(0, '#0a1017');
  oceanGrad.addColorStop(0.5, '#131e28');
  oceanGrad.addColorStop(1, '#0a1017');
  ctx.fillStyle = oceanGrad;
  ctx.fillRect(0, 0, 2048, 1024);

  // Continents: Muted warm stone brown with subdued contrast
  ctx.fillStyle = '#382f25';

  // Indian Subcontinent & South Asia
  ctx.beginPath();
  ctx.moveTo(toCanvasX(68), toCanvasY(24));
  ctx.lineTo(toCanvasX(73), toCanvasY(35));
  ctx.lineTo(toCanvasX(80), toCanvasY(33));
  ctx.lineTo(toCanvasX(92), toCanvasY(27));
  ctx.lineTo(toCanvasX(91), toCanvasY(20));
  ctx.lineTo(toCanvasX(82), toCanvasY(13));
  ctx.lineTo(toCanvasX(77.5), toCanvasY(8));
  ctx.lineTo(toCanvasX(72.5), toCanvasY(16));
  ctx.lineTo(toCanvasX(68), toCanvasY(24));
  ctx.closePath();
  ctx.fill();

  // Highlight India (Softened Terracotta Bedrock under overcast diffuse light)
  ctx.fillStyle = (regime === 'overcast') ? '#6b361a' : '#7d3e1d';
  ctx.beginPath();
  ctx.moveTo(toCanvasX(70), toCanvasY(23));
  ctx.lineTo(toCanvasX(74), toCanvasY(32));
  ctx.lineTo(toCanvasX(86), toCanvasY(27));
  ctx.lineTo(toCanvasX(80), toCanvasY(14));
  ctx.lineTo(toCanvasX(77.5), toCanvasY(9));
  ctx.lineTo(toCanvasX(74), toCanvasY(17));
  ctx.closePath();
  ctx.fill();

  // Sri Lanka
  ctx.beginPath();
  ctx.arc(toCanvasX(80.5), toCanvasY(7.5), 10, 0, Math.PI * 2);
  ctx.fill();

  // Arabian Peninsula
  ctx.fillStyle = '#443424';
  ctx.beginPath();
  ctx.moveTo(toCanvasX(35), toCanvasY(32));
  ctx.lineTo(toCanvasX(55), toCanvasY(31));
  ctx.lineTo(toCanvasX(60), toCanvasY(24));
  ctx.lineTo(toCanvasX(54), toCanvasY(15));
  ctx.lineTo(toCanvasX(44), toCanvasY(12));
  ctx.lineTo(toCanvasX(42), toCanvasY(25));
  ctx.closePath();
  ctx.fill();

  // Africa
  ctx.beginPath();
  ctx.moveTo(toCanvasX(12), toCanvasY(36));
  ctx.lineTo(toCanvasX(32), toCanvasY(32));
  ctx.lineTo(toCanvasX(51), toCanvasY(12));
  ctx.lineTo(toCanvasX(42), toCanvasY(-10));
  ctx.lineTo(toCanvasX(30), toCanvasY(-34));
  ctx.lineTo(toCanvasX(17), toCanvasY(-34));
  ctx.lineTo(toCanvasX(8), toCanvasY(4));
  ctx.lineTo(toCanvasX(-16), toCanvasY(12));
  ctx.lineTo(toCanvasX(0), toCanvasY(35));
  ctx.closePath();
  ctx.fill();

  // Eurasia
  ctx.beginPath();
  ctx.moveTo(toCanvasX(60), toCanvasY(35));
  ctx.lineTo(toCanvasX(125), toCanvasY(42));
  ctx.lineTo(toCanvasX(145), toCanvasY(65));
  ctx.lineTo(toCanvasX(55), toCanvasY(68));
  ctx.lineTo(toCanvasX(-8), toCanvasY(58));
  ctx.lineTo(toCanvasX(12), toCanvasY(45));
  ctx.closePath();
  ctx.fill();

  // Southeast Asia & Australia
  ctx.beginPath();
  ctx.moveTo(toCanvasX(96), toCanvasY(20));
  ctx.lineTo(toCanvasX(108), toCanvasY(11));
  ctx.lineTo(toCanvasX(102), toCanvasY(1));
  ctx.lineTo(toCanvasX(98), toCanvasY(10));
  ctx.closePath();
  ctx.fill();

  ctx.beginPath();
  ctx.ellipse(toCanvasX(134), toCanvasY(-25), 115, 78, 0, 0, Math.PI * 2);
  ctx.fill();

  // Synoptic Cloud Envelope & Orographic Haze over Western Ghats & Mysuru
  const fX = toCanvasX(76.6394); // Mysuru Lon
  const fY = toCanvasY(12.2958); // Mysuru Lat

  const cloudRad = (regime === 'overcast') ? 310 : (regime === 'moderate') ? 240 : 170;
  const cGrad = ctx.createRadialGradient(fX, fY, 20, fX, fY, cloudRad);
  cGrad.addColorStop(0, 'rgba(235, 230, 222, 0.60)'); // Diffuse warm ivory stratocumulus
  cGrad.addColorStop(0.5, 'rgba(215, 208, 198, 0.35)');
  cGrad.addColorStop(0.8, 'rgba(189, 184, 172, 0.15)');
  cGrad.addColorStop(1, 'rgba(0, 0, 0, 0)');
  ctx.fillStyle = cGrad;
  ctx.beginPath();
  ctx.arc(fX, fY, cloudRad, 0, Math.PI * 2);
  ctx.fill();

  // Subtle consensus ring around Mysuru Anchor
  ctx.strokeStyle = 'rgba(217, 119, 6, 0.55)';
  ctx.lineWidth = 1.6;
  ctx.setLineDash([3, 4]);
  ctx.beginPath();
  ctx.arc(fX, fY, 82, 0, Math.PI * 2);
  ctx.stroke();
  ctx.setLineDash([]);

  // Coordinate grid lines (delicate muted ivory)
  ctx.strokeStyle = 'rgba(240, 238, 231, 0.07)';
  ctx.lineWidth = 1.0;
  for (let lat = -80; lat <= 80; lat += 20) {
    ctx.beginPath();
    ctx.moveTo(0, toCanvasY(lat));
    ctx.lineTo(2048, toCanvasY(lat));
    ctx.stroke();
  }
  for (let lon = -180; lon <= 180; lon += 30) {
    ctx.beginPath();
    ctx.moveTo(toCanvasX(lon), 0);
    ctx.lineTo(toCanvasX(lon), 1024);
    ctx.stroke();
  }
}

drawCloudyEarth(currentCloudRegime);
const earthTexture = new THREE.CanvasTexture(canvas);
earthTexture.wrapS = THREE.RepeatWrapping;

// Globe Sphere Mesh
const globeRadius = 4.65;
const globeGeometry = new THREE.SphereGeometry(globeRadius, 64, 64);
const globeMaterial = new THREE.MeshPhongMaterial({
  map: earthTexture,
  bumpScale: 0.05,
  specular: new THREE.Color(0x2d3744),
  shininess: 12,
  emissive: new THREE.Color(0x130e09),
  emissiveIntensity: 0.16
});
const globeMesh = new THREE.Mesh(globeGeometry, globeMaterial);
earthGroup.add(globeMesh);

// Layer 1: Dense Mid-Level Stratocumulus Cloud Canvas
const cloudCanvas = document.createElement('canvas');
cloudCanvas.width = 1024;
cloudCanvas.height = 512;
const cCtx = cloudCanvas.getContext('2d');

function generateProceduralCloudTexture(densityFactor) {
  cCtx.clearRect(0, 0, 1024, 512);
  const cloudCount = Math.floor(65 * densityFactor);
  for (let i = 0; i < cloudCount; i++) {
    const cx = Math.random() * 1024;
    const cy = 60 + Math.random() * 380;
    const rx = 45 + Math.random() * 140;
    const ry = 10 + Math.random() * 32;
    const grad = cCtx.createRadialGradient(cx, cy, 2, cx, cy, rx);
    grad.addColorStop(0, `rgba(245, 240, 232, ${0.45 + Math.random() * 0.35})`);
    grad.addColorStop(0.6, `rgba(228, 222, 212, ${0.25 + Math.random() * 0.20})`);
    grad.addColorStop(1, 'rgba(215, 208, 198, 0)');
    cCtx.fillStyle = grad;
    cCtx.beginPath();
    cCtx.ellipse(cx, cy, rx, ry, (Math.random() - 0.5) * 0.25, 0, Math.PI * 2);
    cCtx.fill();
  }
}

generateProceduralCloudTexture(1.15);
const cloudTexture = new THREE.CanvasTexture(cloudCanvas);
const cloudGeo = new THREE.SphereGeometry(globeRadius + 0.09, 64, 64);
const cloudMat = new THREE.MeshLambertMaterial({
  map: cloudTexture,
  transparent: true,
  opacity: 0.68,
  blending: THREE.NormalBlending
});
const cloudMesh = new THREE.Mesh(cloudGeo, cloudMat);
earthGroup.add(cloudMesh);

// Layer 2: High Altostratus Stratum (Outer Drifting Veil)
const highCloudCanvas = document.createElement('canvas');
highCloudCanvas.width = 1024;
highCloudCanvas.height = 512;
const hcCtx = highCloudCanvas.getContext('2d');
for (let i = 0; i < 35; i++) {
  const cx = Math.random() * 1024;
  const cy = 80 + Math.random() * 340;
  const rx = 70 + Math.random() * 180;
  const ry = 6 + Math.random() * 18;
  const grad = hcCtx.createRadialGradient(cx, cy, 0, cx, cy, rx);
  grad.addColorStop(0, 'rgba(250, 246, 240, 0.35)');
  grad.addColorStop(1, 'rgba(230, 225, 215, 0)');
  hcCtx.fillStyle = grad;
  hcCtx.beginPath();
  hcCtx.ellipse(cx, cy, rx, ry, 0, 0, Math.PI * 2);
  hcCtx.fill();
}
const highCloudTexture = new THREE.CanvasTexture(highCloudCanvas);
const highCloudGeo = new THREE.SphereGeometry(globeRadius + 0.18, 48, 48);
const highCloudMat = new THREE.MeshLambertMaterial({
  map: highCloudTexture,
  transparent: true,
  opacity: 0.48,
  blending: THREE.NormalBlending
});
const highCloudMesh = new THREE.Mesh(highCloudGeo, highCloudMat);
earthGroup.add(highCloudMesh);

// Diffuse Rayleigh Haze Shader (Soft Warm Muted Cream Halo)
const haloGeo = new THREE.SphereGeometry(globeRadius + 0.42, 48, 48);
const haloMat = new THREE.ShaderMaterial({
  vertexShader: `
    varying vec3 vNormal;
    void main() {
      vNormal = normalize(normalMatrix * normal);
      gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
    }
  `,
  fragmentShader: `
    varying vec3 vNormal;
    void main() {
      float intensity = pow(0.64 - dot(vNormal, vec3(0, 0, 1.0)), 2.4);
      // Soft diffuse ivory-taupe atmospheric veil
      vec3 atmosphericColor = mix(vec3(0.88, 0.82, 0.74), vec3(0.96, 0.93, 0.88), intensity * 0.55);
      gl_FragColor = vec4(atmosphericColor, intensity * 0.72);
    }
  `,
  blending: THREE.AdditiveBlending,
  side: THREE.BackSide,
  transparent: true
});
const haloMesh = new THREE.Mesh(haloGeo, haloMat);
earthGroup.add(haloMesh);

// Synoptic Mysuru Anchor Pin (12.2958° N, 76.6394° E)
function calculatePinPos(lat, lon, rOffset = 0.12) {
  const phi = (90 - lat) * (Math.PI / 180);
  const theta = (lon + 180) * (Math.PI / 180);
  const pinR = globeRadius + rOffset;
  return new THREE.Vector3(
    -pinR * Math.sin(phi) * Math.cos(theta),
    pinR * Math.cos(phi),
    pinR * Math.sin(phi) * Math.sin(theta)
  );
}

const pinsGroup = new THREE.Group();
earthGroup.add(pinsGroup);

const posMysuru = calculatePinPos(12.2958, 76.6394);
const pGroup = new THREE.Group();
pGroup.position.copy(posMysuru);

// Core beacon point
const cGeo = new THREE.SphereGeometry(0.12, 16, 16);
const cMat = new THREE.MeshBasicMaterial({ color: 0xc25e1a });
const cMesh = new THREE.Mesh(cGeo, cMat);
pGroup.add(cMesh);

// Inner pulsing amber ring
const rGeo = new THREE.RingGeometry(0.18, 0.30, 32);
const rMat = new THREE.MeshBasicMaterial({ color: 0xd97706, side: THREE.DoubleSide, transparent: true, opacity: 0.80 });
const rMesh = new THREE.Mesh(rGeo, rMat);
rMesh.lookAt(posMysuru.clone().normalize());
pGroup.add(rMesh);

// Outer diffuse cloud boundary ring
const dGeo = new THREE.RingGeometry(0.55, 0.75, 48);
const dMat = new THREE.MeshBasicMaterial({ color: 0x8c877d, side: THREE.DoubleSide, transparent: true, opacity: 0.40 });
const dMesh = new THREE.Mesh(dGeo, dMat);
dMesh.lookAt(posMysuru.clone().normalize());
pGroup.add(dMesh);

pinsGroup.add(pGroup);

// Initial Camera Orientation centered over South Asia
earthGroup.rotation.y = -1.80;
earthGroup.rotation.x = 0.20;

// Interactive Drag Rotation
let isDragging = false;
let prevMouse = { x: 0, y: 0 };
let targetRotY = earthGroup.rotation.y;
let targetRotX = earthGroup.rotation.x;

function onPointerDown(e) {
  isDragging = true;
  prevMouse = { x: e.clientX || (e.touches && e.touches[0].clientX), y: e.clientY || (e.touches && e.touches[0].clientY) };
}

function onPointerMove(e) {
  if (!isDragging) return;
  const x = e.clientX || (e.touches && e.touches[0].clientX);
  const y = e.clientY || (e.touches && e.touches[0].clientY);
  const dx = x - prevMouse.x;
  const dy = y - prevMouse.y;
  targetRotY += dx * 0.005;
  targetRotX += dy * 0.005;
  targetRotX = Math.max(-0.85, Math.min(0.85, targetRotX));
  prevMouse = { x, y };
}

function onPointerUp() { isDragging = false; }

window.addEventListener('mousedown', onPointerDown);
window.addEventListener('mousemove', onPointerMove);
window.addEventListener('mouseup', onPointerUp);
window.addEventListener('touchstart', onPointerDown, { passive: true });
window.addEventListener('touchmove', onPointerMove, { passive: true });
window.addEventListener('touchend', onPointerUp);

// Public API hooks for Cloudy State runtime control
window.samvayaSetCloudRegime = function(regime, coverPct) {
  currentCloudRegime = regime;
  currentCoverPercent = coverPct || (regime === 'light' ? 32 : regime === 'moderate' ? 67 : 85);
  drawCloudyEarth(currentCloudRegime);
  earthTexture.needsUpdate = true;

  if (regime === 'light') {
    cloudMat.opacity = 0.38;
    highCloudMat.opacity = 0.25;
    sunLight.intensity = 2.7;
    ambientLight.color.setHex(0xfbf6ee);
  } else if (regime === 'moderate') {
    cloudMat.opacity = 0.58;
    highCloudMat.opacity = 0.42;
    sunLight.intensity = 2.3;
    ambientLight.color.setHex(0xf4efe6);
  } else if (regime === 'overcast') {
    cloudMat.opacity = 0.82;
    highCloudMat.opacity = 0.65;
    sunLight.intensity = 1.7;
    ambientLight.color.setHex(0xe8e2d8);
  } else if (regime === 'rain_transition') {
    cloudMat.opacity = 0.90;
    highCloudMat.opacity = 0.75;
    sunLight.intensity = 1.4;
    ambientLight.color.setHex(0xdcd5ca);
  }
};

window.samvayaSetCloudIntensity = function(lvl) {
  if (lvl === 'minimal') {
    cloudMat.opacity *= 0.6;
    highCloudMat.opacity = 0.15;
    haloMesh.visible = false;
  } else if (lvl === 'balanced') {
    haloMesh.visible = true;
  } else {
    cloudMat.opacity = Math.min(0.95, cloudMat.opacity * 1.25);
    highCloudMat.opacity = Math.min(0.85, highCloudMat.opacity * 1.3);
    haloMesh.visible = true;
  }
};

function handleResize() {
  const w = container.clientWidth || window.innerWidth;
  const h = container.clientHeight || window.innerHeight;
  camera.aspect = w / h;
  camera.updateProjectionMatrix();
  renderer.setSize(w, h);
}
window.addEventListener('resize', handleResize);

let clock = new THREE.Clock();
function animate() {
  requestAnimationFrame(animate);
  const t = clock.getElapsedTime();

  earthGroup.rotation.y += (targetRotY - earthGroup.rotation.y) * 0.08;
  earthGroup.rotation.x += (targetRotX - earthGroup.rotation.x) * 0.08;

  // Slow horizontal kinematic cloud drift
  cloudMesh.rotation.y += 0.0006;
  highCloudMesh.rotation.y += 0.00035;

  // Gentle pulse on the Mysuru anchor
  const s = 1.0 + Math.sin(t * 2.2) * 0.16;
  rMesh.scale.set(s, s, s);
  const dS = 1.0 + Math.sin(t * 1.4) * 0.09;
  dMesh.scale.set(dS, dS, dS);

  renderer.render(scene, camera);
}
animate();

})();
</script>
</div>
<!-- STITCH_THREEJS_END:ANIMATION_66 -->
</body>
</html>
