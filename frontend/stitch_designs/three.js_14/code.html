<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width,initial-scale=1.0" name="viewport"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
    }
  </style>
</head>
<body>
<!-- STITCH_THREEJS_START:ANIMATION_42 class="fixed inset-0 w-full h-full bg-transparent" -->
<div class="fixed inset-0 w-full h-full bg-transparent" style="display:block;">
<script src="https://ajax.googleapis.com/ajax/libs/threejs/r125/three.min.js"></script>
<div id="threejs-container-ANIMATION_42" style="width:100%;height:100%"></div>
<script>
(function() {
  const container = document.getElementById('threejs-container-ANIMATION_42');
  const devicePixelRatio = window.devicePixelRatio || 1;
  // SAMVAYA Data & Model Transparency Center — 3D Earth Data & Model Ingestion Observatory
// Features: Interactive Cesium/Three.js 3D Earth globe with model-source perspective switching:
// 1) SAMVAYA Consensus (Fused Adaptive Output)
// 2) AIFS Neural NWP Field (ECMWF Deep Graph Model)
// 3) ECMWF IFS Physics Field (9km Deterministic)
// 4) NOAA GFS Global NWP Field (13km Deterministic)
// 5) GEFS Perturbation Ensemble Spread (31-member Envelope)
// 6) Ground Truth AWS In-Situ & Reanalysis Verification Layer
// Includes coordinate grid, Rayleigh scattering halo, Mysuru observation beacon, and public window API for pipeline highlighting.

const container = document.getElementById('threejs-container-ANIMATION_DATA') || document.querySelector('threejs-scene') || document.body;
const width = container.clientWidth || window.innerWidth;
const height = container.clientHeight || window.innerHeight;

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(38, width / height, 0.1, 1000);
camera.position.set(-0.85, 0.95, 11.2);

const renderer = new THREE.WebGLRenderer({ alpha: true, antialias: true, powerPreference: "high-performance" });
renderer.setSize(width, height);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
container.appendChild(renderer.domElement);

// Warm atmospheric scientific illumination
const ambientLight = new THREE.AmbientLight(0xfff8f0, 1.65);
scene.add(ambientLight);

const sunLight = new THREE.DirectionalLight(0xffeedb, 2.8);
sunLight.position.set(16, 14, 15);
scene.add(sunLight);

const warmFill = new THREE.DirectionalLight(0xdf7a28, 1.1);
warmFill.position.set(-14, -6, -8);
scene.add(warmFill);

// Main Planetary Group
const earthGroup = new THREE.Group();
earthGroup.position.set(-0.55, -0.1, 0); // Positioned for balanced HUD layout
scene.add(earthGroup);

// Canvas procedural texture for Earth & Model Data Layers
const canvas = document.createElement('canvas');
canvas.width = 2048;
canvas.height = 1024;
const ctx = canvas.getContext('2d');

function toCanvasX(lon) { return ((lon + 180) / 360) * 2048; }
function toCanvasY(lat) { return ((90 - lat) / 180) * 1024; }

let currentSourceMode = 'samvaya'; // 'samvaya', 'aifs', 'ecmwf', 'gfs', 'gefs', 'reference'
let currentStageHighlight = 'consensus'; // 'sources', 'adapter', 'alignment', 'features', 'gating', 'consensus', 'verification'
let currentDemoState = 'all_available'; // 'all_available', 'partial_source', 'high_agreement', 'high_disagreement', 'reduced_quality'

function drawDataObservatoryEarth(source, stage, state) {
  // Deep oceanic slate/navy
  ctx.fillStyle = '#0f1722';
  ctx.fillRect(0, 0, 2048, 1024);

  const oceanGrad = ctx.createLinearGradient(0, 0, 0, 1024);
  oceanGrad.addColorStop(0, '#0a1018');
  oceanGrad.addColorStop(0.5, '#162232');
  oceanGrad.addColorStop(1, '#0a1018');
  ctx.fillStyle = oceanGrad;
  ctx.fillRect(0, 0, 2048, 1024);

  // Continental landmasses
  ctx.fillStyle = '#392c20';

  // Indian Subcontinent & South Asia
  ctx.beginPath();
  ctx.moveTo(toCanvasX(68), toCanvasY(24));
  ctx.lineTo(toCanvasX(73), toCanvasY(35));
  ctx.lineTo(toCanvasX(80), toCanvasY(33));
  ctx.lineTo(toCanvasX(92), toCanvasY(27));
  ctx.lineTo(toCanvasX(91), toCanvasY(20));
  ctx.lineTo(toCanvasX(82), toCanvasY(13));
  ctx.lineTo(toCanvasX(77.5), toCanvasY(8));
  ctx.lineTo(toCanvasX(72.5), toCanvasY(16));
  ctx.lineTo(toCanvasX(68), toCanvasY(24));
  ctx.closePath();
  ctx.fill();

  // Highlight India (Terracotta tone)
  ctx.fillStyle = '#7a3e1d';
  ctx.beginPath();
  ctx.moveTo(toCanvasX(70), toCanvasY(23));
  ctx.lineTo(toCanvasX(74), toCanvasY(32));
  ctx.lineTo(toCanvasX(86), toCanvasY(27));
  ctx.lineTo(toCanvasX(80), toCanvasY(14));
  ctx.lineTo(toCanvasX(77.5), toCanvasY(9));
  ctx.lineTo(toCanvasX(74), toCanvasY(17));
  ctx.closePath();
  ctx.fill();

  // Sri Lanka
  ctx.beginPath();
  ctx.arc(toCanvasX(80.5), toCanvasY(7.5), 10, 0, Math.PI * 2);
  ctx.fill();

  // Arabian Peninsula
  ctx.fillStyle = '#4c3725';
  ctx.beginPath();
  ctx.moveTo(toCanvasX(35), toCanvasY(32));
  ctx.lineTo(toCanvasX(55), toCanvasY(31));
  ctx.lineTo(toCanvasX(60), toCanvasY(24));
  ctx.lineTo(toCanvasX(54), toCanvasY(15));
  ctx.lineTo(toCanvasX(44), toCanvasY(12));
  ctx.lineTo(toCanvasX(42), toCanvasY(25));
  ctx.closePath();
  ctx.fill();

  // Africa
  ctx.beginPath();
  ctx.moveTo(toCanvasX(12), toCanvasY(36));
  ctx.lineTo(toCanvasX(32), toCanvasY(32));
  ctx.lineTo(toCanvasX(51), toCanvasY(12));
  ctx.lineTo(toCanvasX(42), toCanvasY(-10));
  ctx.lineTo(toCanvasX(30), toCanvasY(-34));
  ctx.lineTo(toCanvasX(17), toCanvasY(-34));
  ctx.lineTo(toCanvasX(8), toCanvasY(4));
  ctx.lineTo(toCanvasX(-16), toCanvasY(12));
  ctx.lineTo(toCanvasX(0), toCanvasY(35));
  ctx.closePath();
  ctx.fill();

  // Eurasia
  ctx.beginPath();
  ctx.moveTo(toCanvasX(60), toCanvasY(35));
  ctx.lineTo(toCanvasX(125), toCanvasY(42));
  ctx.lineTo(toCanvasX(145), toCanvasY(65));
  ctx.lineTo(toCanvasX(55), toCanvasY(68));
  ctx.closePath();
  ctx.fill();

  // Southeast Asia & Australia
  ctx.beginPath();
  ctx.moveTo(toCanvasX(96), toCanvasY(20));
  ctx.lineTo(toCanvasX(108), toCanvasY(11));
  ctx.lineTo(toCanvasX(102), toCanvasY(1));
  ctx.lineTo(toCanvasX(98), toCanvasY(10));
  ctx.closePath();
  ctx.fill();

  ctx.beginPath();
  ctx.ellipse(toCanvasX(134), toCanvasY(-25), 110, 76, 0, 0, Math.PI * 2);
  ctx.fill();

  const fX = toCanvasX(76.6394);
  const fY = toCanvasY(12.2958);

  // Model-Specific Ingestion & Consensus Atmospheric Footprints
  if (source === 'samvaya') {
    // Weighted consensus fusion field
    const samGrad = ctx.createRadialGradient(fX, fY, 15, fX, fY, 210);
    samGrad.addColorStop(0, 'rgba(194, 94, 26, 0.72)');   // Terracotta consensus core (29.2°C)
    samGrad.addColorStop(0.5, 'rgba(217, 119, 6, 0.32)'); // Amber blend envelope
    samGrad.addColorStop(1, 'rgba(194, 94, 26, 0)');
    ctx.fillStyle = samGrad;
    ctx.beginPath();
    ctx.arc(fX, fY, 210, 0, Math.PI * 2);
    ctx.fill();

    // Verification convergence ring
    ctx.strokeStyle = 'rgba(245, 158, 11, 0.85)';
    ctx.lineWidth = 2.4;
    ctx.beginPath();
    ctx.arc(fX, fY, 80, 0, Math.PI * 2);
    ctx.stroke();
  } else if (source === 'aifs') {
    // Neural NWP Graph Model field (ECMWF AIFS: 29.4°C, 41% weight)
    const aifsGrad = ctx.createRadialGradient(fX, fY, 15, fX, fY, 195);
    aifsGrad.addColorStop(0, 'rgba(14, 165, 233, 0.75)');  // Neural azure core
    aifsGrad.addColorStop(0.5, 'rgba(56, 189, 248, 0.35)');
    aifsGrad.addColorStop(1, 'rgba(14, 165, 233, 0)');
    ctx.fillStyle = aifsGrad;
    ctx.beginPath();
    ctx.arc(fX, fY, 195, 0, Math.PI * 2);
    ctx.fill();

    // Neural latent graph mesh rings
    ctx.strokeStyle = 'rgba(56, 189, 248, 0.55)';
    ctx.lineWidth = 1.6;
    ctx.setLineDash([4, 4]);
    ctx.beginPath();
    ctx.arc(fX, fY, 110, 0, Math.PI * 2);
    ctx.arc(fX, fY, 160, 0, Math.PI * 2);
    ctx.stroke();
    ctx.setLineDash([]);
  } else if (source === 'ecmwf') {
    // Deterministic Physical NWP (9km IFS: 28.7°C, 32% weight)
    const ecmwfGrad = ctx.createRadialGradient(fX, fY, 15, fX, fY, 185);
    ecmwfGrad.addColorStop(0, 'rgba(217, 119, 6, 0.72)');   // Pure physics amber
    ecmwfGrad.addColorStop(0.5, 'rgba(245, 158, 11, 0.3)');
    ecmwfGrad.addColorStop(1, 'rgba(217, 119, 6, 0)');
    ctx.fillStyle = ecmwfGrad;
    ctx.beginPath();
    ctx.arc(fX, fY, 185, 0, Math.PI * 2);
    ctx.fill();

    // High-resolution numerical grid
    ctx.strokeStyle = 'rgba(245, 158, 11, 0.6)';
    ctx.lineWidth = 1.4;
    for (let g = -2; g <= 2; g++) {
      ctx.beginPath();
      ctx.moveTo(fX - 100, fY + g * 25);
      ctx.lineTo(fX + 100, fY + g * 25);
      ctx.moveTo(fX + g * 25, fY - 100);
      ctx.lineTo(fX + g * 25, fY + 100);
      ctx.stroke();
    }
  } else if (source === 'gfs') {
    // NOAA GFS Deterministic Global (13km: 30.2°C, 18% weight)
    const gfsGrad = ctx.createRadialGradient(fX, fY, 15, fX, fY, 230);
    gfsGrad.addColorStop(0, 'rgba(239, 68, 68, 0.68)');   // Warm thermal bias indicator
    gfsGrad.addColorStop(0.5, 'rgba(249, 115, 22, 0.28)');
    gfsGrad.addColorStop(1, 'rgba(239, 68, 68, 0)');
    ctx.fillStyle = gfsGrad;
    ctx.beginPath();
    ctx.arc(fX, fY, 230, 0, Math.PI * 2);
    ctx.fill();
  } else if (source === 'gefs') {
    // GEFS Ensemble Spread (31 members: 29.1°C, 9% weight)
    const gefsGrad = ctx.createRadialGradient(fX, fY, 15, fX, fY, 250);
    gefsGrad.addColorStop(0, 'rgba(168, 85, 247, 0.65)');  // Ensemble perturbation purple
    gefsGrad.addColorStop(0.5, 'rgba(192, 132, 252, 0.25)');
    gefsGrad.addColorStop(1, 'rgba(168, 85, 247, 0)');
    ctx.fillStyle = gefsGrad;
    ctx.beginPath();
    ctx.arc(fX, fY, 250, 0, Math.PI * 2);
    ctx.fill();

    // Multi-member member rays
    ctx.strokeStyle = 'rgba(192, 132, 252, 0.4)';
    ctx.lineWidth = 1.2;
    for (let a = 0; a < 12; a++) {
      const ang = (a / 12) * Math.PI * 2;
      ctx.beginPath();
      ctx.moveTo(fX + Math.cos(ang) * 35, fY + Math.sin(ang) * 35);
      ctx.lineTo(fX + Math.cos(ang) * 220, fY + Math.sin(ang) * 220);
      ctx.stroke();
    }
  } else {
    // Reference / AWS Observation & ERA5 Ground Truth
    const refGrad = ctx.createRadialGradient(fX, fY, 15, fX, fY, 170);
    refGrad.addColorStop(0, 'rgba(34, 197, 94, 0.85)');    // Verified ground synop
    refGrad.addColorStop(0.4, 'rgba(101, 163, 13, 0.4)');
    refGrad.addColorStop(1, 'rgba(34, 197, 94, 0)');
    ctx.fillStyle = refGrad;
    ctx.beginPath();
    ctx.arc(fX, fY, 170, 0, Math.PI * 2);
    ctx.fill();
  }

  // Model-Agnostic Common Analysis Grid (Quad-Mesh 0.05°)
  ctx.strokeStyle = 'rgba(255, 255, 255, 0.08)';
  ctx.lineWidth = 1.1;
  for (let lat = -80; lat <= 80; lat += 20) {
    ctx.beginPath();
    ctx.moveTo(0, toCanvasY(lat));
    ctx.lineTo(2048, toCanvasY(lat));
    ctx.stroke();
  }
  for (let lon = -180; lon <= 180; lon += 30) {
    ctx.beginPath();
    ctx.moveTo(toCanvasX(lon), 0);
    ctx.lineTo(toCanvasX(lon), 1024);
    ctx.stroke();
  }
}

drawDataObservatoryEarth(currentSourceMode, currentStageHighlight, currentDemoState);
const earthTexture = new THREE.CanvasTexture(canvas);
earthTexture.wrapS = THREE.RepeatWrapping;

// Globe Sphere Mesh
const globeRadius = 4.65;
const globeGeometry = new THREE.SphereGeometry(globeRadius, 64, 64);
const globeMaterial = new THREE.MeshPhongMaterial({
  map: earthTexture,
  bumpScale: 0.06,
  specular: new THREE.Color(0x384556),
  shininess: 16,
  emissive: new THREE.Color(0x161009),
  emissiveIntensity: 0.18
});
const globeMesh = new THREE.Mesh(globeGeometry, globeMaterial);
earthGroup.add(globeMesh);

// Cloud Layer
const cloudCanvas = document.createElement('canvas');
cloudCanvas.width = 1024;
cloudCanvas.height = 512;
const cCtx = cloudCanvas.getContext('2d');
cCtx.fillStyle = 'rgba(0,0,0,0)';
cCtx.fillRect(0, 0, 1024, 512);
cCtx.fillStyle = 'rgba(255, 250, 242, 0.44)';
for (let i = 0; i < 38; i++) {
  const cx = Math.random() * 1024;
  const cy = 80 + Math.random() * 340;
  const rx = 35 + Math.random() * 100;
  const ry = 8 + Math.random() * 24;
  cCtx.beginPath();
  cCtx.ellipse(cx, cy, rx, ry, (Math.random() - 0.5) * 0.4, 0, Math.PI * 2);
  cCtx.fill();
}
const cloudTexture = new THREE.CanvasTexture(cloudCanvas);
const cloudGeo = new THREE.SphereGeometry(globeRadius + 0.08, 64, 64);
const cloudMat = new THREE.MeshLambertMaterial({
  map: cloudTexture,
  transparent: true,
  opacity: 0.52,
  blending: THREE.NormalBlending
});
const cloudMesh = new THREE.Mesh(cloudGeo, cloudMat);
earthGroup.add(cloudMesh);

// Atmospheric Rayleigh Scattering Halo
const haloGeo = new THREE.SphereGeometry(globeRadius + 0.44, 48, 48);
const haloMat = new THREE.ShaderMaterial({
  vertexShader: `
    varying vec3 vNormal;
    void main() {
      vNormal = normalize(normalMatrix * normal);
      gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
    }
  `,
  fragmentShader: `
    varying vec3 vNormal;
    void main() {
      float intensity = pow(0.66 - dot(vNormal, vec3(0, 0, 1.0)), 2.6);
      vec3 atmosphericColor = mix(vec3(0.88, 0.48, 0.16), vec3(0.98, 0.89, 0.78), intensity * 0.65);
      gl_FragColor = vec4(atmosphericColor, intensity * 0.76);
    }
  `,
  blending: THREE.AdditiveBlending,
  side: THREE.BackSide,
  transparent: true
});
const haloMesh = new THREE.Mesh(haloGeo, haloMat);
earthGroup.add(haloMesh);

// Ingestion Target Focal Marker: Mysuru Station (12.2958° N, 76.6394° E)
function calculatePinPos(lat, lon, rOffset = 0.12) {
  const phi = (90 - lat) * (Math.PI / 180);
  const theta = (lon + 180) * (Math.PI / 180);
  const pinR = globeRadius + rOffset;
  return new THREE.Vector3(
    -pinR * Math.sin(phi) * Math.cos(theta),
    pinR * Math.cos(phi),
    pinR * Math.sin(phi) * Math.sin(theta)
  );
}

const pinsGroup = new THREE.Group();
earthGroup.add(pinsGroup);

const posMysuru = calculatePinPos(12.2958, 76.6394);
const pGroup = new THREE.Group();
pGroup.position.copy(posMysuru);

// Core Beacon
const cGeo = new THREE.SphereGeometry(0.13, 16, 16);
const cMat = new THREE.MeshBasicMaterial({ color: 0xc25e1a });
const cMesh = new THREE.Mesh(cGeo, cMat);
pGroup.add(cMesh);

// Inner Pulse Ring
const rGeo = new THREE.RingGeometry(0.18, 0.32, 32);
const rMat = new THREE.MeshBasicMaterial({ color: 0xd97706, side: THREE.DoubleSide, transparent: true, opacity: 0.85 });
const rMesh = new THREE.Mesh(rGeo, rMat);
rMesh.lookAt(posMysuru.clone().normalize());
pGroup.add(rMesh);

// Data Spatial Common Analysis Footprint Ring
const dGeo = new THREE.RingGeometry(0.55, 0.82, 48);
const dMat = new THREE.MeshBasicMaterial({ color: 0xc25e1a, side: THREE.DoubleSide, transparent: true, opacity: 0.52 });
const dMesh = new THREE.Mesh(dGeo, dMat);
dMesh.lookAt(posMysuru.clone().normalize());
pGroup.add(dMesh);

pinsGroup.add(pGroup);

// Initial Camera Orientation centered over South India
earthGroup.rotation.y = -1.80;
earthGroup.rotation.x = 0.20;

// Interactive Drag Rotation
let isDragging = false;
let prevMouse = { x: 0, y: 0 };
let targetRotY = earthGroup.rotation.y;
let targetRotX = earthGroup.rotation.x;

function onPointerDown(e) {
  isDragging = true;
  prevMouse = { x: e.clientX || (e.touches && e.touches[0].clientX), y: e.clientY || (e.touches && e.touches[0].clientY) };
}

function onPointerMove(e) {
  if (!isDragging) return;
  const x = e.clientX || (e.touches && e.touches[0].clientX);
  const y = e.clientY || (e.touches && e.touches[0].clientY);
  const dx = x - prevMouse.x;
  const dy = y - prevMouse.y;
  targetRotY += dx * 0.005;
  targetRotX += dy * 0.005;
  targetRotX = Math.max(-0.85, Math.min(0.85, targetRotX));
  prevMouse = { x, y };
}

function onPointerUp() { isDragging = false; }

window.addEventListener('mousedown', onPointerDown);
window.addEventListener('mousemove', onPointerMove);
window.addEventListener('mouseup', onPointerUp);
window.addEventListener('touchstart', onPointerDown, { passive: true });
window.addEventListener('touchmove', onPointerMove, { passive: true });
window.addEventListener('touchend', onPointerUp);

// Public API hooks for Data & Model Transparency DOM communication
window.samvayaDataSetSource = function(sourceName) {
  currentSourceMode = sourceName;
  drawDataObservatoryEarth(currentSourceMode, currentStageHighlight, currentDemoState);
  earthTexture.needsUpdate = true;
};

window.samvayaDataSetStage = function(stageName) {
  currentStageHighlight = stageName;
  drawDataObservatoryEarth(currentSourceMode, currentStageHighlight, currentDemoState);
  earthTexture.needsUpdate = true;
};

window.samvayaDataSetState = function(stateName) {
  currentDemoState = stateName;
  drawDataObservatoryEarth(currentSourceMode, currentStageHighlight, currentDemoState);
  earthTexture.needsUpdate = true;
};

window.samvayaDataZoom = function(delta) {
  camera.position.z = Math.max(7.2, Math.min(16, camera.position.z + delta));
};

function handleResize() {
  const w = container.clientWidth || window.innerWidth;
  const h = container.clientHeight || window.innerHeight;
  camera.aspect = w / h;
  camera.updateProjectionMatrix();
  renderer.setSize(w, h);
}
window.addEventListener('resize', handleResize);

let clock = new THREE.Clock();
function animate() {
  requestAnimationFrame(animate);
  const t = clock.getElapsedTime();

  earthGroup.rotation.y += (targetRotY - earthGroup.rotation.y) * 0.08;
  earthGroup.rotation.x += (targetRotX - earthGroup.rotation.x) * 0.08;

  cloudMesh.rotation.y += 0.0008;

  // Pulse active beacon & common grid ring
  const s = 1.0 + Math.sin(t * 3.2) * 0.28;
  rMesh.scale.set(s, s, s);
  const dS = 1.0 + Math.sin(t * 1.8) * 0.14;
  dMesh.scale.set(dS, dS, dS);

  renderer.render(scene, camera);
}
animate();


})();
</script>
</div>
<!-- STITCH_THREEJS_END:ANIMATION_42 -->
</body>
</html>
