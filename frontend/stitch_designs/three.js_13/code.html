<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width,initial-scale=1.0" name="viewport"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
    }
  </style>
</head>
<body>
<!-- STITCH_THREEJS_START:ANIMATION_39 class="fixed inset-0 w-full h-full bg-transparent" -->
<div class="fixed inset-0 w-full h-full bg-transparent" style="display:block;">
<script src="https://ajax.googleapis.com/ajax/libs/threejs/r125/three.min.js"></script>
<div id="threejs-container-ANIMATION_39" style="width:100%;height:100%"></div>
<script>
(function() {
  const container = document.getElementById('threejs-container-ANIMATION_39');
  const devicePixelRatio = window.devicePixelRatio || 1;
  // SAMVAYA Forecast Scenario Lab — 3D Earth Planetary Scenario & Uncertainty Exploration Engine
// Features: Interactive Cesium/Three.js 3D Earth globe with scenario modes:
// 1) BASELINE (Operational SAMVAYA Consensus), 2) MODEL RANGE (multi-model dispersion envelope),
// 3) HIGH UNCERTAINTY (expanded divergence field), 4) ALTERNATIVE MODEL (AIFS, ECMWF, GFS, GEFS),
// 5) FORECAST RUN (issuance comparison), 6) EXTREME EVENT (elevated convective/heat plume).
// Includes lat/lon grid, Rayleigh scattering halo, Mysuru focal pin with uncertainty rings, and public window API.

const container = document.getElementById('threejs-container-ANIMATION_SCENARIO') || document.querySelector('threejs-scene') || document.body;
const width = container.clientWidth || window.innerWidth;
const height = container.clientHeight || window.innerHeight;

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(38, width / height, 0.1, 1000);
camera.position.set(-0.85, 0.95, 11.2);

const renderer = new THREE.WebGLRenderer({ alpha: true, antialias: true, powerPreference: "high-performance" });
renderer.setSize(width, height);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
container.appendChild(renderer.domElement);

// Warm atmospheric scientific illumination
const ambientLight = new THREE.AmbientLight(0xfff8f0, 1.65);
scene.add(ambientLight);

const sunLight = new THREE.DirectionalLight(0xffeedb, 2.8);
sunLight.position.set(16, 14, 15);
scene.add(sunLight);

const warmFill = new THREE.DirectionalLight(0xdf7a28, 1.1);
warmFill.position.set(-14, -6, -8);
scene.add(warmFill);

// Main Planetary Group
const earthGroup = new THREE.Group();
earthGroup.position.set(-0.55, -0.1, 0); // Positioned for balanced HUD layout
scene.add(earthGroup);

// Canvas procedural texture for Earth & Scenario Layers
const canvas = document.createElement('canvas');
canvas.width = 2048;
canvas.height = 1024;
const ctx = canvas.getContext('2d');

function toCanvasX(lon) { return ((lon + 180) / 360) * 2048; }
function toCanvasY(lat) { return ((90 - lat) / 180) * 1024; }

let currentScenarioMode = 'baseline'; // 'baseline', 'model_range', 'uncertainty', 'alternative_model', 'forecast_run', 'extreme_event'
let currentVariable = 'temperature';   // 'temperature', 'precipitation', 'wind', 'pressure'
let currentHorizonIdx = 2;            // 0: +6h, 1: +12h, 2: +24h (Default), 3: +48h

function drawScenarioEarth(scenario, variable, horizon) {
  // Deep oceanic slate/navy
  ctx.fillStyle = '#0f1722';
  ctx.fillRect(0, 0, 2048, 1024);

  const oceanGrad = ctx.createLinearGradient(0, 0, 0, 1024);
  oceanGrad.addColorStop(0, '#0a1018');
  oceanGrad.addColorStop(0.5, '#162232');
  oceanGrad.addColorStop(1, '#0a1018');
  ctx.fillStyle = oceanGrad;
  ctx.fillRect(0, 0, 2048, 1024);

  // Continental landmasses
  ctx.fillStyle = '#392c20';

  // Indian Subcontinent & South Asia
  ctx.beginPath();
  ctx.moveTo(toCanvasX(68), toCanvasY(24));
  ctx.lineTo(toCanvasX(73), toCanvasY(35));
  ctx.lineTo(toCanvasX(80), toCanvasY(33));
  ctx.lineTo(toCanvasX(92), toCanvasY(27));
  ctx.lineTo(toCanvasX(91), toCanvasY(20));
  ctx.lineTo(toCanvasX(82), toCanvasY(13));
  ctx.lineTo(toCanvasX(77.5), toCanvasY(8));
  ctx.lineTo(toCanvasX(72.5), toCanvasY(16));
  ctx.lineTo(toCanvasX(68), toCanvasY(24));
  ctx.closePath();
  ctx.fill();

  // Highlight India (Terracotta tone)
  ctx.fillStyle = '#7a3e1d';
  ctx.beginPath();
  ctx.moveTo(toCanvasX(70), toCanvasY(23));
  ctx.lineTo(toCanvasX(74), toCanvasY(32));
  ctx.lineTo(toCanvasX(86), toCanvasY(27));
  ctx.lineTo(toCanvasX(80), toCanvasY(14));
  ctx.lineTo(toCanvasX(77.5), toCanvasY(9));
  ctx.lineTo(toCanvasX(74), toCanvasY(17));
  ctx.closePath();
  ctx.fill();

  // Sri Lanka
  ctx.beginPath();
  ctx.arc(toCanvasX(80.5), toCanvasY(7.5), 10, 0, Math.PI * 2);
  ctx.fill();

  // Arabian Peninsula
  ctx.fillStyle = '#4c3725';
  ctx.beginPath();
  ctx.moveTo(toCanvasX(35), toCanvasY(32));
  ctx.lineTo(toCanvasX(55), toCanvasY(31));
  ctx.lineTo(toCanvasX(60), toCanvasY(24));
  ctx.lineTo(toCanvasX(54), toCanvasY(15));
  ctx.lineTo(toCanvasX(44), toCanvasY(12));
  ctx.lineTo(toCanvasX(42), toCanvasY(25));
  ctx.closePath();
  ctx.fill();

  // Africa
  ctx.beginPath();
  ctx.moveTo(toCanvasX(12), toCanvasY(36));
  ctx.lineTo(toCanvasX(32), toCanvasY(32));
  ctx.lineTo(toCanvasX(51), toCanvasY(12));
  ctx.lineTo(toCanvasX(42), toCanvasY(-10));
  ctx.lineTo(toCanvasX(30), toCanvasY(-34));
  ctx.lineTo(toCanvasX(17), toCanvasY(-34));
  ctx.lineTo(toCanvasX(8), toCanvasY(4));
  ctx.lineTo(toCanvasX(-16), toCanvasY(12));
  ctx.lineTo(toCanvasX(0), toCanvasY(35));
  ctx.closePath();
  ctx.fill();

  // Eurasia
  ctx.beginPath();
  ctx.moveTo(toCanvasX(60), toCanvasY(35));
  ctx.lineTo(toCanvasX(125), toCanvasY(42));
  ctx.lineTo(toCanvasX(145), toCanvasY(65));
  ctx.lineTo(toCanvasX(55), toCanvasY(68));
  ctx.closePath();
  ctx.fill();

  // Southeast Asia & Australia
  ctx.beginPath();
  ctx.moveTo(toCanvasX(96), toCanvasY(20));
  ctx.lineTo(toCanvasX(108), toCanvasY(11));
  ctx.lineTo(toCanvasX(102), toCanvasY(1));
  ctx.lineTo(toCanvasX(98), toCanvasY(10));
  ctx.closePath();
  ctx.fill();

  ctx.beginPath();
  ctx.ellipse(toCanvasX(134), toCanvasY(-25), 110, 76, 0, 0, Math.PI * 2);
  ctx.fill();

  const fX = toCanvasX(76.6394);
  const fY = toCanvasY(12.2958);

  // Scenario Atmospheric Overlays
  if (scenario === 'baseline') {
    // Stable SAMVAYA Consensus field
    const baseGrad = ctx.createRadialGradient(fX, fY, 15, fX, fY, 200);
    baseGrad.addColorStop(0, 'rgba(217, 119, 6, 0.65)');   // Terracotta core
    baseGrad.addColorStop(0.5, 'rgba(245, 158, 11, 0.28)'); // Amber transition
    baseGrad.addColorStop(1, 'rgba(217, 119, 6, 0)');
    ctx.fillStyle = baseGrad;
    ctx.beginPath();
    ctx.arc(fX, fY, 200, 0, Math.PI * 2);
    ctx.fill();
  } else if (scenario === 'model_range') {
    // Concentric dispersion envelope (Low: 28.1°C, Central: 29.2°C, High: 30.4°C)
    // Central consensus ring
    ctx.strokeStyle = 'rgba(217, 119, 6, 0.85)';
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.arc(fX, fY, 95, 0, Math.PI * 2);
    ctx.stroke();

    // Upper/Lower bounds envelope
    ctx.strokeStyle = 'rgba(245, 158, 11, 0.5)';
    ctx.lineWidth = 2;
    ctx.setLineDash([6, 6]);
    ctx.beginPath();
    ctx.arc(fX, fY, 160, 0, Math.PI * 2);
    ctx.arc(fX, fY, 240, 0, Math.PI * 2);
    ctx.stroke();
    ctx.setLineDash([]);
  } else if (scenario === 'uncertainty') {
    // Wide stippled / textured uncertainty plume
    const uncertGrad = ctx.createRadialGradient(fX, fY, 20, fX, fY, 280);
    uncertGrad.addColorStop(0, 'rgba(234, 179, 8, 0.75)');
    uncertGrad.addColorStop(0.4, 'rgba(239, 68, 68, 0.45)');
    uncertGrad.addColorStop(1, 'rgba(234, 179, 8, 0)');
    ctx.fillStyle = uncertGrad;
    ctx.beginPath();
    ctx.arc(fX, fY, 280, 0, Math.PI * 2);
    ctx.fill();

    // Divergence rays
    ctx.strokeStyle = 'rgba(255, 255, 255, 0.25)';
    ctx.lineWidth = 1.5;
    for (let a = 0; a < 8; a++) {
      const ang = (a / 8) * Math.PI * 2;
      ctx.beginPath();
      ctx.moveTo(fX + Math.cos(ang) * 40, fY + Math.sin(ang) * 40);
      ctx.lineTo(fX + Math.cos(ang) * 260, fY + Math.sin(ang) * 260);
      ctx.stroke();
    }
  } else if (scenario === 'extreme_event') {
    // Intense convective moisture peril footprint
    const extGrad = ctx.createRadialGradient(fX, fY, 15, fX, fY, 250);
    extGrad.addColorStop(0, 'rgba(225, 29, 72, 0.85)');   // Deep peril crimson
    extGrad.addColorStop(0.35, 'rgba(217, 119, 6, 0.6)');  // Terracotta convective plume
    extGrad.addColorStop(0.7, 'rgba(14, 165, 233, 0.35)'); // Rain inflow
    extGrad.addColorStop(1, 'rgba(225, 29, 72, 0)');
    ctx.fillStyle = extGrad;
    ctx.beginPath();
    ctx.arc(fX, fY, 250, 0, Math.PI * 2);
    ctx.fill();
  } else if (scenario === 'alternative_model') {
    // Model-specific localized physics bias field (e.g. AIFS neural flow)
    const modGrad = ctx.createRadialGradient(fX, fY, 15, fX, fY, 190);
    modGrad.addColorStop(0, 'rgba(14, 165, 233, 0.7)');
    modGrad.addColorStop(0.6, 'rgba(56, 189, 248, 0.3)');
    modGrad.addColorStop(1, 'rgba(14, 165, 233, 0)');
    ctx.fillStyle = modGrad;
    ctx.beginPath();
    ctx.arc(fX, fY, 190, 0, Math.PI * 2);
    ctx.fill();
  } else {
    // Forecast run comparison / historical issuance
    const runGrad = ctx.createRadialGradient(fX, fY, 15, fX, fY, 180);
    runGrad.addColorStop(0, 'rgba(101, 163, 13, 0.65)');
    runGrad.addColorStop(0.6, 'rgba(34, 197, 94, 0.25)');
    runGrad.addColorStop(1, 'rgba(34, 197, 94, 0)');
    ctx.fillStyle = runGrad;
    ctx.beginPath();
    ctx.arc(fX, fY, 180, 0, Math.PI * 2);
    ctx.fill();
  }

  // Latitude and Longitude coordinate grid
  ctx.strokeStyle = 'rgba(255, 255, 255, 0.07)';
  ctx.lineWidth = 1.1;
  for (let lat = -80; lat <= 80; lat += 20) {
    ctx.beginPath();
    ctx.moveTo(0, toCanvasY(lat));
    ctx.lineTo(2048, toCanvasY(lat));
    ctx.stroke();
  }
  for (let lon = -180; lon <= 180; lon += 30) {
    ctx.beginPath();
    ctx.moveTo(toCanvasX(lon), 0);
    ctx.lineTo(toCanvasX(lon), 1024);
    ctx.stroke();
  }
}

drawScenarioEarth(currentScenarioMode, currentVariable, currentHorizonIdx);
const earthTexture = new THREE.CanvasTexture(canvas);
earthTexture.wrapS = THREE.RepeatWrapping;

// Globe Sphere Mesh
const globeRadius = 4.65;
const globeGeometry = new THREE.SphereGeometry(globeRadius, 64, 64);
const globeMaterial = new THREE.MeshPhongMaterial({
  map: earthTexture,
  bumpScale: 0.06,
  specular: new THREE.Color(0x384556),
  shininess: 16,
  emissive: new THREE.Color(0x161009),
  emissiveIntensity: 0.18
});
const globeMesh = new THREE.Mesh(globeGeometry, globeMaterial);
earthGroup.add(globeMesh);

// Cloud Layer
const cloudCanvas = document.createElement('canvas');
cloudCanvas.width = 1024;
cloudCanvas.height = 512;
const cCtx = cloudCanvas.getContext('2d');
cCtx.fillStyle = 'rgba(0,0,0,0)';
cCtx.fillRect(0, 0, 1024, 512);
cCtx.fillStyle = 'rgba(255, 250, 242, 0.44)';
for (let i = 0; i < 38; i++) {
  const cx = Math.random() * 1024;
  const cy = 80 + Math.random() * 340;
  const rx = 35 + Math.random() * 100;
  const ry = 8 + Math.random() * 24;
  cCtx.beginPath();
  cCtx.ellipse(cx, cy, rx, ry, (Math.random() - 0.5) * 0.4, 0, Math.PI * 2);
  cCtx.fill();
}
const cloudTexture = new THREE.CanvasTexture(cloudCanvas);
const cloudGeo = new THREE.SphereGeometry(globeRadius + 0.08, 64, 64);
const cloudMat = new THREE.MeshLambertMaterial({
  map: cloudTexture,
  transparent: true,
  opacity: 0.52,
  blending: THREE.NormalBlending
});
const cloudMesh = new THREE.Mesh(cloudGeo, cloudMat);
earthGroup.add(cloudMesh);

// Rayleigh Atmospheric Halo
const haloGeo = new THREE.SphereGeometry(globeRadius + 0.44, 48, 48);
const haloMat = new THREE.ShaderMaterial({
  vertexShader: `
    varying vec3 vNormal;
    void main() {
      vNormal = normalize(normalMatrix * normal);
      gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
    }
  `,
  fragmentShader: `
    varying vec3 vNormal;
    void main() {
      float intensity = pow(0.66 - dot(vNormal, vec3(0, 0, 1.0)), 2.6);
      vec3 atmosphericColor = mix(vec3(0.88, 0.48, 0.16), vec3(0.98, 0.89, 0.78), intensity * 0.65);
      gl_FragColor = vec4(atmosphericColor, intensity * 0.76);
    }
  `,
  blending: THREE.AdditiveBlending,
  side: THREE.BackSide,
  transparent: true
});
const haloMesh = new THREE.Mesh(haloGeo, haloMat);
earthGroup.add(haloMesh);

// Scenario Focus Marker: Mysuru Station (12.2958° N, 76.6394° E)
function calculatePinPos(lat, lon, rOffset = 0.12) {
  const phi = (90 - lat) * (Math.PI / 180);
  const theta = (lon + 180) * (Math.PI / 180);
  const pinR = globeRadius + rOffset;
  return new THREE.Vector3(
    -pinR * Math.sin(phi) * Math.cos(theta),
    pinR * Math.cos(phi),
    pinR * Math.sin(phi) * Math.sin(theta)
  );
}

const pinsGroup = new THREE.Group();
earthGroup.add(pinsGroup);

const posMysuru = calculatePinPos(12.2958, 76.6394);
const pGroup = new THREE.Group();
pGroup.position.copy(posMysuru);

// Core Beacon
const cGeo = new THREE.SphereGeometry(0.13, 16, 16);
const cMat = new THREE.MeshBasicMaterial({ color: 0xc25e1a });
const cMesh = new THREE.Mesh(cGeo, cMat);
pGroup.add(cMesh);

// Inner Pulse Ring
const rGeo = new THREE.RingGeometry(0.18, 0.32, 32);
const rMat = new THREE.MeshBasicMaterial({ color: 0xd97706, side: THREE.DoubleSide, transparent: true, opacity: 0.85 });
const rMesh = new THREE.Mesh(rGeo, rMat);
rMesh.lookAt(posMysuru.clone().normalize());
pGroup.add(rMesh);

// Scenario Uncertainty Envelope Ring
const uGeo = new THREE.RingGeometry(0.55, 0.82, 48);
const uMat = new THREE.MeshBasicMaterial({ color: 0xc25e1a, side: THREE.DoubleSide, transparent: true, opacity: 0.52 });
const uMesh = new THREE.Mesh(uGeo, uMat);
uMesh.lookAt(posMysuru.clone().normalize());
pGroup.add(uMesh);

pinsGroup.add(pGroup);

// Initial Camera Orientation centered over South India
earthGroup.rotation.y = -1.80;
earthGroup.rotation.x = 0.20;

// Interactive Drag Rotation
let isDragging = false;
let prevMouse = { x: 0, y: 0 };
let targetRotY = earthGroup.rotation.y;
let targetRotX = earthGroup.rotation.x;

function onPointerDown(e) {
  isDragging = true;
  prevMouse = { x: e.clientX || (e.touches && e.touches[0].clientX), y: e.clientY || (e.touches && e.touches[0].clientY) };
}

function onPointerMove(e) {
  if (!isDragging) return;
  const x = e.clientX || (e.touches && e.touches[0].clientX);
  const y = e.clientY || (e.touches && e.touches[0].clientY);
  const dx = x - prevMouse.x;
  const dy = y - prevMouse.y;
  targetRotY += dx * 0.005;
  targetRotX += dy * 0.005;
  targetRotX = Math.max(-0.85, Math.min(0.85, targetRotX));
  prevMouse = { x, y };
}

function onPointerUp() { isDragging = false; }

window.addEventListener('mousedown', onPointerDown);
window.addEventListener('mousemove', onPointerMove);
window.addEventListener('mouseup', onPointerUp);
window.addEventListener('touchstart', onPointerDown, { passive: true });
window.addEventListener('touchmove', onPointerMove, { passive: true });
window.addEventListener('touchend', onPointerUp);

// Public API hooks for Scenario Lab DOM communication
window.samvayaScenarioSetMode = function(modeName) {
  currentScenarioMode = modeName;
  drawScenarioEarth(currentScenarioMode, currentVariable, currentHorizonIdx);
  earthTexture.needsUpdate = true;
};

window.samvayaScenarioSetVariable = function(varName) {
  currentVariable = varName;
  drawScenarioEarth(currentScenarioMode, currentVariable, currentHorizonIdx);
  earthTexture.needsUpdate = true;
};

window.samvayaScenarioSetHorizon = function(hIdx) {
  currentHorizonIdx = hIdx;
  drawScenarioEarth(currentScenarioMode, currentVariable, currentHorizonIdx);
  earthTexture.needsUpdate = true;
};

window.samvayaScenarioZoom = function(delta) {
  camera.position.z = Math.max(7.2, Math.min(16, camera.position.z + delta));
};

function handleResize() {
  const w = container.clientWidth || window.innerWidth;
  const h = container.clientHeight || window.innerHeight;
  camera.aspect = w / h;
  camera.updateProjectionMatrix();
  renderer.setSize(w, h);
}
window.addEventListener('resize', handleResize);

let clock = new THREE.Clock();
function animate() {
  requestAnimationFrame(animate);
  const t = clock.getElapsedTime();

  earthGroup.rotation.y += (targetRotY - earthGroup.rotation.y) * 0.08;
  earthGroup.rotation.x += (targetRotX - earthGroup.rotation.x) * 0.08;

  cloudMesh.rotation.y += 0.0008;

  // Pulse active scenario beacon
  const s = 1.0 + Math.sin(t * 3.2) * 0.28;
  rMesh.scale.set(s, s, s);
  const dS = 1.0 + Math.sin(t * 1.8) * 0.14;
  uMesh.scale.set(dS, dS, dS);

  renderer.render(scene, camera);
}
animate();

})();
</script>
</div>
<!-- STITCH_THREEJS_END:ANIMATION_39 -->
</body>
</html>
