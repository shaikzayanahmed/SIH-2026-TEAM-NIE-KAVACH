<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width,initial-scale=1.0" name="viewport"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
    }
  </style>
</head>
<body>
<!-- STITCH_THREEJS_START:ANIMATION_33 class="fixed inset-0 w-full h-full bg-transparent" -->
<div class="fixed inset-0 w-full h-full bg-transparent" style="display:block;">
<script src="https://ajax.googleapis.com/ajax/libs/threejs/r125/three.min.js"></script>
<div id="threejs-container-ANIMATION_33" style="width:100%;height:100%"></div>
<script>
(function() {
  const container = document.getElementById('threejs-container-ANIMATION_33');
  const devicePixelRatio = window.devicePixelRatio || 1;
  // SAMVAYA Forecast History & Replay Archive — 3D Earth Temporal Evolution & Replay Engine
// Features: Interactive planetary Earth with temporal atmospheric state morphing,
// lead-time progression (-36h -> -24h -> -12h -> +00h observed reality),
// dynamic spatial precipitation footprint growth, Mysuru focal coordinate lock,
// replay speed synchronization hooks, and public window API for DOM controls.

const container = document.getElementById('threejs-container-ANIMATION_ARCHIVE') || document.querySelector('threejs-scene') || document.body;
const width = container.clientWidth || window.innerWidth;
const height = container.clientHeight || window.innerHeight;

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(38, width / height, 0.1, 1000);
camera.position.set(-0.85, 0.95, 11.2);

const renderer = new THREE.WebGLRenderer({ alpha: true, antialias: true, powerPreference: "high-performance" });
renderer.setSize(width, height);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
container.appendChild(renderer.domElement);

// Warm atmospheric scientific illumination
const ambientLight = new THREE.AmbientLight(0xfff8f0, 1.65);
scene.add(ambientLight);

const sunLight = new THREE.DirectionalLight(0xffeedb, 2.8);
sunLight.position.set(16, 14, 15);
scene.add(sunLight);

const warmFill = new THREE.DirectionalLight(0xdf7a28, 1.1);
warmFill.position.set(-14, -6, -8);
scene.add(warmFill);

// Main Planetary Group
const earthGroup = new THREE.Group();
earthGroup.position.set(-0.55, -0.1, 0);
scene.add(earthGroup);

// Canvas procedural texture for Earth & Atmospheric Replay Layers
const canvas = document.createElement('canvas');
canvas.width = 2048;
canvas.height = 1024;
const ctx = canvas.getContext('2d');

function toCanvasX(lon) { return ((lon + 180) / 360) * 2048; }
function toCanvasY(lat) { return ((90 - lat) / 180) * 1024; }

let currentReplayStep = 3; // 0: -36h (42%), 1: -24h (57%), 2: -12h (64%), 3: -06h (72%), 4: +00h Observed (8.1mm Hit)
let currentArchiveMode = 'forecast'; // 'forecast', 'model_aifs', 'model_ecmwf', 'model_gfs', 'observed'

function drawArchiveEarth(step, mode) {
  // Deep oceanic slate/blue
  ctx.fillStyle = '#0f1722';
  ctx.fillRect(0, 0, 2048, 1024);

  const oceanGrad = ctx.createLinearGradient(0, 0, 0, 1024);
  oceanGrad.addColorStop(0, '#0a1018');
  oceanGrad.addColorStop(0.5, '#162232');
  oceanGrad.addColorStop(1, '#0a1018');
  ctx.fillStyle = oceanGrad;
  ctx.fillRect(0, 0, 2048, 1024);

  // Continental landmasses
  ctx.fillStyle = '#392c20';

  // Indian Subcontinent & South Asia
  ctx.beginPath();
  ctx.moveTo(toCanvasX(68), toCanvasY(24));
  ctx.lineTo(toCanvasX(73), toCanvasY(35));
  ctx.lineTo(toCanvasX(80), toCanvasY(33));
  ctx.lineTo(toCanvasX(92), toCanvasY(27));
  ctx.lineTo(toCanvasX(91), toCanvasY(20));
  ctx.lineTo(toCanvasX(82), toCanvasY(13));
  ctx.lineTo(toCanvasX(77.5), toCanvasY(8));
  ctx.lineTo(toCanvasX(72.5), toCanvasY(16));
  ctx.lineTo(toCanvasX(68), toCanvasY(24));
  ctx.closePath();
  ctx.fill();

  // Highlight India
  ctx.fillStyle = '#7a3e1d';
  ctx.beginPath();
  ctx.moveTo(toCanvasX(70), toCanvasY(23));
  ctx.lineTo(toCanvasX(74), toCanvasY(32));
  ctx.lineTo(toCanvasX(86), toCanvasY(27));
  ctx.lineTo(toCanvasX(80), toCanvasY(14));
  ctx.lineTo(toCanvasX(77.5), toCanvasY(9));
  ctx.lineTo(toCanvasX(74), toCanvasY(17));
  ctx.closePath();
  ctx.fill();

  // Sri Lanka
  ctx.beginPath();
  ctx.arc(toCanvasX(80.5), toCanvasY(7.5), 10, 0, Math.PI * 2);
  ctx.fill();

  // Arabian Peninsula
  ctx.fillStyle = '#4c3725';
  ctx.beginPath();
  ctx.moveTo(toCanvasX(35), toCanvasY(32));
  ctx.lineTo(toCanvasX(55), toCanvasY(31));
  ctx.lineTo(toCanvasX(60), toCanvasY(24));
  ctx.lineTo(toCanvasX(54), toCanvasY(15));
  ctx.lineTo(toCanvasX(44), toCanvasY(12));
  ctx.lineTo(toCanvasX(42), toCanvasY(25));
  ctx.closePath();
  ctx.fill();

  // Africa
  ctx.beginPath();
  ctx.moveTo(toCanvasX(12), toCanvasY(36));
  ctx.lineTo(toCanvasX(32), toCanvasY(32));
  ctx.lineTo(toCanvasX(51), toCanvasY(12));
  ctx.lineTo(toCanvasX(42), toCanvasY(-10));
  ctx.lineTo(toCanvasX(30), toCanvasY(-34));
  ctx.lineTo(toCanvasX(17), toCanvasY(-34));
  ctx.lineTo(toCanvasX(8), toCanvasY(4));
  ctx.lineTo(toCanvasX(-16), toCanvasY(12));
  ctx.lineTo(toCanvasX(0), toCanvasY(35));
  ctx.closePath();
  ctx.fill();

  // Eurasia
  ctx.beginPath();
  ctx.moveTo(toCanvasX(60), toCanvasY(35));
  ctx.lineTo(toCanvasX(125), toCanvasY(42));
  ctx.lineTo(toCanvasX(145), toCanvasY(65));
  ctx.lineTo(toCanvasX(55), toCanvasY(68));
  ctx.closePath();
  ctx.fill();

  // Southeast Asia & Australia
  ctx.beginPath();
  ctx.moveTo(toCanvasX(96), toCanvasY(20));
  ctx.lineTo(toCanvasX(108), toCanvasY(11));
  ctx.lineTo(toCanvasX(102), toCanvasY(1));
  ctx.lineTo(toCanvasX(98), toCanvasY(10));
  ctx.closePath();
  ctx.fill();

  ctx.beginPath();
  ctx.ellipse(toCanvasX(134), toCanvasY(-25), 110, 76, 0, 0, Math.PI * 2);
  ctx.fill();

  // Spatial Replay Layer Evolution over Mysuru (12.2958° N, 76.6394° E)
  const fX = toCanvasX(76.6394);
  const fY = toCanvasY(12.2958);

  // Plume radius grows and solidifies as lead time shortens
  const plumeRadii = [120, 160, 200, 240, 250];
  const r = plumeRadii[Math.min(step, 4)];

  if (step === 4 || mode === 'observed') {
    // Ground Verified Truth footprint (Radar + AWS ground truth lock)
    const obsGrad = ctx.createRadialGradient(fX, fY, 15, fX, fY, r);
    obsGrad.addColorStop(0, 'rgba(34, 197, 94, 0.85)');    // Verified Ground Truth
    obsGrad.addColorStop(0.35, 'rgba(14, 165, 233, 0.65)'); // Heavy convective downpour
    obsGrad.addColorStop(0.7, 'rgba(101, 163, 13, 0.35)');
    obsGrad.addColorStop(1, 'rgba(34, 197, 94, 0)');
    ctx.fillStyle = obsGrad;
    ctx.beginPath();
    ctx.arc(fX, fY, r, 0, Math.PI * 2);
    ctx.fill();
  } else {
    // Historical Forecast Run state
    const intens = 0.45 + step * 0.12;
    const repGrad = ctx.createRadialGradient(fX, fY, 10, fX, fY, r);
    repGrad.addColorStop(0, `rgba(217, 119, 6, ${intens})`);     // Core terracotta probability
    repGrad.addColorStop(0.4, `rgba(14, 165, 233, ${intens * 0.7})`); // Convective cloud plume
    repGrad.addColorStop(1, 'rgba(14, 165, 233, 0)');
    ctx.fillStyle = repGrad;
    ctx.beginPath();
    ctx.arc(fX, fY, r, 0, Math.PI * 2);
    ctx.fill();

    // Projected storm track vector showing forecast trajectory evolution
    ctx.strokeStyle = 'rgba(245, 158, 11, 0.7)';
    ctx.lineWidth = 3.5;
    ctx.setLineDash([8, 6]);
    ctx.beginPath();
    ctx.moveTo(toCanvasX(76.1), toCanvasY(11.8));
    ctx.quadraticCurveTo(toCanvasX(76.6), toCanvasY(12.3), toCanvasX(77.1 + step * 0.08), toCanvasY(12.8 + step * 0.05));
    ctx.stroke();
    ctx.setLineDash([]);
  }

  // Concentric Iso-rings marking 10km, 25km, 50km verification scales
  ctx.strokeStyle = 'rgba(255, 248, 238, 0.22)';
  ctx.lineWidth = 1.4;
  ctx.setLineDash([5, 5]);
  ctx.beginPath();
  ctx.arc(fX, fY, 70, 0, Math.PI * 2);
  ctx.arc(fX, fY, 140, 0, Math.PI * 2);
  ctx.arc(fX, fY, 210, 0, Math.PI * 2);
  ctx.stroke();
  ctx.setLineDash([]);

  // Lat / Lon coordinate grid
  ctx.strokeStyle = 'rgba(255, 255, 255, 0.07)';
  ctx.lineWidth = 1.2;
  for (let lat = -80; lat <= 80; lat += 20) {
    ctx.beginPath();
    ctx.moveTo(0, toCanvasY(lat));
    ctx.lineTo(2048, toCanvasY(lat));
    ctx.stroke();
  }
  for (let lon = -180; lon <= 180; lon += 30) {
    ctx.beginPath();
    ctx.moveTo(toCanvasX(lon), 0);
    ctx.lineTo(toCanvasX(lon), 1024);
    ctx.stroke();
  }
}

drawArchiveEarth(currentReplayStep, currentArchiveMode);
const earthTexture = new THREE.CanvasTexture(canvas);
earthTexture.wrapS = THREE.RepeatWrapping;

// Globe Sphere Mesh
const globeRadius = 4.65;
const globeGeometry = new THREE.SphereGeometry(globeRadius, 64, 64);
const globeMaterial = new THREE.MeshPhongMaterial({
  map: earthTexture,
  bumpScale: 0.06,
  specular: new THREE.Color(0x384556),
  shininess: 16,
  emissive: new THREE.Color(0x161009),
  emissiveIntensity: 0.18
});
const globeMesh = new THREE.Mesh(globeGeometry, globeMaterial);
earthGroup.add(globeMesh);

// Cloud Layer
const cloudCanvas = document.createElement('canvas');
cloudCanvas.width = 1024;
cloudCanvas.height = 512;
const cCtx = cloudCanvas.getContext('2d');
cCtx.fillStyle = 'rgba(0,0,0,0)';
cCtx.fillRect(0, 0, 1024, 512);
cCtx.fillStyle = 'rgba(255, 250, 242, 0.44)';
for (let i = 0; i < 38; i++) {
  const cx = Math.random() * 1024;
  const cy = 80 + Math.random() * 340;
  const rx = 35 + Math.random() * 100;
  const ry = 8 + Math.random() * 24;
  cCtx.beginPath();
  cCtx.ellipse(cx, cy, rx, ry, (Math.random() - 0.5) * 0.4, 0, Math.PI * 2);
  cCtx.fill();
}
const cloudTexture = new THREE.CanvasTexture(cloudCanvas);
const cloudGeo = new THREE.SphereGeometry(globeRadius + 0.08, 64, 64);
const cloudMat = new THREE.MeshLambertMaterial({
  map: cloudTexture,
  transparent: true,
  opacity: 0.52,
  blending: THREE.NormalBlending
});
const cloudMesh = new THREE.Mesh(cloudGeo, cloudMat);
earthGroup.add(cloudMesh);

// Atmospheric Halo (Rayleigh scattering)
const haloGeo = new THREE.SphereGeometry(globeRadius + 0.44, 48, 48);
const haloMat = new THREE.ShaderMaterial({
  vertexShader: `
    varying vec3 vNormal;
    void main() {
      vNormal = normalize(normalMatrix * normal);
      gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
    }
  `,
  fragmentShader: `
    varying vec3 vNormal;
    void main() {
      float intensity = pow(0.66 - dot(vNormal, vec3(0, 0, 1.0)), 2.6);
      vec3 atmosphericColor = mix(vec3(0.88, 0.48, 0.16), vec3(0.98, 0.89, 0.78), intensity * 0.65);
      gl_FragColor = vec4(atmosphericColor, intensity * 0.76);
    }
  `,
  blending: THREE.AdditiveBlending,
  side: THREE.BackSide,
  transparent: true
});
const haloMesh = new THREE.Mesh(haloGeo, haloMat);
earthGroup.add(haloMesh);

// Location Pin: Mysuru Ground In-Situ Station
function calculatePinPos(lat, lon, rOffset = 0.12) {
  const phi = (90 - lat) * (Math.PI / 180);
  const theta = (lon + 180) * (Math.PI / 180);
  const pinR = globeRadius + rOffset;
  return new THREE.Vector3(
    -pinR * Math.sin(phi) * Math.cos(theta),
    pinR * Math.cos(phi),
    pinR * Math.sin(phi) * Math.sin(theta)
  );
}

const pinsGroup = new THREE.Group();
earthGroup.add(pinsGroup);

const posMysuru = calculatePinPos(12.2958, 76.6394);
const pGroup = new THREE.Group();
pGroup.position.copy(posMysuru);

// Core Beacon
const cGeo = new THREE.SphereGeometry(0.13, 16, 16);
const cMat = new THREE.MeshBasicMaterial({ color: 0xc25e1a });
const cMesh = new THREE.Mesh(cGeo, cMat);
pGroup.add(cMesh);

// Outer Pulse Ring
const rGeo = new THREE.RingGeometry(0.18, 0.32, 32);
const rMat = new THREE.MeshBasicMaterial({ color: 0xd97706, side: THREE.DoubleSide, transparent: true, opacity: 0.85 });
const rMesh = new THREE.Mesh(rGeo, rMat);
rMesh.lookAt(posMysuru.clone().normalize());
pGroup.add(rMesh);

// Verification Domain Halo
const dGeo = new THREE.RingGeometry(0.55, 0.78, 48);
const dMat = new THREE.MeshBasicMaterial({ color: 0xc25e1a, side: THREE.DoubleSide, transparent: true, opacity: 0.52 });
const dMesh = new THREE.Mesh(dGeo, dMat);
dMesh.lookAt(posMysuru.clone().normalize());
pGroup.add(dMesh);

pinsGroup.add(pGroup);

// Initial Camera Orientation centered over South India
earthGroup.rotation.y = -1.80;
earthGroup.rotation.x = 0.20;

// Interactive Drag Rotation
let isDragging = false;
let prevMouse = { x: 0, y: 0 };
let targetRotY = earthGroup.rotation.y;
let targetRotX = earthGroup.rotation.x;

function onPointerDown(e) {
  isDragging = true;
  prevMouse = { x: e.clientX || (e.touches && e.touches[0].clientX), y: e.clientY || (e.touches && e.touches[0].clientY) };
}

function onPointerMove(e) {
  if (!isDragging) return;
  const x = e.clientX || (e.touches && e.touches[0].clientX);
  const y = e.clientY || (e.touches && e.touches[0].clientY);
  const dx = x - prevMouse.x;
  const dy = y - prevMouse.y;
  targetRotY += dx * 0.005;
  targetRotX += dy * 0.005;
  targetRotX = Math.max(-0.85, Math.min(0.85, targetRotX));
  prevMouse = { x, y };
}

function onPointerUp() { isDragging = false; }

window.addEventListener('mousedown', onPointerDown);
window.addEventListener('mousemove', onPointerMove);
window.addEventListener('mouseup', onPointerUp);
window.addEventListener('touchstart', onPointerDown, { passive: true });
window.addEventListener('touchmove', onPointerMove, { passive: true });
window.addEventListener('touchend', onPointerUp);

// Public API hooks for Replay Archive DOM communication
window.samvayaArchiveSetStep = function(stepIndex) {
  currentReplayStep = stepIndex;
  drawArchiveEarth(currentReplayStep, currentArchiveMode);
  earthTexture.needsUpdate = true;
};

window.samvayaArchiveSetMode = function(modeName) {
  currentArchiveMode = modeName;
  drawArchiveEarth(currentReplayStep, currentArchiveMode);
  earthTexture.needsUpdate = true;
};

window.samvayaArchiveZoom = function(delta) {
  camera.position.z = Math.max(7.2, Math.min(16, camera.position.z + delta));
};

function handleResize() {
  const w = container.clientWidth || window.innerWidth;
  const h = container.clientHeight || window.innerHeight;
  camera.aspect = w / h;
  camera.updateProjectionMatrix();
  renderer.setSize(w, h);
}
window.addEventListener('resize', handleResize);

let clock = new THREE.Clock();
function animate() {
  requestAnimationFrame(animate);
  const t = clock.getElapsedTime();

  earthGroup.rotation.y += (targetRotY - earthGroup.rotation.y) * 0.08;
  earthGroup.rotation.x += (targetRotX - earthGroup.rotation.x) * 0.08;

  cloudMesh.rotation.y += 0.0008;

  // Pulse active beacon
  const s = 1.0 + Math.sin(t * 3.2) * 0.28;
  rMesh.scale.set(s, s, s);
  const dS = 1.0 + Math.sin(t * 1.8) * 0.12;
  dMesh.scale.set(dS, dS, dS);

  renderer.render(scene, camera);
}
animate();

})();
</script>
</div>
<!-- STITCH_THREEJS_END:ANIMATION_33 -->
</body>
</html>
