<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width,initial-scale=1.0" name="viewport"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
    }
  </style>
</head>
<body>
<!-- STITCH_THREEJS_START:ANIMATION_94 class="fixed inset-0 w-full h-full bg-transparent" -->
<div class="fixed inset-0 w-full h-full bg-transparent" style="display:block;">
<script src="https://ajax.googleapis.com/ajax/libs/threejs/r125/three.min.js"></script>
<div id="threejs-container-ANIMATION_94" style="width:100%;height:100%"></div>
<script>
(function() {
  const container = document.getElementById('threejs-container-ANIMATION_94');
  const devicePixelRatio = window.devicePixelRatio || 1;
  // SAMVAYA — Global Atmospheric Discovery: 3D Planetary Earth & Atmospheric Navigator
// Features: Full-fidelity interactive 3D WebGL Earth globe with procedural atmospheric circulation,
// multi-layer spatial projection (Temperature, Precipitation, Wind vectors, Barometric Pressure isobars,
// Cloud Stratification, Model Agreement consensus, Confidence envelopes, and Extreme Risk hotspots),
// realistic day/night solar terminator transition, interactive spin/drag/zoom controls, and runtime DOM APIs.

const container = document.getElementById('threejs-container-ANIMATION_GLOBAL_DISCOVERY') || document.querySelector('threejs-scene') || document.body;
const width = container.clientWidth || window.innerWidth;
const height = container.clientHeight || window.innerHeight;

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(35, width / height, 0.1, 1000);
camera.position.set(0.0, 0.35, 11.2);

const renderer = new THREE.WebGLRenderer({ alpha: true, antialias: true, powerPreference: "high-performance" });
renderer.setSize(width, height);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
container.appendChild(renderer.domElement);

// Lighting setup matching SAMVAYA warm scientific palette
const ambientLight = new THREE.AmbientLight(0xfff8f2, 1.65);
scene.add(ambientLight);

// Primary Sun Directional Light (simulating planetary day/night solar illumination)
const sunLight = new THREE.DirectionalLight(0xffeedb, 3.4);
sunLight.position.set(18, 10, 16);
scene.add(sunLight);

// Warm Terrestrial Fill Light
const warmFill = new THREE.DirectionalLight(0xdf7a28, 1.05);
warmFill.position.set(-16, -6, -10);
scene.add(warmFill);

// Main Planetary Earth Group
const earthGroup = new THREE.Group();
earthGroup.position.set(0.0, -0.04, 0);
scene.add(earthGroup);

// Canvas procedural texture for Earth surface & dynamic atmospheric layers
const canvas = document.createElement('canvas');
canvas.width = 2048;
canvas.height = 1024;
const ctx = canvas.getContext('2d');

function toCanvasX(lon) { return ((lon + 180) / 360) * 2048; }
function toCanvasY(lat) { return ((90 - lat) / 180) * 1024; }

let currentActiveLayer = 'WIND'; // 'TEMPERATURE', 'PRECIPITATION', 'WIND', 'PRESSURE', 'CLOUDS', 'AGREEMENT', 'CONFIDENCE', 'EXTREME'
let currentHorizonStep = 'NOW'; // '-24H', '-12H', 'NOW', '+6H', '+12H', '+24H', '+48H', '+72H'
let currentDayNight = true;

function drawGlobalEarth(layer, horizon) {
  // Deep oceanic slate/navy base with subtle bathymetric depth
  const oceanGrad = ctx.createLinearGradient(0, 0, 0, 1024);
  oceanGrad.addColorStop(0, '#0a1017');
  oceanGrad.addColorStop(0.5, '#121e2c');
  oceanGrad.addColorStop(1, '#0a1017');
  ctx.fillStyle = oceanGrad;
  ctx.fillRect(0, 0, 2048, 1024);

  // Continental landmasses (Warm earthy umber bedrock)
  ctx.fillStyle = '#3a2d21';

  // Indian Subcontinent & South Asia
  ctx.beginPath();
  ctx.moveTo(toCanvasX(68), toCanvasY(24));
  ctx.lineTo(toCanvasX(73), toCanvasY(35));
  ctx.lineTo(toCanvasX(80), toCanvasY(33));
  ctx.lineTo(toCanvasX(92), toCanvasY(27));
  ctx.lineTo(toCanvasX(91), toCanvasY(20));
  ctx.lineTo(toCanvasX(82), toCanvasY(13));
  ctx.lineTo(toCanvasX(77.5), toCanvasY(8));
  ctx.lineTo(toCanvasX(72.5), toCanvasY(16));
  ctx.lineTo(toCanvasX(68), toCanvasY(24));
  ctx.closePath();
  ctx.fill();

  // India highlight (Terracotta tone)
  ctx.fillStyle = '#7a3e1d';
  ctx.beginPath();
  ctx.moveTo(toCanvasX(70), toCanvasY(23));
  ctx.lineTo(toCanvasX(74), toCanvasY(32));
  ctx.lineTo(toCanvasX(86), toCanvasY(27));
  ctx.lineTo(toCanvasX(80), toCanvasY(14));
  ctx.lineTo(toCanvasX(77.5), toCanvasY(9));
  ctx.lineTo(toCanvasX(74), toCanvasY(17));
  ctx.closePath();
  ctx.fill();

  // Sri Lanka
  ctx.beginPath();
  ctx.arc(toCanvasX(80.5), toCanvasY(7.5), 9, 0, Math.PI * 2);
  ctx.fill();

  // Arabian Peninsula
  ctx.fillStyle = '#4c3725';
  ctx.beginPath();
  ctx.moveTo(toCanvasX(35), toCanvasY(32));
  ctx.lineTo(toCanvasX(55), toCanvasY(31));
  ctx.lineTo(toCanvasX(60), toCanvasY(24));
  ctx.lineTo(toCanvasX(54), toCanvasY(15));
  ctx.lineTo(toCanvasX(44), toCanvasY(12));
  ctx.lineTo(toCanvasX(42), toCanvasY(25));
  ctx.closePath();
  ctx.fill();

  // Africa
  ctx.beginPath();
  ctx.moveTo(toCanvasX(12), toCanvasY(36));
  ctx.lineTo(toCanvasX(32), toCanvasY(32));
  ctx.lineTo(toCanvasX(51), toCanvasY(12));
  ctx.lineTo(toCanvasX(42), toCanvasY(-10));
  ctx.lineTo(toCanvasX(30), toCanvasY(-34));
  ctx.lineTo(toCanvasX(17), toCanvasY(-34));
  ctx.lineTo(toCanvasX(8), toCanvasY(4));
  ctx.lineTo(toCanvasX(-16), toCanvasY(12));
  ctx.lineTo(toCanvasX(0), toCanvasY(35));
  ctx.closePath();
  ctx.fill();

  // Europe & Eurasia
  ctx.beginPath();
  ctx.moveTo(toCanvasX(60), toCanvasY(35));
  ctx.lineTo(toCanvasX(125), toCanvasY(42));
  ctx.lineTo(toCanvasX(145), toCanvasY(65));
  ctx.lineTo(toCanvasX(55), toCanvasY(68));
  ctx.lineTo(toCanvasX(-8), toCanvasY(58));
  ctx.lineTo(toCanvasX(12), toCanvasY(45));
  ctx.closePath();
  ctx.fill();

  // East Asia & Japan
  ctx.beginPath();
  ctx.moveTo(toCanvasX(118), toCanvasY(38));
  ctx.lineTo(toCanvasX(128), toCanvasY(44));
  ctx.lineTo(toCanvasX(140), toCanvasY(40));
  ctx.lineTo(toCanvasX(132), toCanvasY(30));
  ctx.closePath();
  ctx.fill();

  // Southeast Asia & Australia
  ctx.beginPath();
  ctx.moveTo(toCanvasX(96), toCanvasY(20));
  ctx.lineTo(toCanvasX(108), toCanvasY(11));
  ctx.lineTo(toCanvasX(102), toCanvasY(1));
  ctx.lineTo(toCanvasX(98), toCanvasY(10));
  ctx.closePath();
  ctx.fill();

  ctx.beginPath();
  ctx.ellipse(toCanvasX(134), toCanvasY(-25), 115, 78, 0, 0, Math.PI * 2);
  ctx.fill();

  // North America
  ctx.beginPath();
  ctx.moveTo(toCanvasX(-125), toCanvasY(48));
  ctx.lineTo(toCanvasX(-70), toCanvasY(45));
  ctx.lineTo(toCanvasX(-80), toCanvasY(25));
  ctx.lineTo(toCanvasX(-105), toCanvasY(20));
  ctx.lineTo(toCanvasX(-120), toCanvasY(35));
  ctx.closePath();
  ctx.fill();

  // South America
  ctx.beginPath();
  ctx.moveTo(toCanvasX(-78), toCanvasY(10));
  ctx.lineTo(toCanvasX(-40), toCanvasY(-6));
  ctx.lineTo(toCanvasX(-55), toCanvasY(-30));
  ctx.lineTo(toCanvasX(-68), toCanvasY(-50));
  ctx.lineTo(toCanvasX(-75), toCanvasY(-20));
  ctx.closePath();
  ctx.fill();

  const mX = toCanvasX(76.6394); // Mysuru Lon
  const mY = toCanvasY(12.2958); // Mysuru Lat
  const bX = toCanvasX(88.0); // Bay of Bengal Lon
  const bY = toCanvasY(14.5); // Bay of Bengal Lat

  // 1. LAYER RENDERING
  if (layer === 'TEMPERATURE') {
    // Thermal equator belt (warm amber and terracotta gradients)
    const tGrad = ctx.createLinearGradient(0, toCanvasY(40), 0, toCanvasY(-30));
    tGrad.addColorStop(0, 'rgba(217, 119, 6, 0.15)');
    tGrad.addColorStop(0.35, 'rgba(234, 88, 12, 0.55)');
    tGrad.addColorStop(0.5, 'rgba(194, 94, 26, 0.70)');
    tGrad.addColorStop(0.65, 'rgba(234, 88, 12, 0.55)');
    tGrad.addColorStop(1, 'rgba(217, 119, 6, 0.15)');
    ctx.fillStyle = tGrad;
    ctx.fillRect(0, toCanvasY(40), 2048, toCanvasY(-30) - toCanvasY(40));

    // Hotspot anomalies over Deccan & Sub-Sahara
    const hGrad = ctx.createRadialGradient(mX + 40, mY - 20, 20, mX + 40, mY - 20, 280);
    hGrad.addColorStop(0, 'rgba(234, 88, 12, 0.85)');
    hGrad.addColorStop(0.6, 'rgba(194, 94, 26, 0.45)');
    hGrad.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.fillStyle = hGrad;
    ctx.beginPath();
    ctx.arc(mX + 40, mY - 20, 280, 0, Math.PI * 2);
    ctx.fill();
  } else if (layer === 'PRECIPITATION') {
    // Major ITCZ and Tropical Precipitation Systems (Bay of Bengal, Western Ghats, Maritime Continent)
    const pGrad1 = ctx.createRadialGradient(bX, bY, 20, bX, bY, 320);
    pGrad1.addColorStop(0, 'rgba(194, 94, 26, 0.85)');
    pGrad1.addColorStop(0.45, 'rgba(217, 119, 6, 0.50)');
    pGrad1.addColorStop(0.8, 'rgba(90, 98, 64, 0.25)');
    pGrad1.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.fillStyle = pGrad1;
    ctx.beginPath();
    ctx.arc(bX, bY, 320, 0, Math.PI * 2);
    ctx.fill();

    // Secondary system over Western Pacific
    const pGrad2 = ctx.createRadialGradient(toCanvasX(130), toCanvasY(12), 20, toCanvasX(130), toCanvasY(12), 260);
    pGrad2.addColorStop(0, 'rgba(217, 119, 6, 0.78)');
    pGrad2.addColorStop(0.5, 'rgba(194, 94, 26, 0.40)');
    pGrad2.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.fillStyle = pGrad2;
    ctx.beginPath();
    ctx.arc(toCanvasX(130), toCanvasY(12), 260, 0, Math.PI * 2);
    ctx.fill();

    // Radar isohyet boundary rings
    ctx.strokeStyle = 'rgba(255, 237, 213, 0.60)';
    ctx.lineWidth = 1.5;
    ctx.setLineDash([4, 6]);
    ctx.beginPath();
    ctx.arc(bX, bY, 110, 0, Math.PI * 2);
    ctx.stroke();
    ctx.beginPath();
    ctx.arc(bX, bY, 220, 0, Math.PI * 2);
    ctx.stroke();
    ctx.setLineDash([]);
  } else if (layer === 'WIND') {
    // Global Circulation & Trade Winds (Curved stream filaments)
    ctx.strokeStyle = 'rgba(217, 119, 6, 0.70)';
    ctx.lineWidth = 1.8;
    for (let lat = -50; lat <= 50; lat += 20) {
      const y0 = toCanvasY(lat);
      for (let x = 0; x < 2048; x += 180) {
        ctx.beginPath();
        ctx.moveTo(x, y0);
        ctx.bezierCurveTo(x + 50, y0 - 15, x + 110, y0 + 15, x + 160, y0 - 8);
        ctx.stroke();
      }
    }
    // High-Velocity Jetstream corridor
    ctx.strokeStyle = 'rgba(255, 237, 213, 0.85)';
    ctx.lineWidth = 2.2;
    for (let x = 0; x < 2048; x += 120) {
      ctx.beginPath();
      ctx.moveTo(x, toCanvasY(38));
      ctx.lineTo(x + 60, toCanvasY(38) + 6);
      ctx.stroke();
    }
  } else if (layer === 'PRESSURE') {
    // Isobaric Atmospheric Contours over South Asia & Oceans
    ctx.strokeStyle = 'rgba(255, 248, 240, 0.55)';
    ctx.lineWidth = 1.4;
    for (let r = 50; r <= 360; r += 45) {
      ctx.beginPath();
      ctx.arc(bX, bY, r, 0, Math.PI * 2);
      ctx.stroke();
    }
    // Low Pressure Core Label
    ctx.fillStyle = 'rgba(217, 119, 6, 0.85)';
    ctx.font = 'bold 22px monospace';
    ctx.fillText('L 998 hPa', bX - 45, bY + 8);
  } else if (layer === 'CLOUDS') {
    // Diffused stratiform layer on surface
    const cGrad = ctx.createRadialGradient(bX, bY, 30, bX, bY, 400);
    cGrad.addColorStop(0, 'rgba(255, 248, 240, 0.70)');
    cGrad.addColorStop(0.5, 'rgba(220, 212, 202, 0.40)');
    cGrad.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.fillStyle = cGrad;
    ctx.beginPath();
    ctx.arc(bX, bY, 400, 0, Math.PI * 2);
    ctx.fill();
  } else if (layer === 'AGREEMENT') {
    // High Agreement Envelopes across models (Restrained olive / amber)
    const aGrad = ctx.createRadialGradient(mX, mY, 30, mX, mY, 350);
    aGrad.addColorStop(0, 'rgba(90, 98, 64, 0.85)');
    aGrad.addColorStop(0.5, 'rgba(217, 119, 6, 0.40)');
    aGrad.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.fillStyle = aGrad;
    ctx.beginPath();
    ctx.arc(mX, mY, 350, 0, Math.PI * 2);
    ctx.fill();
  } else if (layer === 'CONFIDENCE') {
    // Global confidence distribution
    const cGrad = ctx.createRadialGradient(mX, mY, 20, mX, mY, 320);
    cGrad.addColorStop(0, 'rgba(180, 83, 9, 0.82)');
    cGrad.addColorStop(0.6, 'rgba(217, 119, 6, 0.35)');
    cGrad.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.fillStyle = cGrad;
    ctx.beginPath();
    ctx.arc(mX, mY, 320, 0, Math.PI * 2);
    ctx.fill();
  } else if (layer === 'EXTREME') {
    // Discrete extreme risk hotspots (Heavy Rain over Ghats, Tropical Disturbance over Bay, Heat over Deccan)
    const eGrad1 = ctx.createRadialGradient(mX, mY, 15, mX, mY, 220);
    eGrad1.addColorStop(0, 'rgba(194, 94, 26, 0.90)');
    eGrad1.addColorStop(0.5, 'rgba(217, 119, 6, 0.45)');
    eGrad1.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.fillStyle = eGrad1;
    ctx.beginPath();
    ctx.arc(mX, mY, 220, 0, Math.PI * 2);
    ctx.fill();

    const eGrad2 = ctx.createRadialGradient(bX, bY, 10, bX, bY, 200);
    eGrad2.addColorStop(0, 'rgba(186, 26, 26, 0.85)');
    eGrad2.addColorStop(0.5, 'rgba(194, 94, 26, 0.40)');
    eGrad2.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.fillStyle = eGrad2;
    ctx.beginPath();
    ctx.arc(bX, bY, 200, 0, Math.PI * 2);
    ctx.fill();
  }

  // Coordinate grid lines (delicate white latitude & longitude parallels)
  ctx.strokeStyle = 'rgba(255, 255, 255, 0.08)';
  ctx.lineWidth = 1.0;
  for (let lat = -80; lat <= 80; lat += 20) {
    ctx.beginPath();
    ctx.moveTo(0, toCanvasY(lat));
    ctx.lineTo(2048, toCanvasY(lat));
    ctx.stroke();
  }
  for (let lon = -180; lon <= 180; lon += 30) {
    ctx.beginPath();
    ctx.moveTo(toCanvasX(lon), 0);
    ctx.lineTo(toCanvasX(lon), 1024);
    ctx.stroke();
  }
}

drawGlobalEarth(currentActiveLayer, currentHorizonStep);
const earthTexture = new THREE.CanvasTexture(canvas);
earthTexture.wrapS = THREE.RepeatWrapping;

// Globe Sphere Mesh
const globeRadius = 4.65;
const globeGeometry = new THREE.SphereGeometry(globeRadius, 64, 64);
const globeMaterial = new THREE.MeshPhongMaterial({
  map: earthTexture,
  bumpScale: 0.06,
  specular: new THREE.Color(0x384556),
  shininess: 18,
  emissive: new THREE.Color(0x161009),
  emissiveIntensity: 0.18
});
const globeMesh = new THREE.Mesh(globeGeometry, globeMaterial);
earthGroup.add(globeMesh);

// Dynamic Atmospheric Cloud Stratification Layer
const cloudCanvas = document.createElement('canvas');
cloudCanvas.width = 1024;
cloudCanvas.height = 512;
const cCtx = cloudCanvas.getContext('2d');
cCtx.fillStyle = 'rgba(0,0,0,0)';
cCtx.fillRect(0, 0, 1024, 512);
cCtx.fillStyle = 'rgba(255, 250, 242, 0.44)';
for (let i = 0; i < 48; i++) {
  const cx = Math.random() * 1024;
  const cy = 50 + Math.random() * 410;
  const rx = 35 + Math.random() * 120;
  const ry = 8 + Math.random() * 28;
  cCtx.beginPath();
  cCtx.ellipse(cx, cy, rx, ry, (Math.random() - 0.5) * 0.35, 0, Math.PI * 2);
  cCtx.fill();
}
const cloudTexture = new THREE.CanvasTexture(cloudCanvas);
const cloudGeo = new THREE.SphereGeometry(globeRadius + 0.08, 64, 64);
const cloudMat = new THREE.MeshLambertMaterial({
  map: cloudTexture,
  transparent: true,
  opacity: 0.56,
  blending: THREE.NormalBlending
});
const cloudMesh = new THREE.Mesh(cloudGeo, cloudMat);
earthGroup.add(cloudMesh);

// Rayleigh Atmospheric Halo
const haloGeo = new THREE.SphereGeometry(globeRadius + 0.44, 48, 48);
const haloMat = new THREE.ShaderMaterial({
  vertexShader: `
    varying vec3 vNormal;
    void main() {
      vNormal = normalize(normalMatrix * normal);
      gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
    }
  `,
  fragmentShader: `
    varying vec3 vNormal;
    void main() {
      float intensity = pow(0.66 - dot(vNormal, vec3(0, 0, 1.0)), 2.6);
      vec3 atmosphericColor = mix(vec3(0.88, 0.48, 0.16), vec3(0.98, 0.89, 0.78), intensity * 0.65);
      gl_FragColor = vec4(atmosphericColor, intensity * 0.76);
    }
  `,
  blending: THREE.AdditiveBlending,
  side: THREE.BackSide,
  transparent: true
});
const haloMesh = new THREE.Mesh(haloGeo, haloMat);
earthGroup.add(haloMesh);

// Helper for Lat/Lon to 3D Cartesian Coordinate
function calculatePinPos(lat, lon, rOffset = 0.12) {
  const phi = (90 - lat) * (Math.PI / 180);
  const theta = (lon + 180) * (Math.PI / 180);
  const pinR = globeRadius + rOffset;
  return new THREE.Vector3(
    -pinR * Math.sin(phi) * Math.cos(theta),
    pinR * Math.cos(phi),
    pinR * Math.sin(phi) * Math.sin(theta)
  );
}

// Synoptic Anchor: Mysuru Observatory (12.2958° N, 76.6394° E)
const posMysuru = calculatePinPos(12.2958, 76.6394);
const anchorMysuru = new THREE.Group();
anchorMysuru.position.copy(posMysuru);

// Core center pin
const cGeo = new THREE.SphereGeometry(0.12, 16, 16);
const cMat = new THREE.MeshBasicMaterial({ color: 0xc25e1a });
const cMesh = new THREE.Mesh(cGeo, cMat);
anchorMysuru.add(cMesh);

// Inner pulsing ring
const fRingGeo = new THREE.RingGeometry(0.16, 0.28, 32);
const fRingMat = new THREE.MeshBasicMaterial({ color: 0xd97706, side: THREE.DoubleSide, transparent: true, opacity: 0.85 });
const fRingMesh = new THREE.Mesh(fRingGeo, fRingMat);
fRingMesh.lookAt(posMysuru.clone().normalize());
anchorMysuru.add(fRingMesh);

// Outer spatial uncertainty boundary ring
const oRingGeo = new THREE.RingGeometry(0.44, 0.66, 48);
const oRingMat = new THREE.MeshBasicMaterial({ color: 0xfff8f5, side: THREE.DoubleSide, transparent: true, opacity: 0.45 });
const oRingMesh = new THREE.Mesh(oRingGeo, oRingMat);
oRingMesh.lookAt(posMysuru.clone().normalize());
anchorMysuru.add(oRingMesh);

earthGroup.add(anchorMysuru);

// Synoptic Anchor: Bay of Bengal Low System (14.5° N, 88.0° E)
const posBay = calculatePinPos(14.5, 88.0);
const anchorBay = new THREE.Group();
anchorBay.position.copy(posBay);

const bGeo = new THREE.SphereGeometry(0.11, 16, 16);
const bMat = new THREE.MeshBasicMaterial({ color: 0xd97706 });
const bMesh = new THREE.Mesh(bGeo, bMat);
anchorBay.add(bMesh);

const bRingGeo = new THREE.RingGeometry(0.24, 0.42, 32);
const bRingMat = new THREE.MeshBasicMaterial({ color: 0xc25e1a, side: THREE.DoubleSide, transparent: true, opacity: 0.80 });
const bRingMesh = new THREE.Mesh(bRingGeo, bRingMat);
bRingMesh.lookAt(posBay.clone().normalize());
anchorBay.add(bRingMesh);

earthGroup.add(anchorBay);

// Initial Camera Orientation centered over South Asia & Indian Ocean
earthGroup.rotation.y = -1.75;
earthGroup.rotation.x = 0.22;

// Interactive Drag Rotation
let isDragging = false;
let prevMouse = { x: 0, y: 0 };
let targetRotY = earthGroup.rotation.y;
let targetRotX = earthGroup.rotation.x;

function onPointerDown(e) {
  isDragging = true;
  prevMouse = { x: e.clientX || (e.touches && e.touches[0].clientX), y: e.clientY || (e.touches && e.touches[0].clientY) };
}

function onPointerMove(e) {
  if (!isDragging) return;
  const x = e.clientX || (e.touches && e.touches[0].clientX);
  const y = e.clientY || (e.touches && e.touches[0].clientY);
  const dx = x - prevMouse.x;
  const dy = y - prevMouse.y;
  targetRotY += dx * 0.005;
  targetRotX += dy * 0.005;
  targetRotX = Math.max(-0.85, Math.min(0.85, targetRotX));
  prevMouse = { x, y };
}

function onPointerUp() { isDragging = false; }

window.addEventListener('mousedown', onPointerDown);
window.addEventListener('mousemove', onPointerMove);
window.addEventListener('mouseup', onPointerUp);
window.addEventListener('touchstart', onPointerDown, { passive: true });
window.addEventListener('touchmove', onPointerMove, { passive: true });
window.addEventListener('touchend', onPointerUp);

// Public API hooks for Global Discovery DOM communication
window.samvayaGlobalSetLayer = function(layerName) {
  currentActiveLayer = layerName.toUpperCase();
  drawGlobalEarth(currentActiveLayer, currentHorizonStep);
  earthTexture.needsUpdate = true;
};

window.samvayaGlobalSetHorizon = function(horizon) {
  currentHorizonStep = horizon;
  drawGlobalEarth(currentActiveLayer, currentHorizonStep);
  earthTexture.needsUpdate = true;
};

window.samvayaGlobalFocus = function(target) {
  if (target === 'INDIA' || target === 'MYSURU') {
    targetRotY = -1.75;
    targetRotX = 0.22;
    camera.position.set(0.0, 0.35, 10.8);
  } else if (target === 'BAY_OF_BENGAL') {
    targetRotY = -2.10;
    targetRotX = 0.25;
    camera.position.set(0.0, 0.35, 9.8);
  } else if (target === 'EUROPE') {
    targetRotY = -0.30;
    targetRotX = 0.65;
    camera.position.set(0.0, 0.35, 10.8);
  } else if (target === 'PACIFIC') {
    targetRotY = -3.80;
    targetRotX = 0.15;
    camera.position.set(0.0, 0.35, 11.2);
  } else if (target === 'RESET') {
    targetRotY = -1.75;
    targetRotX = 0.22;
    camera.position.set(0.0, 0.35, 11.2);
  }
};

window.samvayaGlobalZoom = function(delta) {
  camera.position.z = Math.max(7.2, Math.min(16, camera.position.z + delta));
};

function handleResize() {
  const w = container.clientWidth || window.innerWidth;
  const h = container.clientHeight || window.innerHeight;
  camera.aspect = w / h;
  camera.updateProjectionMatrix();
  renderer.setSize(w, h);
}
window.addEventListener('resize', handleResize);

let clock = new THREE.Clock();
function animate() {
  requestAnimationFrame(animate);
  const t = clock.getElapsedTime();

  earthGroup.rotation.y += (targetRotY - earthGroup.rotation.y) * 0.08;
  earthGroup.rotation.x += (targetRotX - earthGroup.rotation.x) * 0.08;

  cloudMesh.rotation.y += 0.00065;

  // Pulse beacon rings
  const s = 1.0 + Math.sin(t * 2.8) * 0.20;
  fRingMesh.scale.set(s, s, s);
  const dS = 1.0 + Math.sin(t * 1.5) * 0.10;
  oRingMesh.scale.set(dS, dS, dS);
  const bS = 1.0 + Math.sin(t * 2.2) * 0.15;
  bRingMesh.scale.set(bS, bS, bS);

  renderer.render(scene, camera);
}
animate();

})();
</script>
